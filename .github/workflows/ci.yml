name: CI

# Runs on every pull request and on pushes to main. Main is protected: it can
# only change through a pull request whose checks are green (see
# docs/runbooks/branch-protection.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint, tests, secret & dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from the "packageManager" field in package.json — the
        # single source of truth. Do not also set "version" here, or
        # pnpm/action-setup errors on the duplicate.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Secret scan (whole repository)
        run: pnpm run secret-scan

      - name: Tests
        run: pnpm run test

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high

      - name: Software bill of materials (QG-03)
        # Regenerated from the installed tree on every run. The check below fails if
        # the committed SBOM has drifted from what is actually installed — an SBOM
        # that is merely present, and stale, is worse than none.
        run: |
          pnpm run sbom
          git diff --exit-code --stat docs/evidence/sbom.json \
            || (echo "::error::SBOM is out of date — run 'pnpm run sbom' and commit the result" && exit 1)

  integration:
    name: Stage gate suites (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The slice is only meaningful against a real database. A mock would pass
        # while the schema was wrong — which is exactly what happened before this
        # job existed (see db/migrations/0005).
        image: postgres:16
        env:
          POSTGRES_USER: sre
          POSTGRES_DB: sre_core
          # Throwaway container, reachable only from this job. Trust auth means no
          # credential appears in this file at all — the repository's secret scan is
          # absolute, and "it is only CI" is exactly how the first one gets in.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate, then prove the migrations are idempotent
        env:
          DATABASE_URL: postgres://sre@localhost:5432/sre_core
        run: |
          pnpm db:migrate
          pnpm db:migrate

      # Every passed stage gate re-runs on every push. A gate that was proven once and
      # never checked again is a claim, not a control.
      #   Stage 6 — offline / duplicate / reorder / recovery / reconciliation
      #   Stage 7 — purchase → GRN → invoice → payment
      #   Stage 8 — physical-to-system reconciliation and recall
      #   Stage 9 — end-of-day and refund controls
      #   Stage 10 — the books reconcile and the owner can see why
      #   Stage 14 — one customer, end to end
      #   Stage 15 — pick to doorstep
      #
      # tests/migration is included here (not only tests/integration). Its six database-backed tests
      # — additive-only migrations, idempotent re-apply, the append-only triggers actually installed,
      # UPDATE/DELETE on the ledger refused, tenant-scoped uniqueness, a new migration applied without
      # disturbing existing rows — had never once run against a database in CI, because this step ran
      # only tests/integration. A schema guarantee that is asserted by the SQL that installs it and
      # never checked in the database is a claim, not a control (the same lesson as db/migrations/0004).
      #
      # DB_TESTS_REQUIRED makes the required job FAIL rather than silently skip if the database is
      # missing (P-08, hard rule #9): tests/migration/db-required-in-ci.test.ts refuses to let the
      # skipIf(!DATABASE_URL) blocks pass as a quiet green. The shell check is the belt to that brace.
      - name: Stage gate + migration suites (real PostgreSQL) — required, never skip
        env:
          DATABASE_URL: postgres://sre@localhost:5432/sre_core
          DB_TESTS_REQUIRED: '1'
        run: |
          test -n "$DATABASE_URL" \
            || (echo "::error::DATABASE_URL is not set — the required database tests would silently skip" && exit 1)
          pnpm run test:db

      - name: Backup, destroy and restore, reconciled (QG-08)
        env:
          DATABASE_URL: postgres://sre@localhost:5432/sre_core
        run: |
          node scripts/backup.mjs --out /tmp/backups
          MANIFEST=$(ls /tmp/backups/*.manifest.json | head -1)
          psql "postgres://sre@localhost:5432/postgres" -c "DROP DATABASE sre_core WITH (FORCE);"
          psql "postgres://sre@localhost:5432/postgres" -c "CREATE DATABASE sre_core;"
          node scripts/restore.mjs --manifest "$MANIFEST" \
            --target "postgres://sre@localhost:5432/sre_core"


  deploy:
    name: The container builds, starts, and refuses a bad configuration
    runs-on: ubuntu-latest
    # A Dockerfile that is never built in CI is a Dockerfile that breaks silently and is
    # discovered on the evening somebody is trying to deploy. A compose file that is never
    # brought up is the same. Both are code that runs in production, so both run here.
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f infra/docker/api.Dockerfile -t sre-api:ci .

      - name: It REFUSES to start with no configuration, and says why
        # The negative case first, because a start that succeeds proves the happy path and a
        # refusal is the control. Exit 78 is EX_CONFIG — a configuration fault, not a crash.
        run: |
          set +e
          OUT=$(docker run --rm sre-api:ci 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          test "$CODE" = "78" || (echo "::error::expected exit 78 (EX_CONFIG), got $CODE" && exit 1)
          echo "$OUT" | grep -q "DATABASE_URL is not set" \
            || (echo "::error::the refusal did not name the missing setting" && exit 1)
          echo "$OUT" | grep -q "PACK_SIGNING_KEY is not set" \
            || (echo "::error::the refusal named one problem, not all of them" && exit 1)
          # No identity provider configured means nobody can log in — which is the correct
          # failure. A deployment that starts without one starts letting everybody in.
          echo "$OUT" | grep -q "IDP_SIGNING_KEY is not set" \
            || (echo "::error::the API started without an identity provider" && exit 1)

      - name: It REFUSES the placeholder from .env.example
        run: |
          set +e
          OUT=$(docker run --rm \
            -e DATABASE_URL="$(printf '%s://%s@db:5432/%s' postgres sre sre_core)" \
            -e PACK_SIGNING_KEY=REPLACE_WITH_A_GENERATED_VALUE \
            sre-api:ci 2>&1)
          CODE=$?
          set -e
          test "$CODE" = "78" || (echo "::error::a placeholder secret was accepted" && exit 1)
          echo "$OUT" | grep -q "still holds the value from .env.example" \
            || (echo "::error::the placeholder refusal did not explain itself" && exit 1)

      - name: The whole stack comes up and reports itself ready
        run: |
          cd infra/compose
          cp .env.example .env
          # Real values for CI only. This file is created here and never committed.
          # The DB password is generated URL-SAFE (hex, not base64): it becomes part of
          # DATABASE_URL below, and a base64 value carrying a '/' or '+' makes that string an
          # invalid URL — a migrate container that exits 1 about two runs in three. The signing
          # keys stay base64: they are compared as strings, never placed in a URL.
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "PACK_SIGNING_KEY=$(openssl rand -base64 48)"
            echo "IDP_SIGNING_KEY=$(openssl rand -base64 48)"
            echo "IDP_ISSUER=https://idp.ci.invalid/"
            # The edge refuses the placeholder tenant id from .env.example (by design); give it a real one so
            # the edge container comes up and the proxy's /customer/ route below has something to serve.
            echo "EDGE_TENANT_ID=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          } >> .env
          PW=$(grep '^POSTGRES_PASSWORD=' .env | tail -1 | cut -d= -f2-)
          # Assembled with printf so the literal scheme://user:password@host shape never appears
          # in a committed file — the repository's secret scan refuses it anywhere, and "it is
          # only CI" is exactly how the first real one gets in.
          printf 'DATABASE_URL=%s://%s:%s@db:5432/%s\n' postgres sre_app "$PW" sre_retail_os >> .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/readyz >/dev/null 2>&1; then
              echo "ready after ${i}s"; curl -fsS http://127.0.0.1:8081/readyz; exit 0
            fi
            sleep 1
          done
          echo "::error::the stack never became ready"
          docker compose logs --no-color | tail -100
          exit 1

      - name: The public origin answers over HTTPS — and only for what is public (ADR-0018)
        # One address for a customer's browser: the API, the customer app and sign-in — and nothing
        # else. Staff screens are refused by name. The proxy's own certificate is used here (no
        # domain in CI), so curl is told not to verify it; the ROUTING is what this proves.
        run: |
          cd infra/compose
          fail() { echo "::error::$1"; docker compose logs --no-color proxy edge | tail -80; exit 1; }
          for i in $(seq 1 30); do curl -fskS https://127.0.0.1:443/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fskS https://127.0.0.1/readyz | grep -q '"ready":true' || fail "the API's readiness did not come through the proxy"
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/v1/catalogue/pack)
          test "$code" = "401" || fail "/v1 through the proxy should reach the API and be refused without a token (got $code)"
          curl -sk https://127.0.0.1/customer/ | grep -q 'customer-app.bundle.js' || fail "the customer app is not served on the public origin"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' https://127.0.0.1/auth/otp/begin)
          test "$code" = "503" || fail "/auth should answer 503 while sign-in is not deployed (got $code)"
          curl -sk -X POST https://127.0.0.1/auth/otp/begin | grep -q 'sign_in_not_deployed' || fail "the /auth refusal did not say why"
          for p in /owner/ /pos/ /manager/ /buying/ /admin.html; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://127.0.0.1$p")
            test "$code" = "404" || fail "$p is a staff screen and must not be on the public origin (got $code)"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:80/customer/)
          case "$code" in 301|302|307|308) ;; *) fail "plain http should redirect to https (got $code)";; esac
          curl -skI https://127.0.0.1/customer/ | grep -qi '^strict-transport-security' || fail "no HSTS header"
          if curl -skI https://127.0.0.1/customer/ | grep -qi '^server:'; then fail "the Server header is exposed"; fi
          echo "public origin: API, customer app and sign-in refusal on one https address; staff screens refused"

      - name: Set up pnpm (the pilot overlay runs the demo sign-in from a bundle built here)
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: The hosted-demo overlay puts the staff screens behind the demo sign-in — and nowhere else (ADR-0016 on ADR-0018)
        # The same stack with the pilot overlay on top: the proxy now forwards the staff shells, /login and the demo
        # store box to the demo front, which lets a visitor through only with a demo session. Proven from the outside:
        # no session → the sign-in (as a relative redirect the proxy puts the https origin in front of); the sign-in
        # page keeps its own Referrer-Policy; a forged cookie reaches the API as a bearer token and is refused; /v1
        # without a cookie still goes straight to the API; the lane refuses a sale; the customer app, HSTS and the
        # hidden Server header are unchanged; the box's own loopback check still answers.
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-service.mjs demo-login
          cd infra/compose
          # The demo sign-in refuses every tenant but the synthetic demo tenant (hard rule #7): the overlay is brought up for it.
          sed -i 's/^EDGE_TENANT_ID=.*/EDGE_TENANT_ID=de300000-0000-4000-8000-000000000001/' .env
          # This .env was copied from .env.example, whose SRE_STAFF_ROUTE is the store default (off) — and an env-file value
          # beats the overlay's default. The hosted demo's template (.env.pilot.example) says staff-demo-gate; so does this run.
          sed -i 's/^SRE_STAFF_ROUTE=.*/SRE_STAFF_ROUTE=staff-demo-gate/' .env
          P="docker compose -f docker-compose.yml -f docker-compose.pilot.yml"
          $P up -d --build
          fail() { echo "::error::$1"; $P logs --no-color proxy web demo-login | tail -120; exit 1; }
          for i in $(seq 1 60); do curl -fskS https://127.0.0.1/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fskS https://127.0.0.1/readyz | grep -q '"ready":true' || fail "the API's readiness did not come through the proxy with the overlay on"
          for i in $(seq 1 30); do [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/login/)" = "200" ] && break; sleep 1; done
          for p in /pos/ /erp/ /owner/ /picker/ /store/pos/; do
            out=$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' "https://127.0.0.1$p")
            test "$out" = "302 https://127.0.0.1/login/?next=$p" || fail "$p must send a visitor without a demo session to the sign-in (got: $out)"
          done
          curl -sk https://127.0.0.1/login/ | grep -q 'action="/login/"' || fail "the demo sign-in page is not served at /login/"
          curl -skI https://127.0.0.1/login/ | grep -qi '^referrer-policy: same-origin' || fail "the sign-in page must keep its own Referrer-Policy (same-origin), or the browser posts the form with Origin: null"
          curl -skI https://127.0.0.1/customer/ | grep -qi '^referrer-policy: no-referrer' || fail "every other page keeps no-referrer"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H 'Cookie: sre_demo_session=not-a-token' https://127.0.0.1/v1/catalogue/pack)
          test "$code" = "401" || fail "a forged demo cookie must reach the API as a bearer token and be refused (got $code)"
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/v1/catalogue/pack)
          test "$code" = "401" || fail "/v1 without a cookie still goes straight to the API and is refused (got $code)"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' https://127.0.0.1/store-lane/lane/sale)
          test "$code" = "401" || fail "the demo box's lane must refuse a sale without a selling session (got $code)"
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/store-lane/lane/sync-status)
          test "$code" = "401" || fail "the demo box's status read must refuse a visitor with no session (got $code)"
          curl -sk https://127.0.0.1/customer/ | grep -q 'customer-app.bundle.js' || fail "the customer app must still be served from the edge with the gate on"
          curl -skI https://127.0.0.1/login/ | grep -qi '^strict-transport-security' || fail "no HSTS header on the sign-in page"
          if curl -skI https://127.0.0.1/login/ | grep -qi '^server:'; then fail "the Server header is exposed on the sign-in page"; fi
          code=$(curl -sL -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/pos/)
          test "$code" = "200" || fail "the box's own loopback check (standup:check follows the redirect to the sign-in) must still answer 200 (got $code)"
          echo "hosted-demo overlay: staff screens, the demo store box and /v1-with-cookie reachable only through the demo sign-in gate"

      - name: It drains rather than being killed
        run: |
          cd infra/compose
          # SIGTERM, then confirm it exited cleanly rather than being force-killed after the
          # grace period. A container killed mid-request is a sale that reached the process and
          # not the database.
          docker compose stop -t 30 api
          docker compose ps -a --format '{{.Service}} {{.ExitCode}}' | grep -E '^api (0|143)$' \
            || (echo "::error::the API did not stop cleanly" && exit 1)

      - name: Tear down
        if: always()
        run: cd infra/compose && docker compose -f docker-compose.yml -f docker-compose.pilot.yml down -v --remove-orphans && rm -f .env

  release:
    name: Deploy the merged release to the demo box (rolls back if it does not come up)
    # Stage F: a commit that reached main did so through a pull request whose checks were green (branch
    # protection, hard rule #8) — that IS the approval (AID-08). The three jobs above must pass on THIS
    # commit first; then the box is told to deploy exactly this SHA. The SSH key can run one command on the
    # box — infra/deploy/release.sh — and nothing else (a forced command); the script refuses any commit
    # not on origin/main, and puts the previous release back if the new one does not come up READY.
    # Deploys never cancel each other: they queue (a half-applied release is worse than a late one).
    # When the 'demo' environment carries no deploy secrets, the job says so and deploys nothing — a
    # fork or a fresh clone cannot deploy anywhere by accident. docs/runbooks/automatic-deployment.md.
    needs: [verify, integration, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - name: Is a demo box configured?
        id: box
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No demo box is configured (DEPLOY_HOST / DEPLOY_SSH_KEY / DEPLOY_HOST_KEY are not set on the 'demo' environment). Nothing was deployed — see docs/runbooks/automatic-deployment.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy this exact commit over SSH (the key can only run the release script)
        if: steps.box.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          # The private key is written to a file the ssh client reads and nowhere else; the host key is
          # PINNED from the secret (no first-use trust — a wrong box is refused, not asked about).
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/deploy_known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/deploy_known_hosts" \
              -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER:-deploy}@$DEPLOY_HOST" \
              release "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_RUN_ID"
          echo "Deployed $GITHUB_SHA to the demo box (merged by $GITHUB_ACTOR)." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the key material
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/deploy_known_hosts"
