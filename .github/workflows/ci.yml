name: CI

# Runs on every pull request and on pushes to main. Main is protected: it can
# only change through a pull request whose checks are green (see
# docs/runbooks/branch-protection.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint, tests, secret & dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from the "packageManager" field in package.json — the
        # single source of truth. Do not also set "version" here, or
        # pnpm/action-setup errors on the duplicate.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Secret scan (whole repository)
        run: pnpm run secret-scan

      - name: Tests
        run: pnpm run test

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high

      - name: Dependency scan as recorded findings (QG-06) — every advisory, any severity, in the findings report
        # The step above is the gate (it fails on high). This one keeps EVERY advisory, medium and low included, as a
        # findings report for the security register (POST /v1/compliance/finding-scans). `pnpm audit` exits 1 whenever
        # it lists anything, so its exit is not the verdict; the judge is — and it refuses an empty or unreadable file.
        if: always()
        run: |
          mkdir -p scan-reports
          pnpm audit --json > scan-reports/pnpm-audit.raw.json || true
          node --experimental-strip-types scripts/scan-findings.mts --format pnpm-audit \
            --in scan-reports/pnpm-audit.raw.json --out scan-reports/pnpm-audit.findings.json

      - name: Keep the dependency findings report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-reports-dependencies
          path: scan-reports/
          if-no-files-found: warn

      - name: Software bill of materials (QG-03)
        # Regenerated from the installed tree on every run. The check below fails if
        # the committed SBOM has drifted from what is actually installed — an SBOM
        # that is merely present, and stale, is worse than none.
        run: |
          pnpm run sbom
          git diff --exit-code --stat docs/evidence/sbom.json \
            || (echo "::error::SBOM is out of date — run 'pnpm run sbom' and commit the result" && exit 1)

      - name: Evidence ledger is current — what kind of proof each requirement has, and every label holds (GT-08 / PF-15)
        # docs/evidence/evidence-ledger.md is generated from the completion ledger, the test tree and the SP-10
        # register. A stale copy, or a maturity label the evidence rule refuses (docs/evidence/TEST-SCOPE.md §4),
        # fails here by name — a label can only move up by adding the proof.
        run: node scripts/evidence-ledger.mjs --check

  integration:
    name: Stage gate suites (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The slice is only meaningful against a real database. A mock would pass
        # while the schema was wrong — which is exactly what happened before this
        # job existed (see db/migrations/0005).
        image: postgres:16
        env:
          POSTGRES_USER: sre
          POSTGRES_DB: sre_core
          # Throwaway container, reachable only from this job. Trust auth means no
          # credential appears in this file at all — the repository's secret scan is
          # absolute, and "it is only CI" is exactly how the first one gets in.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The real backup job (infra/pilot/backup/encrypted-backup.sh) encrypts with age; its connected test runs it here.
      - name: Install the backup job's encryption tool (age)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Migrate, then prove the migrations are idempotent
        env:
          DATABASE_URL: postgres://sre@localhost:5432/sre_core
        run: |
          pnpm db:migrate
          pnpm db:migrate

      # Every passed stage gate re-runs on every push. A gate that was proven once and
      # never checked again is a claim, not a control.
      #   Stage 6 — offline / duplicate / reorder / recovery / reconciliation
      #   Stage 7 — purchase → GRN → invoice → payment
      #   Stage 8 — physical-to-system reconciliation and recall
      #   Stage 9 — end-of-day and refund controls
      #   Stage 10 — the books reconcile and the owner can see why
      #   Stage 14 — one customer, end to end
      #   Stage 15 — pick to doorstep
      #
      # tests/migration is included here (not only tests/integration). Its six database-backed tests
      # — additive-only migrations, idempotent re-apply, the append-only triggers actually installed,
      # UPDATE/DELETE on the ledger refused, tenant-scoped uniqueness, a new migration applied without
      # disturbing existing rows — had never once run against a database in CI, because this step ran
      # only tests/integration. A schema guarantee that is asserted by the SQL that installs it and
      # never checked in the database is a claim, not a control (the same lesson as db/migrations/0004).
      #
      # DB_TESTS_REQUIRED makes the required job FAIL rather than silently skip if the database is
      # missing (P-08, hard rule #9): tests/migration/db-required-in-ci.test.ts refuses to let the
      # skipIf(!DATABASE_URL) blocks pass as a quiet green. The shell check is the belt to that brace.
      - name: Stage gate + migration suites (real PostgreSQL) — required, never skip
        env:
          DATABASE_URL: postgres://sre@localhost:5432/sre_core
          DB_TESTS_REQUIRED: '1'
        run: |
          test -n "$DATABASE_URL" \
            || (echo "::error::DATABASE_URL is not set — the required database tests would silently skip" && exit 1)
          # Every failing test is also raised as a GitHub annotation, so a red job names the test without the raw log.
          set -o pipefail
          pnpm run test:db -- --reporter=default --reporter=github-actions 2>&1 | tee /tmp/test-db.log || {
            # A run can fail outside any one test (an unhandled error, a worker crash): raise the tail as annotations too.
            grep -E 'FAIL|Error|×|Unhandled|errors?$' /tmp/test-db.log | grep -v '✓' | tail -40 | while IFS= read -r line; do echo "::error::${line:0:300}"; done
            exit 1
          }

      - name: Backup, destroy and restore, reconciled (QG-08)
        env:
          DATABASE_URL: postgres://sre@localhost:5432/sre_core
        run: |
          node scripts/backup.mjs --out /tmp/backups
          MANIFEST=$(ls /tmp/backups/*.manifest.json | head -1)
          psql "postgres://sre@localhost:5432/postgres" -c "DROP DATABASE sre_core WITH (FORCE);"
          psql "postgres://sre@localhost:5432/postgres" -c "CREATE DATABASE sre_core;"
          node scripts/restore.mjs --manifest "$MANIFEST" \
            --target "postgres://sre@localhost:5432/sre_core"


  deploy:
    name: The container builds, starts, and refuses a bad configuration
    runs-on: ubuntu-latest
    # A Dockerfile that is never built in CI is a Dockerfile that breaks silently and is
    # discovered on the evening somebody is trying to deploy. A compose file that is never
    # brought up is the same. Both are code that runs in production, so both run here.
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f infra/docker/api.Dockerfile -t sre-api:ci .

      - name: It REFUSES to start with no configuration, and says why
        # The negative case first, because a start that succeeds proves the happy path and a
        # refusal is the control. Exit 78 is EX_CONFIG — a configuration fault, not a crash.
        run: |
          set +e
          OUT=$(docker run --rm sre-api:ci 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          test "$CODE" = "78" || (echo "::error::expected exit 78 (EX_CONFIG), got $CODE" && exit 1)
          echo "$OUT" | grep -q "DATABASE_URL is not set" \
            || (echo "::error::the refusal did not name the missing setting" && exit 1)
          echo "$OUT" | grep -q "PACK_SIGNING_KEY is not set" \
            || (echo "::error::the refusal named one problem, not all of them" && exit 1)
          echo "$OUT" | grep -q "BOX_HISTORY_SEAL_KEY is not set" \
            || (echo "::error::the API started without head office's own seal secret (OB-116)" && exit 1)
          # No identity provider configured means nobody can log in — which is the correct
          # failure. A deployment that starts without one starts letting everybody in.
          echo "$OUT" | grep -q "IDP_SIGNING_KEY is not set" \
            || (echo "::error::the API started without an identity provider" && exit 1)

      - name: It REFUSES the placeholder from .env.example
        run: |
          set +e
          OUT=$(docker run --rm \
            -e DATABASE_URL="$(printf '%s://%s@db:5432/%s' postgres sre sre_core)" \
            -e PACK_SIGNING_KEY=REPLACE_WITH_A_GENERATED_VALUE \
            sre-api:ci 2>&1)
          CODE=$?
          set -e
          test "$CODE" = "78" || (echo "::error::a placeholder secret was accepted" && exit 1)
          echo "$OUT" | grep -q "still holds the value from .env.example" \
            || (echo "::error::the placeholder refusal did not explain itself" && exit 1)

      - name: The whole stack comes up and reports itself ready
        run: |
          cd infra/compose
          cp .env.example .env
          # Real values for CI only. This file is created here and never committed.
          # The DB password is generated URL-SAFE (hex, not base64): it becomes part of
          # DATABASE_URL below, and a base64 value carrying a '/' or '+' makes that string an
          # invalid URL — a migrate container that exits 1 about two runs in three. The signing
          # keys stay base64: they are compared as strings, never placed in a URL.
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "PACK_SIGNING_KEY=$(openssl rand -base64 48)"
            # OB-116: head office's own seal secret (the API only; generated here, never committed, never the pack key).
            echo "BOX_HISTORY_SEAL_KEY=$(openssl rand -base64 48)"
            echo "IDP_SIGNING_KEY=$(openssl rand -base64 48)"
            echo "IDP_ISSUER=https://idp.ci.invalid/"
            # The edge refuses the placeholder tenant id from .env.example (by design); give it a real one so
            # the edge container comes up and the proxy's /customer/ route below has something to serve.
            echo "EDGE_TENANT_ID=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          } >> .env
          PW=$(grep '^POSTGRES_PASSWORD=' .env | tail -1 | cut -d= -f2-)
          # Assembled with printf so the literal scheme://user:password@host shape never appears
          # in a committed file — the repository's secret scan refuses it anywhere, and "it is
          # only CI" is exactly how the first real one gets in.
          printf 'DATABASE_URL=%s://%s:%s@db:5432/%s\n' postgres sre_app "$PW" sre_retail_os >> .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/readyz >/dev/null 2>&1; then
              echo "ready after ${i}s"; curl -fsS http://127.0.0.1:8081/readyz; exit 0
            fi
            sleep 1
          done
          echo "::error::the stack never became ready"
          docker compose logs --no-color | tail -100
          exit 1

      - name: The public origin answers over HTTPS — and only for what is public (ADR-0018)
        # One address for a customer's browser: the API, the customer app and sign-in — and nothing
        # else. Staff screens are refused by name. The proxy's own certificate is used here (no
        # domain in CI), so curl is told not to verify it; the ROUTING is what this proves.
        run: |
          cd infra/compose
          fail() { echo "::error::$1"; docker compose logs --no-color proxy edge | tail -80; exit 1; }
          for i in $(seq 1 30); do curl -fskS https://127.0.0.1:443/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fskS https://127.0.0.1/readyz | grep -q '"ready":true' || fail "the API's readiness did not come through the proxy"
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/v1/catalogue/pack)
          test "$code" = "401" || fail "/v1 through the proxy should reach the API and be refused without a token (got $code)"
          curl -sk https://127.0.0.1/customer/ | grep -q 'customer-app.bundle.js' || fail "the customer app is not served on the public origin"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' https://127.0.0.1/auth/otp/begin)
          test "$code" = "503" || fail "/auth should answer 503 while sign-in is not deployed (got $code)"
          curl -sk -X POST https://127.0.0.1/auth/otp/begin | grep -q 'sign_in_not_deployed' || fail "the /auth refusal did not say why"
          for p in /owner/ /pos/ /manager/ /buying/ /admin.html; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://127.0.0.1$p")
            test "$code" = "404" || fail "$p is a staff screen and must not be on the public origin (got $code)"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:80/customer/)
          case "$code" in 301|302|307|308) ;; *) fail "plain http should redirect to https (got $code)";; esac
          curl -skI https://127.0.0.1/customer/ | grep -qi '^strict-transport-security' || fail "no HSTS header"
          if curl -skI https://127.0.0.1/customer/ | grep -qi '^server:'; then fail "the Server header is exposed"; fi
          echo "public origin: API, customer app and sign-in refusal on one https address; staff screens refused"

      - name: DAST baseline — OWASP ZAP passive scan of the public origin (QG-03 · §35 "DAST"; the software side of SEC-09)
        # The composed stack is up; ZAP's baseline spiders the public origin a customer's browser reaches and reports what
        # it sees (headers, cookies, disclosures, reflected input) without attacking anything. The image is pinned by
        # digest. `-I` keeps ZAP's own WARN verdicts from deciding the run: the judge below does that, on the report —
        # fail on high, every finding kept. A ZAP that did not finish, or wrote no report, fails here (P-08).
        env:
          ZAP_IMAGE: zaproxy/zap-stable:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
        run: |
          mkdir -p "$RUNNER_TEMP/zap" && chmod 777 "$RUNNER_TEMP/zap"
          set +e
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t https://127.0.0.1/customer/ -m 2 -I -J zap.raw.json
          code=$?
          set -e
          test "$code" = "0" || (echo "::error::the ZAP baseline did not finish (exit $code) — a scan that did not run is not a clean scan" && exit 1)
          test -s "$RUNNER_TEMP/zap/zap.raw.json" || (echo "::error::ZAP wrote no report" && exit 1)

      - name: Set up pnpm (the pilot overlay runs the demo sign-in from a bundle built here)
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: DAST baseline — the judge (fails on high; every finding written to the findings report)
        run: |
          mkdir -p scan-reports
          cp "$RUNNER_TEMP/zap/zap.raw.json" scan-reports/zap.raw.json
          node --experimental-strip-types scripts/scan-findings.mts --format zap \
            --in scan-reports/zap.raw.json --out scan-reports/zap.findings.json

      - name: Keep the DAST findings report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-reports-dast
          path: scan-reports/
          if-no-files-found: warn

      - name: The hosted-demo overlay puts the staff screens behind the demo sign-in — and nowhere else (ADR-0016 on ADR-0018)
        # The same stack with the pilot overlay on top: the proxy now forwards the staff shells, /login and the demo
        # store box to the demo front, which lets a visitor through only with a demo session. Proven from the outside:
        # no session → the sign-in (as a relative redirect the proxy puts the https origin in front of); the sign-in
        # page keeps its own Referrer-Policy; a forged cookie reaches the API as a bearer token and is refused; /v1
        # without a cookie still goes straight to the API; the lane refuses a sale; the customer app, HSTS and the
        # hidden Server header are unchanged; the box's own loopback check still answers.
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-service.mjs demo-login
          cd infra/compose
          # The demo sign-in refuses every tenant but the synthetic demo tenant (hard rule #7): the overlay is brought up for it.
          sed -i 's/^EDGE_TENANT_ID=.*/EDGE_TENANT_ID=de300000-0000-4000-8000-000000000001/' .env
          # This .env was copied from .env.example, whose SRE_STAFF_ROUTE is the store default (off) — and an env-file value
          # beats the overlay's default. The hosted demo's template (.env.pilot.example) says staff-demo-gate; so does this run.
          sed -i 's/^SRE_STAFF_ROUTE=.*/SRE_STAFF_ROUTE=staff-demo-gate/' .env
          P="docker compose -f docker-compose.yml -f docker-compose.pilot.yml"
          $P up -d --build
          fail() { echo "::error::$1"; $P logs --no-color proxy web demo-login | tail -120; exit 1; }
          for i in $(seq 1 60); do curl -fskS https://127.0.0.1/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fskS https://127.0.0.1/readyz | grep -q '"ready":true' || fail "the API's readiness did not come through the proxy with the overlay on"
          for i in $(seq 1 30); do [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/login/)" = "200" ] && break; sleep 1; done
          for p in /store/pos/ /store/manager/ /store/owner/ /supplier/; do
            out=$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' "https://127.0.0.1$p")
            test "$out" = "302 https://127.0.0.1/login/?next=$p" || fail "$p must send a visitor without a demo session to the sign-in (got: $out)"
          done
          # ONE application (OB-16): the old shell addresses go to the store computer's own screens, signed in or not.
          for p in pos owner picker warehouse; do
            out=$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' "https://127.0.0.1/$p/")
            test "$out" = "302 https://127.0.0.1/store/$p/" || fail "/$p/ must go to the store computer's screen (got: $out)"
          done
          out=$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' https://127.0.0.1/delivery/)
          test "$out" = "302 https://127.0.0.1/store/driver/" || fail "/delivery/ must go to the store computer's driver screen (got: $out)"
          for p in /erp/ /erp/cash-office.html; do
            out=$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' "https://127.0.0.1$p")
            test "$out" = "302 https://127.0.0.1/store/manager/" || fail "$p must go to the store workspace (got: $out)"
          done
          curl -sk https://127.0.0.1/login/ | grep -q 'action="/login/"' || fail "the demo sign-in page is not served at /login/"
          curl -skI https://127.0.0.1/login/ | grep -qi '^referrer-policy: same-origin' || fail "the sign-in page must keep its own Referrer-Policy (same-origin), or the browser posts the form with Origin: null"
          curl -skI https://127.0.0.1/customer/ | grep -qi '^referrer-policy: no-referrer' || fail "every other page keeps no-referrer"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H 'Cookie: sre_demo_session=not-a-token' https://127.0.0.1/v1/catalogue/pack)
          test "$code" = "401" || fail "a forged demo cookie must reach the API as a bearer token and be refused (got $code)"
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/v1/catalogue/pack)
          test "$code" = "401" || fail "/v1 without a cookie still goes straight to the API and is refused (got $code)"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' https://127.0.0.1/store-lane/lane/sale)
          test "$code" = "401" || fail "the demo box's lane must refuse a sale without a selling session (got $code)"
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/store-lane/lane/sync-status)
          test "$code" = "401" || fail "the demo box's status read must refuse a visitor with no session (got $code)"
          curl -sk https://127.0.0.1/customer/ | grep -q 'customer-app.bundle.js' || fail "the customer app must still be served from the edge with the gate on"
          curl -skI https://127.0.0.1/login/ | grep -qi '^strict-transport-security' || fail "no HSTS header on the sign-in page"
          if curl -skI https://127.0.0.1/login/ | grep -qi '^server:'; then fail "the Server header is exposed on the sign-in page"; fi
          code=$(curl -sL -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/pos/)
          test "$code" = "200" || fail "the box's own loopback check (standup:check follows the redirect to the sign-in) must still answer 200 (got $code)"
          echo "hosted-demo overlay: staff screens, the demo store box and /v1-with-cookie reachable only through the demo sign-in gate"

      - name: The store edge keeps its bill-number witness on its own volume (OB-87 · verifier r19 OB87-1)
        # The edge's root is read-only: without its own witness volume every restart looked like a possible restore (a new
        # "ZZ" bill prefix each boot). The overlay's edge runs a till lane, so it opens its witness at start: the folder it
        # names must be writable, hold this box's witness file, sit outside the data folder, and the boot log must not say
        # the witness is unavailable.
        run: |
          cd infra/compose
          P="docker compose -f docker-compose.yml -f docker-compose.pilot.yml"
          fail() { echo "::error::$1"; $P logs --no-color edge | tail -60; exit 1; }
          $P exec -T edge sh -c 'test -n "$EDGE_WITNESS_DIR" && test -w "$EDGE_WITNESS_DIR" && case "$EDGE_WITNESS_DIR/" in "$EDGE_DATA_DIR"/*) exit 1;; esac' \
            || fail "the edge's witness folder (EDGE_WITNESS_DIR) is missing, not writable, or inside its data folder"
          $P exec -T edge sh -c 'ls "$EDGE_WITNESS_DIR" | grep -q "^receipt-numbers\.witness\."' || fail "the edge opened no witness file in its witness folder"
          if $P logs --no-color edge | grep -q 'WITNESS UNAVAILABLE'; then fail "the edge says its bill-number witness is unavailable"; fi
          echo "store edge: bill-number witness kept on its own volume"

      - name: It drains rather than being killed
        run: |
          cd infra/compose
          # SIGTERM, then confirm it exited cleanly rather than being force-killed after the
          # grace period. A container killed mid-request is a sale that reached the process and
          # not the database.
          docker compose stop -t 30 api
          docker compose ps -a --format '{{.Service}} {{.ExitCode}}' | grep -E '^api (0|143)$' \
            || (echo "::error::the API did not stop cleanly" && exit 1)

      - name: Tear down
        if: always()
        run: cd infra/compose && docker compose -f docker-compose.yml -f docker-compose.pilot.yml down -v --remove-orphans && rm -f .env

  security-scans:
    name: Security scans — SAST, container images, infrastructure (QG-03 / QG-06) — fail on critical or high
    # Roadmap §22 QG-03 "security scans … green", QG-06 "zero open critical/high findings", §35 "SAST/DAST/SCA/
    # container/IaC/secret scans" (secret and SCA run in `verify`, DAST in `deploy`). Free, open-source tools only, no
    # account and no secret: Semgrep OSS with the open rules repository, and Trivy. Every engine and rule set is PINNED
    # (a version, a commit, an image digest) so a run can be repeated exactly. Each tool writes its own JSON and exits 0
    # on findings; scripts/scan-findings.mts is the one judge: it fails on critical or high, keeps every finding in a
    # findings report for the security register, and refuses a missing report (P-08). Every scan runs even when an
    # earlier one fails, so one red scanner never hides another; the last step gives the verdict.
    runs-on: ubuntu-latest
    # OB-342: the merged commit's release signature (a public value, empty when not signed) for the canary and release jobs.
    outputs:
      release-signature: ${{ steps.sign.outputs.signature }}
    env:
      SEMGREP_VERSION: '1.178.0'
      SEMGREP_RULES_COMMIT: a84ff9cc2453ca91d581380de4b8b3f272f6f4be
      TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: SAST — Semgrep OSS, the security rules for JavaScript and TypeScript
        id: sast
        continue-on-error: true
        run: |
          mkdir -p scan-reports
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet "semgrep==$SEMGREP_VERSION"
          git clone --quiet --filter=blob:none https://github.com/semgrep/semgrep-rules "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout --quiet "$SEMGREP_RULES_COMMIT"
          node scripts/select-sast-rules.mjs "$RUNNER_TEMP/semgrep-rules" "$RUNNER_TEMP/sast-rules"
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --metrics=off --disable-version-check \
            --config "$RUNNER_TEMP/sast-rules" --timeout 30 \
            --exclude node_modules --exclude dist --exclude '*.bundle.js' \
            --json --output scan-reports/semgrep.raw.json \
            apps packages services edge scripts infra
          node --experimental-strip-types scripts/scan-findings.mts --format semgrep \
            --in scan-reports/semgrep.raw.json --out scan-reports/semgrep.findings.json

      - name: IaC — Trivy configuration scan of the whole repository (the Dockerfiles today; any infrastructure file added later)
        id: iac
        continue-on-error: true
        run: |
          mkdir -p scan-reports "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/scan-reports:/out" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" config --format json --output /out/trivy-config.raw.json /src
          node --experimental-strip-types scripts/scan-findings.mts --format trivy-config \
            --in scan-reports/trivy-config.raw.json --out scan-reports/trivy-config.findings.json

      - name: Build the two images the stack runs (API and store edge)
        id: build
        continue-on-error: true
        run: |
          docker build -f infra/docker/api.Dockerfile -t sre-api:scan .
          docker build -f infra/docker/edge.Dockerfile -t sre-edge:scan .

      - name: Container images — Trivy vulnerability and secret scan of both images
        id: images
        continue-on-error: true
        run: |
          test "${{ steps.build.outcome }}" = "success" || (echo "::error::the images did not build, so they were not scanned" && exit 1)
          for img in api edge; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan-reports:/out" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --scanners vuln,secret --format json --output "/out/trivy-image-$img.raw.json" "sre-$img:scan"
          done
          node --experimental-strip-types scripts/scan-findings.mts --format trivy-image \
            --in scan-reports/trivy-image-api.raw.json --in scan-reports/trivy-image-edge.raw.json \
            --out scan-reports/trivy-image.findings.json

      - name: Keep every findings report (for the security register — POST /v1/compliance/finding-scans)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-reports-security
          path: scan-reports/
          if-no-files-found: warn

      # OB-331 (owner, 23 Oct 2026): every findings report goes to head office's findings register automatically, under
      # the CI scanner's OWN machine identity (role findings_push — it may do nothing else). The key is read only from the
      # GitHub secret FINDINGS_PUSH_TOKEN (set by the owner or administrator; issued out of band, never by production
      # code); the register's address is the repository variable FINDINGS_REGISTER_URL. With no key set the step says
      # "findings not sent: no key set" as a visible warning and does not fail the build — the verdict below is the gate.
      - name: Send the findings to head office's register (OB-331)
        if: always()
        env:
          FINDINGS_PUSH_TOKEN: ${{ secrets.FINDINGS_PUSH_TOKEN }}
          FINDINGS_REGISTER_URL: ${{ vars.FINDINGS_REGISTER_URL }}
        run: node scripts/push-findings.mjs scan-reports

      - name: Verdict — every scan ran and none found anything critical or high
        if: always()
        run: |
          failed=""
          for s in "SAST:${{ steps.sast.outcome }}" "IaC:${{ steps.iac.outcome }}" "image build:${{ steps.build.outcome }}" "container images:${{ steps.images.outcome }}"; do
            case "$s" in *:success) ;; *) failed="$failed ${s%%:*}";; esac
          done
          if [ -n "$failed" ]; then echo "::error::security scans not green:$failed (each step above names its findings)"; exit 1; fi
          echo "security scans green: SAST, IaC, container images"

      # WF-20 · AID-08 "sign releases" (OB-288 P5). Steps ADDED to this job; the verdict above is unchanged.
      - name: Release signing — the signing tooling signs and verifies (throwaway key, every run)
        if: always()
        run: node scripts/release-signing.mjs selftest "$GITHUB_SHA"

      - name: Release signing — sign this merged commit (main only; needs the RELEASE_SIGNING_KEY secret)
        # OB-342 (owner, 24 Oct 2026): the key holder is the named IT custodian; the key lives only in the GitHub secret
        # store. With no secret the release says NOT SIGNED and the build carries on (never fails for a missing key).
        id: sign
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p release-signature
          node scripts/release-signing.mjs manifest "$GITHUB_SHA" > release-signature/manifest.txt
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::notice::NOT SIGNED — no RELEASE_SIGNING_KEY secret is configured, so $GITHUB_SHA is not signed. A box with SRE_RELEASE_PUBKEY set will refuse it (docs/runbooks/automatic-deployment.md)."
            exit 0
          fi
          node scripts/release-signing.mjs sign "$GITHUB_SHA" > release-signature/signature.txt
          echo "signature=$(cat release-signature/signature.txt)" >> "$GITHUB_OUTPUT"
          if [ -f infra/deploy/release-signing.pub ]; then
            node scripts/release-signing.mjs verify "$GITHUB_SHA" infra/deploy/release-signing.pub "$(cat release-signature/signature.txt)"
          else
            echo "::notice::Signed, but no public key is committed at infra/deploy/release-signing.pub, so CI could not check the signature against it."
          fi
          echo "Release $GITHUB_SHA signed (manifest and signature kept as the release-signature artefact)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the release manifest and signature
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signature
          path: release-signature/
          if-no-files-found: warn

  browser:
    name: Browser suites (real Chromium) — required, never skip
    # GT-01 (independent audit, 4 Oct 2026): until this job existed the automatic build ran no browser suite at
    # all — sixty-two files of Playwright proof ran only in the build session's own gate, and every one of them
    # SKIPS itself when no Chromium is present. A required job that could skip them all and go green would be a
    # claim, not a control (hard rule #9, P-08). So: the exact Chromium this playwright-core expects is installed
    # from its own registry; BROWSER_TESTS_REQUIRED makes tests/e2e/browser-required-in-ci.e2e.ts fail by name
    # if the browser is missing; and scripts/assert-suite-ran.mjs refuses the run unless every test ran and
    # nothing was skipped. The one connected browser suite (the store trades a day) needs a real database too,
    # so this job carries the same throwaway PostgreSQL as the stage-gate job.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sre
          POSTGRES_DB: sre_core
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install the Chromium this Playwright expects (from playwright-core's own registry, with its system libraries)
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Migrate the database the connected browser suite trades against
        env:
          DATABASE_URL: postgres://sre@localhost:5432/sre_core
        run: pnpm db:migrate

      - name: Browser suites (real Chromium) — required, never skip
        env:
          DATABASE_URL: postgres://sre@localhost:5432/sre_core
          BROWSER_TESTS_REQUIRED: '1'
          DB_TESTS_REQUIRED: '1'
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" \
            || (echo "::error::no Chromium at $PLAYWRIGHT_CHROMIUM_EXECUTABLE — the browser suites would silently skip" && exit 1)
          set -o pipefail
          pnpm run test:e2e --reporter=default --reporter=github-actions --reporter=json --outputFile=/tmp/e2e.json 2>&1 | tee /tmp/e2e.log || {
            # The run's logs cannot be fetched from a build session; name each failing test on the check itself.
            grep -E 'FAIL|Error|×|Unhandled|EADDRINUSE|Timeout' /tmp/e2e.log | grep -v '✓' | tail -40 | while IFS= read -r line; do echo "::error::${line:0:300}"; done
            exit 1
          }
          node scripts/assert-suite-ran.mjs /tmp/e2e.json --min-files 60 --min-tests 200

  performance:
    name: Performance suites — required, never skip
    # GT-01: the performance suite measures ratios (how a read scales from 200 to 20,000 rows; rows read per
    # request), not absolute times, so it is meaningful on a shared runner. It ran only in the build session
    # until now. One file at a time, one process, nothing else competing (vitest.perf.config.ts); the same
    # refusal of a quiet green as the browser job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Performance suites — required, never skip
        run: |
          set -o pipefail
          pnpm run test:perf --reporter=default --reporter=github-actions --reporter=json --outputFile=/tmp/perf.json 2>&1 | tee /tmp/perf.log || {
            # The run's logs cannot be fetched from a build session; name each failing test and its measurement on the check.
            grep -E 'FAIL|Error|×|expected|took' /tmp/perf.log | grep -v '✓' | tail -40 | while IFS= read -r line; do echo "::error::${line:0:300}"; done
            exit 1
          }
          node scripts/assert-suite-ran.mjs /tmp/perf.json --min-files 13 --min-tests 59

  identity:
    name: Identity server suites (real Keycloak)
    # OB-15 · ADR-0019: the four suites that prove sign-in against a REAL Keycloak (code + PKCE, the token head office
    # believes, the second factor, lockout, people's sign-ins, a second shop's realm, the front door) skip themselves
    # without one — so until this job they ran only by hand and were recorded in docs/runbooks/identity-server.md. Here the
    # same Keycloak image the stack runs (infra/compose/docker-compose.yml) is started with the repository's realm; its
    # administrator password is generated for this run and never printed; every suite gets a freshly migrated database;
    # scripts/identity-proof.sh refuses a quiet green. This proves identity SUPPORT, not that any deployed environment has
    # identity switched on (that is the operator's step, docs/runbooks/identity-server.md).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sre
          POSTGRES_DB: sre_core
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The front door's web server (the end-to-end suite runs the repository's own nginx configuration)
        run: command -v nginx || (sudo apt-get update && sudo apt-get install -y nginx)

      - name: Start Keycloak 26.0.7 with the repository realm (administrator password generated for this run)
        run: |
          umask 077
          openssl rand -hex 24 | tr -d '\n' > "$RUNNER_TEMP/kc-admin.pw"
          tenant="$(cat /proc/sys/kernel/random/uuid)"
          echo "KEYCLOAK_PROOF_TENANT=$tenant" >> "$GITHUB_ENV"
          {
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=kcadmin"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$(cat "$RUNNER_TEMP/kc-admin.pw")"
            echo "SRE_WEB_ORIGIN=http://127.0.0.1:8099"
            echo "SRE_TENANT_ID=$tenant"
          } > "$RUNNER_TEMP/kc.env"
          docker run -d --name keycloak -p 8180:8080 --env-file "$RUNNER_TEMP/kc.env" \
            -v "$GITHUB_WORKSPACE/infra/keycloak/realm-sre-store.json:/opt/keycloak/data/import/realm-sre-store.json:ro" \
            quay.io/keycloak/keycloak:26.0.7 start-dev --import-realm
          rm -f "$RUNNER_TEMP/kc.env"
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:8180/realms/sre-store/.well-known/openid-configuration; then echo "Keycloak is up"; exit 0; fi
            sleep 2
          done
          docker logs keycloak | tail -50
          echo "::error::Keycloak did not come up with the sre-store realm — the identity suites cannot run" && exit 1

      - name: Identity server suites (real Keycloak) — required, never skip
        env:
          KEYCLOAK_PROOF_BASE: http://127.0.0.1:8180
          PROOF_PG_URL: postgres://sre@localhost:5432
        run: |
          export KEYCLOAK_PROOF_ADMIN_PASSWORD_FILE="$RUNNER_TEMP/kc-admin.pw"
          bash scripts/identity-proof.sh

  canary:
    name: Canary stage — deploy to the canary box and watch it before the full rollout (rolls back on its own)
    # WF-20 "approve release → backup → deploy/canary → smoke/reconcile → monitor → rollback" (ADR-0026). The same
    # gate as the full rollout (a merged, verified main commit), the same forced-command key pattern and the same
    # on-box script — but to the box named by the 'canary' environment, whose /opt/sre/deploy.conf sets a bake
    # (SRE_BAKE_SECONDS): the release must stay READY with no growth in server errors for that long, or the box rolls
    # back and this job goes red — and the full rollout below never runs. With no canary box configured the job says
    # so and the full rollout proceeds as before (synthetic demo only; ADR-0026 requires a canary for real data).
    needs: [verify, integration, deploy, security-scans, browser, performance, identity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: canary
    concurrency:
      group: deploy-canary
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.box.outputs.configured }}
    steps:
      - name: Is a canary box configured?
        id: box
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No canary box is configured (DEPLOY_HOST / DEPLOY_SSH_KEY / DEPLOY_HOST_KEY are not set on the 'canary' environment). The canary stage is skipped — see docs/runbooks/automatic-deployment.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy this exact commit to the canary box and watch it (the key can only run the release script)
        if: steps.box.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          # OB-342: the release signature the security-scans job made (empty when not signed) — the release script's 4th argument.
          # OB-423: then attempt=<this run's attempt> — every re-run of the pipeline is its own QG-10 note at head office.
          RELEASE_SIGNATURE: ${{ needs.security-scans.outputs.release-signature }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/deploy_known_hosts"
          if [ -z "$RELEASE_SIGNATURE" ]; then
            echo "::notice::NOT SIGNED — $GITHUB_SHA carries no release signature (the release-signing secret is not set). A box without SRE_RELEASE_PUBKEY deploys it and says NOT CHECKED; a box with it refuses it."
          fi
          # QG-10 · WF-20 (FG-3): the box's own output is kept, so its QG-10 evidence line (health, smoke, reconcile,
          # monitoring, rollback) reaches this run's summary and artifacts — whether it deployed or rolled back.
          set -o pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/deploy_known_hosts" \
              -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER:-deploy}@$DEPLOY_HOST" \
              release "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_RUN_ID" ${RELEASE_SIGNATURE:+"$RELEASE_SIGNATURE"} "attempt=$GITHUB_RUN_ATTEMPT" 2>&1 | tee release-output.txt
          echo "Canary: $GITHUB_SHA ($([ -n "$RELEASE_SIGNATURE" ] && echo signed || echo not signed)) deployed to the canary box and stayed healthy through its bake." >> "$GITHUB_STEP_SUMMARY"

      - name: QG-10 — this release's evidence line from the box (health, smoke, reconcile, monitoring, rollback)
        if: always() && steps.box.outputs.configured == 'true'
        run: |
          # The box prints one line "release: QG-10 record: {…}" per attempt (infra/deploy/release.sh). It is EVIDENCE for
          # the owner's QG-10 decision in the gate register — never a GO by itself (QG-12). A missing line is said, never hidden.
          touch release-output.txt
          grep '^release: QG-10 record: ' release-output.txt | sed 's/^release: QG-10 record: //' > qg10-record.jsonl || true
          if [ -s qg10-record.jsonl ]; then
            echo "QG-10 evidence (canary): $(node -e 'const r=JSON.parse(require("fs").readFileSync("qg10-record.jsonl","utf8").trim().split("\n").pop());console.log(`${r.outcome} — verified: ${r.verified}${r.notVerified.length?` (not verified: ${r.notVerified.join(", ")})`:""}`)')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The canary box printed no QG-10 record for $GITHUB_SHA (an older release script, or it stopped before the release). QG-10 is NOT evidenced for this release."
            echo "QG-10 evidence (canary): none printed by the box for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the QG-10 evidence line as an artifact
        if: always() && steps.box.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qg10-canary-${{ github.sha }}
          path: qg10-record.jsonl
          if-no-files-found: warn

      - name: Clean up the key material
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/deploy_known_hosts"

  release:
    name: Deploy the merged release to the demo box (rolls back if it does not come up)
    # Stage F: a commit that reached main did so through a pull request whose checks were green (branch
    # protection, hard rule #8) — that IS the approval (AID-08). The six jobs above must pass on THIS
    # commit first; then the box is told to deploy exactly this SHA. The SSH key can run one command on the
    # box — infra/deploy/release.sh — and nothing else (a forced command); the script refuses any commit
    # not on origin/main, and puts the previous release back if the new one does not come up READY.
    # Deploys never cancel each other: they queue (a half-applied release is worse than a late one).
    # When the 'demo' environment carries no deploy secrets, the job says so and deploys nothing — a
    # fork or a fresh clone cannot deploy anywhere by accident. docs/runbooks/automatic-deployment.md.
    # WF-20 (ADR-0026): the full rollout runs only after the canary stage passed (a red canary stops it here).
    needs: [verify, integration, deploy, security-scans, browser, performance, identity, canary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.canary.result == 'success'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - name: Say whether this release was watched on a canary box first
        run: |
          if [ "${{ needs.canary.outputs.deployed }}" = "true" ]; then
            echo "Canary stage passed for $GITHUB_SHA — rolling out." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No canary box ran this release (none configured). The full rollout proceeds on the synthetic demo only — ADR-0026 requires a canary before a box with real data."
          fi

      - name: Is a demo box configured?
        id: box
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No demo box is configured (DEPLOY_HOST / DEPLOY_SSH_KEY / DEPLOY_HOST_KEY are not set on the 'demo' environment). Nothing was deployed — see docs/runbooks/automatic-deployment.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy this exact commit over SSH (the key can only run the release script)
        if: steps.box.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          # OB-342: the release signature the security-scans job made (empty when not signed) — the release script's 4th argument.
          # OB-423: then attempt=<this run's attempt> — every re-run of the pipeline is its own QG-10 note at head office.
          RELEASE_SIGNATURE: ${{ needs.security-scans.outputs.release-signature }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          # The private key is written to a file the ssh client reads and nowhere else; the host key is
          # PINNED from the secret (no first-use trust — a wrong box is refused, not asked about).
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/deploy_known_hosts"
          if [ -z "$RELEASE_SIGNATURE" ]; then
            echo "::notice::NOT SIGNED — $GITHUB_SHA carries no release signature (the release-signing secret is not set). A box without SRE_RELEASE_PUBKEY deploys it and says NOT CHECKED; a box with it refuses it."
          fi
          # QG-10 · WF-20 (FG-3): the box's own output is kept, so its QG-10 evidence line reaches this run's summary.
          set -o pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/deploy_known_hosts" \
              -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER:-deploy}@$DEPLOY_HOST" \
              release "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_RUN_ID" ${RELEASE_SIGNATURE:+"$RELEASE_SIGNATURE"} "attempt=$GITHUB_RUN_ATTEMPT" 2>&1 | tee release-output.txt
          echo "Deployed $GITHUB_SHA ($([ -n "$RELEASE_SIGNATURE" ] && echo signed || echo not signed)) to the demo box (merged by $GITHUB_ACTOR)." >> "$GITHUB_STEP_SUMMARY"

      - name: QG-10 — this release's evidence line from the box (health, smoke, reconcile, monitoring, rollback)
        if: always() && steps.box.outputs.configured == 'true'
        run: |
          # The box prints one line "release: QG-10 record: {…}" per attempt (infra/deploy/release.sh). It is EVIDENCE for
          # the owner's QG-10 decision in the gate register — never a GO by itself (QG-12). A missing line is said, never hidden.
          touch release-output.txt
          grep '^release: QG-10 record: ' release-output.txt | sed 's/^release: QG-10 record: //' > qg10-record.jsonl || true
          if [ -s qg10-record.jsonl ]; then
            echo "QG-10 evidence (demo): $(node -e 'const r=JSON.parse(require("fs").readFileSync("qg10-record.jsonl","utf8").trim().split("\n").pop());console.log(`${r.outcome} — verified: ${r.verified}${r.notVerified.length?` (not verified: ${r.notVerified.join(", ")})`:""}`)')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The demo box printed no QG-10 record for $GITHUB_SHA (an older release script, or it stopped before the release). QG-10 is NOT evidenced for this release."
            echo "QG-10 evidence (demo): none printed by the box for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the QG-10 evidence line as an artifact
        if: always() && steps.box.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qg10-demo-${{ github.sha }}
          path: qg10-record.jsonl
          if-no-files-found: warn

      - name: Clean up the key material
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/deploy_known_hosts"
