<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Hyper Market — Business customer portal</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Business-customer portal (M22-FR-04, API-09, §35, P-03, P-04, P-08). A surface a party OUTSIDE the business
      uses: a caterer or canteen buying on account. Every rule lives in the tested session model
      (apps/b2b-app/src/b2b-portal-session.ts), attached as window.b2bPortalSession and built on the shared
      packages/ui + packages/a11y primitives. The customer reads FOUR things about its OWN account only, each
      scoped to its own customer id ON THE SERVER (never a parameter the browser can change): its credit terms and
      what it owes, its invoices and how each stands (a disputed one is with a person, not a reminder), its
      statement aged from the due dates, and the documents issued to it. A feed the login may not see is said so
      ("ask us to turn it on") — never a balance of zero (P-08). It reads and reports; it CHANGES nothing — no
      write verb anywhere. Read live on load and Refresh (GETs). Offline it shows a sample stand-in and the stale
      strip. Bilingual EN/TA. No prompt/confirm/alert. A public surface, so WCAG 2.2 AA (NFR-07): real headings,
      real buttons, visible focus, every state in words + an icon, never colour alone.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-update.js" defer></script>
    <style>
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      .skip { position:absolute; left:-9999px; top:0; background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:0 0 8px 0; z-index:50; }
      .skip:focus { left:0; }
      .lang { background:var(--line); color:var(--ink); min-height:44px; padding:0 14px; font-size:15px; border:0; border-radius:10px; }
      .sample,.stale { margin:0; padding:10px 16px; font-size:15px; font-weight:600; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:960px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .bar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between; }
      .asof { color:var(--muted); font-size:14px; }
      button { min-height:44px; padding:0 16px; border:0; border-radius:10px; font-size:15px; font-weight:700; background:var(--line); color:var(--ink); }
      button:focus-visible, .lang:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      .panel { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:8px; border-left:6px solid var(--idle); }
      .panel.tone-ok { border-left-color:var(--ok); } .panel.tone-degraded { border-left-color:var(--degraded); } .panel.tone-error { border-left-color:var(--error); }
      .figs { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
      .fig { display:grid; gap:2px; } .f-label { font-size:13px; color:var(--muted); } .f-value { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .value { font-weight:700; font-variant-numeric:tabular-nums; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:var(--danger-text); }
      .muted { color:var(--muted); font-size:14px; margin:0; }
      .note { margin:0; padding:10px 14px; border-radius:12px; background:var(--warn-surface); color:var(--on-warn-surface); font-size:14px; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>

    <header>
      <span class="who" id="who">Business customer portal <small id="whoami"></small></span>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main id="main">
      <div>
        <h2 id="title">Your account with SRE</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="bar">
        <span class="asof" id="asof" role="status" aria-live="polite"></span>
        <button class="refresh" id="refresh" type="button"></button>
      </div>

      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>

      <h3 id="account-heading"></h3>
      <div class="panel" id="account" hidden aria-label="Your credit account"></div>
      <p class="muted" id="account-note" hidden></p>

      <h3 id="invoices-heading"></h3>
      <ul class="rows" id="invoices" aria-label="Your invoices"></ul>
      <p class="muted" id="invoices-note" hidden></p>

      <h3 id="statement-heading"></h3>
      <div class="panel" id="statement" hidden aria-label="Your statement"></div>
      <p class="muted" id="statement-note" hidden></p>

      <h3 id="documents-heading"></h3>
      <ul class="rows" id="documents" aria-label="Documents issued to you"></ul>
      <p class="muted" id="documents-note" hidden></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./b2b-app.bundle.js" type="module"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
