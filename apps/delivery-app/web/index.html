<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Delivery — My route</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Driver's phone (docs/design/screens/delivery.md). A low-spec Android phone, used
      standing at a doorstep, often one-handed, often in sunlight.

      Two things drive the layout. The stop the driver is at is the biggest thing on
      screen; and the amount to collect is bigger still, because it is the number that
      has to be right when somebody hands over cash.

      Framework-free and static, so it opens with no signal between two streets.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <script src="./sre-update.js" defer></script>
    <style>
      :root { --tap: 60px; }
      /* OB-205: the page, polished inside the approved look — tokens only, the foundation's spacing, radius, elevation and
         type scales; the stop-first layout, the 60px targets and every rule of the screen unchanged. */
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 17px/1.45 var(--font);
        /* Flex, not a fixed row template: the strips above `main` come and go, and a
           template counted in rows shifts the layout every time one is hidden. */
        height: 100dvh; display: flex; flex-direction: column;
      }
      /* The header: the route and how far along it on the left, the language on the right, the sync badge under them. */
      header {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
        gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-4);
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      /* The page's one heading: the route. Styled as the header line it is, not as a headline. */
      h1.route { margin: 0; font-size: 18px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
      .route small { display: block; color: var(--ink-2); font-weight: 600; font-size: 15px; font-variant-numeric: var(--numbers); }
      /* How far along the route, drawn: the words above are the signal, the bar only helps them. */
      .meter { display: block; height: 6px; margin-top: 6px; border-radius: var(--radius-pill); background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
      .meter[hidden] { display: none; }
      .meter > span { display: block; height: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); transition: transform var(--dur-slow) var(--ease-out); }
      #lang {
        min-height: 56px; padding: 0 var(--space-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        background: var(--panel); color: var(--ink); border: 1px solid var(--field-line); border-radius: var(--radius-lg);
        font-size: 16px; box-shadow: var(--shadow-xs);
      }
      #lang .sre-icon { width: 18px; height: 18px; }
      /* The sync badge (design system §1 rule 4): the dot wears its state's shape, the two lines of words are the badge —
         this phone's unsent count, then the store computer's state and last contact. Calm by default; amber while work
         waits here; the readable red only when a person must act. Colour is never the only signal: the words say it. */
      .sync {
        grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: var(--space-2) var(--space-3);
        background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
        font-size: 15px; min-width: 0;
      }
      .sync:has(.dot.waiting) { background: var(--warn-surface); color: var(--on-warn-surface); border-color: var(--warn-surface); }
      .sync:has(.dot.error) { background: var(--error-surface); color: var(--danger-text); border-color: var(--error-surface); }
      .sync-words { display: grid; line-height: 1.3; min-width: 0; }
      #queue-text { font-weight: 700; }
      .sync-words small { color: inherit; font-size: 14px; }
      .dot.waiting { background: var(--warn); }

      .storage { background: var(--danger-surface); color: var(--on-danger); padding: var(--space-2) var(--space-4); font-size: 15px; font-weight: 600; margin: 0; }
      .storage[hidden] { display: none; }
      /* A stop the contribution rule flagged. Surfaced, never buried (D09) — an amber strip, a warning that is not an error. */
      .flagged { background: var(--warn-surface); color: var(--on-warn-surface); padding: var(--space-2) var(--space-4); font-size: 15px; font-weight: 600; margin: 0; border-bottom: 2px solid var(--degraded); }
      .flagged[hidden] { display: none; }

      main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-3) var(--space-4) var(--space-4); }
      .empty {
        color: var(--muted); padding: var(--space-6) var(--space-4); font-size: 17px; text-align: center;
        background: var(--panel); border: 1px dashed var(--line-strong); border-radius: var(--radius-xl);
      }

      /* One stop per row, as a card: the area is where the van goes; the money to collect is the biggest thing, because it
         is what has to be right; the stop's state is a chip with its shape. */
      .stop {
        width: 100%; text-align: left; background: var(--panel); color: var(--ink); font: inherit;
        border: 1px solid var(--line); border-left: 6px solid var(--line-strong); border-radius: var(--radius-xl);
        padding: var(--space-3) var(--space-4) var(--space-3) var(--space-3); margin-bottom: 10px; min-height: var(--tap);
        display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; box-shadow: var(--shadow-sm);
      }
      .stop > * { min-width: 0; overflow-wrap: anywhere; }
      .stop[aria-selected='true'] { outline: 3px solid var(--focus); outline-offset: 0; background: var(--mint); }
      .stop.delivered { border-left-color: var(--good); }
      .stop.failed { border-left-color: var(--danger); }
      .stop.returned_to_origin { border-left-color: var(--info); }
      .stop.out_for_delivery { border-left-color: var(--warn); }
      .stop .area { font-size: 20px; font-weight: 700; line-height: 1.3; }
      .stop .order { color: var(--muted); font-size: 14px; font-weight: 600; }
      /* The money is the biggest thing on the row — it is what has to be right. */
      .stop .cod { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
      .stop .cod.prepaid { font-size: 17px; font-weight: 600; color: var(--muted); }
      .stop .state {
        justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-top: var(--space-1);
        padding: 2px 10px 2px 8px; border-radius: var(--radius-pill); background: var(--panel-2); color: var(--ink);
        border: 1px solid var(--line); font-size: 14px; font-weight: 700;
      }
      .stop .state .sre-icon { width: 16px; height: 16px; }
      .stop.delivered .state, .stop.partially_delivered .state { background: var(--ok-surface); color: var(--on-ok-surface); border-color: var(--ok-surface); }
      .stop.out_for_delivery .state, .stop.attempted .state { background: var(--warn-surface); color: var(--on-warn-surface); border-color: var(--warn-surface); }
      .stop.failed .state { background: var(--error-surface); color: var(--danger-text); border-color: var(--error-surface); }
      .stop.returned_to_origin .state { background: var(--info-surface); color: var(--on-info-surface); border-color: var(--info-surface); }
      /* WF-16 (driver): an online return to collect — the same card as a stop, its booked lines listed, its state a chip. */
      .stop.collected { border-left-color: var(--good); }
      .stop.not_collected { border-left-color: var(--danger); }
      .stop.booked { border-left-color: var(--info); }
      .stop .lines { font-size: 17px; font-weight: 600; font-variant-numeric: var(--numbers); }
      .stop.collected .state { background: var(--ok-surface); color: var(--on-ok-surface); border-color: var(--ok-surface); }
      .stop.not_collected .state { background: var(--error-surface); color: var(--danger-text); border-color: var(--error-surface); }
      .stop.booked .state { background: var(--info-surface); color: var(--on-info-surface); border-color: var(--info-surface); }
      .returns-note { margin: 0 2px var(--space-2); color: var(--ink-2); font-size: 15px; }
      .returns-note[hidden] { display: none; }
      .stop .flag { font-size: 14px; font-weight: 700; color: var(--on-warn-surface); background: var(--warn-surface); justify-self: start; padding: 2px 10px; border-radius: var(--radius-pill); }

      /* Sent from this phone (SP-3c-ii): what each queued outcome was, then one of the five shared state words as a chip
         with its shape; a refusal carries its reason. The same shape the warehouse and picker handhelds show, for the same reason. */
      .section {
        display: flex; align-items: center; gap: var(--space-2); font-size: 14px; font-weight: 700; color: var(--muted);
        margin: var(--space-4) 2px var(--space-2); text-transform: uppercase; letter-spacing: var(--tracking-caps);
      }
      .section[hidden] { display: none; }
      .section .sre-icon { width: 18px; height: 18px; }
      .section[data-count]::after {
        content: attr(data-count); margin-left: auto; min-width: 28px; padding: 2px 10px; border-radius: var(--radius-pill);
        background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-size: 15px; letter-spacing: 0;
        text-align: center; font-variant-numeric: var(--numbers);
      }
      .sent {
        background: var(--panel); border: 1px solid var(--line-soft); border-left: 6px solid var(--line-strong); border-radius: var(--radius-xl);
        padding: 10px var(--space-4) 10px var(--space-3); margin-bottom: var(--space-2); display: grid; gap: 6px; box-shadow: var(--shadow-xs);
      }
      .sent .what { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
      .sent .why { font-size: 15px; color: var(--danger-text); font-weight: 600; }
      .sent.refused { border-left-color: var(--danger); }
      .sent.posted { border-left-color: var(--good); }
      .sent.saved_here, .sent.retrying { border-left-color: var(--degraded); }
      .pill {
        display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: var(--radius-pill);
        font-size: 14px; font-weight: 600; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); justify-self: start;
        line-height: 1.35; max-width: 100%;
      }
      .pill .sre-icon { width: 16px; height: 16px; }
      .pill.posted { background: var(--ok-surface); color: var(--on-ok-surface); border-color: var(--ok-surface); }
      .pill.refused { background: var(--danger-surface); color: var(--on-danger); border-color: var(--danger-surface); }
      .pill.retrying, .pill.saved_here { background: var(--warn-surface); color: var(--on-warn-surface); border-color: var(--warn-surface); }

      /* The footer: the cash being carried, then the quieter actions, then the one that matters — Delivered — at the bottom,
         under the thumb. */
      footer {
        background: var(--panel); border-top: 1px solid var(--line); box-shadow: var(--shadow-md);
        padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px;
      }
      .summary { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); font-size: 15px; color: var(--muted); }
      #held { color: var(--ink); font-size: 22px; font-weight: 700; font-variant-numeric: var(--numbers); white-space: nowrap; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button {
        min-height: var(--tap); border-radius: var(--radius-xl); border: 1px solid var(--line); font-size: 18px; font-weight: 600;
        background: var(--panel-2); color: var(--ink); padding: 0 var(--space-3); line-height: 1.25;
        display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); text-align: center;
        transition: transform var(--dur-fast) var(--ease-out);
      }
      button:active:not(:disabled) { transform: translateY(1px); }
      button .sre-icon { width: 22px; height: 22px; }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 20px; font-weight: 700; box-shadow: var(--shadow-sm); }
      button.primary:active:not(:disabled) { background: var(--accent-press); border-color: var(--accent-press); }
      /* The readable red — white on the signal red is 3.8:1, short of the 4.5:1 these words need. */
      button.danger { background: var(--danger-surface); border-color: var(--danger-surface); color: var(--on-danger); }
      button:disabled { opacity: 1; background: var(--panel-2); color: var(--muted); border-style: dashed; border-color: var(--line-strong); box-shadow: none; cursor: not-allowed; }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .wide { grid-column: 1 / -1; }
      /* The quieter actions at the handhelds' 56px bar, so the footer leaves room for the route. */
      .actions > button:not(.primary) { min-height: 56px; font-size: 17px; }
      .actions > button:not(.primary):not(.danger) { background: var(--panel); }

      /* ── Panels ─────────────────────────────────────────────────────────── */
      .sheet {
        position: fixed; inset: 0; background: var(--scrim);
        display: grid; place-items: end center; z-index: 20;
      }
      .sheet[hidden] { display: none; }
      .sheet-inner {
        width: min(560px, 100%); background: var(--panel); padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
        border-radius: 16px 16px 0 0; display: grid; gap: var(--space-3); max-height: 92dvh; overflow-y: auto;
        box-shadow: var(--shadow-lg); animation: sre-rise var(--dur-slow) var(--ease-out) both;
      }
      /* A grab line: says "this is a panel over the route", nothing more. */
      .sheet-inner::before { content: ''; justify-self: center; width: 40px; height: 4px; border-radius: var(--radius-pill); background: var(--line-strong); }
      .sheet h2 { margin: 0; font-size: 20px; line-height: 1.3; display: flex; align-items: flex-start; gap: var(--space-2); overflow-wrap: anywhere; }
      .sheet h2 .sre-icon { width: 24px; height: 24px; margin-top: 1px; color: var(--accent); }
      .sheet h2 .sre-with-icon { align-items: flex-start; }
      .entry {
        font-size: 44px; font-weight: 700; text-align: right; padding: var(--space-2) var(--space-4); line-height: 1.2;
        background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-xl); min-height: 64px;
        font-variant-numeric: var(--numbers); overflow-wrap: anywhere;
      }
      #count-total { font-size: 30px; text-align: center; }
      .hint { color: var(--muted); font-size: 15px; min-height: 22px; }
      .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
      .keypad button, .choices button, .sheet-actions button { min-height: var(--tap); font-size: 20px; }
      .keypad button { background: var(--panel); font-size: 24px; font-weight: 700; font-variant-numeric: var(--numbers); }
      .choices { display: grid; gap: var(--space-2); }
      .choices button { justify-content: flex-start; text-align: left; padding: 0 var(--space-4); font-size: 17px; background: var(--panel); }
      /* A panel's parts that are not in use stay out of the way: the classes above would otherwise outrank [hidden]. */
      .entry[hidden], .keypad[hidden], .choices[hidden] { display: none; }
      .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .sheet-actions .primary, .keypad .primary { background: var(--accent); color: var(--on-accent); }

      /* Counting the bag: one row per note, a big count in the middle. */
      .denoms { display: grid; gap: var(--space-2); max-height: 46dvh; overflow-y: auto; }
      .denom { display: grid; grid-template-columns: minmax(5rem, auto) 1fr 3rem 1fr; align-items: center; gap: var(--space-2); }
      .denom span { font-size: 18px; font-weight: 700; font-variant-numeric: var(--numbers); white-space: nowrap; }
      .denom .n { text-align: center; font-size: 26px; font-variant-numeric: tabular-nums; }
      /* The same target as every other button: a thumb counting notes at the end of a shift is not more accurate. */
      .denom button { min-height: var(--tap); font-size: 26px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--panel); color: var(--ink); }

      /* The banner. No timer, never colour alone — its shape rides beside the words. */
      .banner {
        position: fixed; inset: 0 0 auto 0; z-index: 30; padding: var(--space-5) var(--space-4) var(--space-4);
        background: var(--danger-surface); color: var(--on-danger); display: grid; gap: 10px; box-shadow: var(--shadow-lg);
        animation: sre-rise var(--dur-slow) var(--ease-out) both;
      }
      .banner[hidden] { display: none; }
      .banner.good { background: var(--good); color: var(--on-accent); }
      .banner-head { display: flex; align-items: flex-start; gap: 10px; }
      #banner-mark { display: inline-flex; flex: none; }
      #banner-mark .sre-icon { width: 28px; height: 28px; stroke-width: 2; }
      .banner strong { font-size: 21px; line-height: 1.3; overflow-wrap: anywhere; }
      .banner p { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
      .banner p:empty { display: none; }
      .banner button { background: var(--panel); color: var(--ink); border-color: var(--panel); font-weight: 700; }
      .banner.good button { background: var(--on-accent); color: var(--ink); }

      /* OB-294 · M19-FR-03: the proof is CAPTURED — the camera's own picture, or the customer's finger on the screen. */
      .capture-open {
        min-height: var(--tap); border-radius: var(--radius-xl); border: 1px solid var(--accent); font-size: 18px; font-weight: 700;
        background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
        cursor: pointer;
      }
      .capture-open:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
      #photo-input { position: absolute; width: 1px; height: 1px; opacity: 0; }
      #sign-pad { width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-lg); border: 2px dashed var(--line-strong); background: var(--panel); touch-action: none; }
      .sign-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
      .sign-actions button { min-height: var(--tap); font-size: 18px; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="route" id="route">—<small id="progress">—</small><span class="meter" id="progress-meter" aria-hidden="true" hidden><span id="progress-bar"></span></span></h1>
      <button class="lang" id="lang" type="button" aria-label="Language"><span data-sre-icon="globe"></span>EN / த</button>
      <span class="sync">
        <span class="dot" id="queue-dot" data-sre-status title="Sync"></span>
        <span class="sync-words"><span id="queue-text">—</span><small id="box-text">—</small></span>
      </span>
    </header>

    <p class="sample" id="sample" hidden role="status">Sample route — this is not real work.</p>
    <p class="storage" id="storage" hidden role="alert"></p>
    <p class="storage" id="not-allowed" hidden role="alert"></p>
    <p class="stale" id="stale" hidden role="status"></p>
    <p class="flagged" id="flagged" hidden role="status"></p>

    <main>
      <div id="stops"></div>
      <p class="empty" id="empty" hidden>—</p>
      <!-- WF-16 (driver): online returns booked for collection on this route. No money changes hands at the door. -->
      <h2 class="section" id="returns-heading" hidden>—</h2>
      <p class="returns-note" id="returns-note" hidden>—</p>
      <div id="collections"></div>
      <!-- Where each outcome, the settlement and the handover have got to — from the durable device queue and the store computer's word. -->
      <h2 class="section" id="sent-heading" hidden>—</h2>
      <div id="sent-work"></div>
    </main>

    <footer>
      <!--
        Cash held is shown while the driver is working, because they need to know what
        they are carrying. At HANDOVER it disappears — see app.js.
      -->
      <div class="summary">
        <span id="held-label">Cash you are carrying</span>
        <span id="held">—</span>
      </div>
      <!-- OB-205: the quieter actions first; Delivered — the one the driver taps at almost every door — last, full width,
           at the bottom under the thumb. -->
      <div class="actions">
        <button id="handover" class="wide" type="button">End of shift — hand cash over</button>
        <button id="delivered-partial" type="button">Partly delivered</button>
        <button id="failed" class="danger" type="button">Could not deliver</button>
        <button id="deliver" class="primary wide" type="button">Delivered</button>
      </div>
    </footer>

    <!-- A number, or a choice. On-screen, never a browser prompt. -->
    <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-inner">
        <h2 id="sheet-title">—</h2>
        <div class="entry" id="entry" hidden>0</div>
        <div class="hint" id="entry-hint"></div>
        <div class="keypad" id="keypad" hidden></div>
        <div class="choices" id="choices" hidden></div>
        <div class="sheet-actions">
          <button id="sheet-cancel" type="button">Cancel</button>
          <button id="sheet-ok" class="primary" type="button">OK</button>
        </div>
      </div>
    </div>

    <!--
      Counting the cash at handover. Nothing on this panel says what the driver SHOULD
      be holding — the same control the till drawer and the stock count use, for the
      same reason.
    -->
    <div class="sheet" id="count" hidden role="dialog" aria-modal="true" aria-labelledby="count-title">
      <div class="sheet-inner">
        <h2 id="count-title">Count the cash</h2>
        <div class="denoms" id="denoms"></div>
        <div class="entry" id="count-total">—</div>
        <div class="hint" id="count-hint"></div>
        <div class="sheet-actions">
          <button id="count-cancel" type="button">Cancel</button>
          <button id="count-ok" class="primary" type="button">Hand over</button>
        </div>
      </div>
    </div>

    <!-- OB-294 · M19-FR-03: the photo at the door — the phone camera's own picture, made small on the phone, never a typed reference. -->
    <div class="sheet" id="photo" hidden role="dialog" aria-modal="true" aria-labelledby="photo-title">
      <div class="sheet-inner">
        <h2 id="photo-title">Take a photo of the parcel at the door</h2>
        <label class="capture-open" for="photo-input"><span id="photo-open">Open the camera</span><input id="photo-input" type="file" accept="image/*" capture="environment" /></label>
        <div class="hint" id="photo-hint"></div>
        <div class="sheet-actions">
          <button id="photo-cancel" class="wide" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <!-- OB-294 · M19-FR-03: the customer signs with a finger on the screen — captured as an image. -->
    <div class="sheet" id="sign" hidden role="dialog" aria-modal="true" aria-labelledby="sign-title">
      <div class="sheet-inner">
        <h2 id="sign-title">Ask the customer to sign with a finger</h2>
        <canvas id="sign-pad" width="480" height="270" aria-label="Signature"></canvas>
        <div class="sign-actions">
          <button id="sign-cancel" type="button">Cancel</button>
          <button id="sign-clear" type="button">Clear</button>
          <button id="sign-done" class="primary" type="button" disabled>Done</button>
        </div>
      </div>
    </div>

    <!-- The message that must not be missed. No timer. -->
    <div class="banner" id="banner" hidden role="alert">
      <div class="banner-head sre-with-icon"><span id="banner-mark" aria-hidden="true"></span><strong id="banner-title">—</strong></div>
      <p id="banner-text"></p>
      <button id="banner-ok" type="button">I have read this</button>
    </div>

    <!--
      The store box puts this screen's data here, above the bundle, because the bundle
      reads its global while it evaluates. A screen that fetched afterwards would render
      once with nothing — and "nothing" on these screens means NOT KNOWN, so every screen
      would flash "I have been told nothing" before correcting itself.

      Served straight from a file instead, the marker is simply left in place and the
      shell falls back to its sample data, which it announces.
    -->
    <!--SCREEN-DATA-->
    <script type="module" src="./delivery-app.bundle.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
