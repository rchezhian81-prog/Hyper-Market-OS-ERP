<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Owner — Today</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Owner command centre (docs/design/screens/owner-command-centre.md). Phone-first
      and glanceable: the brief in plain sentences with the numbers beside the words,
      the THREE things needing attention dominant, and a freshness indicator that is
      never out of sight.

      Framework-free and static, so it opens on a low-spec Android phone with no signal
      and shows the LAST-SYNCED numbers, labelled as such. Same palette and controls as
      the till and the manager screen: it is one product.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <script src="./sre-update.js" defer></script>
    <style>
      :root { --tap: 48px; }
      /* UI-3 (1 Nov 2026): read at a glance on a 360px phone — the day's figures in big type, what needs a decision next,
         then the trend. Nothing scrolls sideways; every control is at least 48px; every colour a token, so the dark set
         follows; the freshness line and the "no signal" strip are never out of sight (P-08). */
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 16px/1.5 var(--font);
        padding-bottom: 40px; overflow-x: hidden;
      }
      header { padding: 10px 16px 12px; background: var(--panel); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); }
      .title { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .lang { background: transparent; border: 1px solid var(--line); color: var(--ink); font-size: 15px; min-height: var(--tap); min-width: var(--tap); padding: 0 12px; border-radius: 12px; }
      /* Freshness is persistent and prominent — never implied (P-08), never colour alone. */
      .freshness { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 15px; flex-wrap: wrap; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--good); flex: none; }
      .dot.stale { background: var(--warn); }
      .dot.missing { background: var(--danger); }
      #fresh-text.stale { color: var(--warn); font-weight: 700; }
      #fresh-text.missing { color: var(--danger-text); font-weight: 700; }
      .asof { color: var(--muted); font-size: 14px; }

      /* Branch switcher — one tap per branch, because the second store is a row not a rewrite. */
      .branches { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
      .branches[hidden] { display: none; }
      .branches button {
        min-height: var(--tap); padding: 0 14px; border: 0; border-radius: 10px;
        background: var(--line); color: var(--ink); font-size: 15px; font-weight: 600; white-space: nowrap;
      }
      .branches button[aria-current='page'] { background: var(--ink); color: var(--bg); }
      .branches button .age { display: block; font-size: 14px; font-weight: 400; }

      /* Sample-data warning. Only ever shown when the tested model is NOT loaded. */
      .sample { background: var(--warn); color: var(--on-warn); padding: 10px 16px; font-weight: 600; font-size: 15px; margin: 0; }
      .sample[hidden] { display: none; }
      /* Served from this device's cache because the store box could not be reached. It says WHEN (P-08). */
      .stale { background: var(--info-surface); color: var(--on-info-surface); padding: 8px 14px; font-size: 15px; margin: 0; border-bottom: 2px solid var(--info); }
      .stale[hidden] { display: none; }
      /* This phone has no signal right now — said in words, with what that means for the figures (P-01 · P-08). */
      .offline { background: var(--warn-surface); color: var(--on-warn-surface); padding: 10px 16px; font-size: 15px; font-weight: 600; margin: 0; }
      .offline[hidden] { display: none; }
      /* Something the phone could not save. Never swallowed (P-08). */
      .queue-problem { background: var(--danger-surface); color: var(--on-danger); padding: 10px 16px; font-size: 15px; margin: 0; }
      .queue-problem[hidden] { display: none; }

      main { padding: 0 16px; max-width: 640px; margin: 0 auto; box-sizing: border-box; }
      section { margin-top: 24px; min-width: 0; }
      h2 { font-size: 15px; color: var(--ink); font-weight: 700; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      h2 .count { font-size: 14px; color: var(--muted); font-weight: 600; }
      .headline { font-size: 17px; line-height: 1.5; margin: 14px 0 0; color: var(--ink); }

      /* The day's figures: the takings first and largest, then three more. Every figure is a button, because every
         figure drills to its source (M29-FR-02). A missing figure says "Not known", never a nought. */
      .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .kpi {
        background: var(--panel); border-radius: 14px; padding: 12px 14px; border: 1px solid var(--line);
        text-align: left; color: var(--ink); min-height: 96px; min-width: 0; display: grid; gap: 2px; align-content: start;
      }
      .kpi.lead { grid-column: 1 / -1; border-left: 5px solid var(--accent); }
      .kpi .label { font-size: 14px; color: var(--muted); font-weight: 600; }
      .kpi .value { font-size: 26px; line-height: 1.15; font-weight: 800; font-variant-numeric: var(--numbers); overflow-wrap: anywhere; }
      .kpi.lead .value { font-size: 38px; }
      .kpi .value.unknown { font-size: 20px; color: var(--warn); }
      .kpi .why { font-size: 14px; color: var(--muted); font-weight: 400; }
      .kpi .more { font-size: 14px; color: var(--accent); font-weight: 600; }
      @media (max-width: 380px) { .kpi.basket { grid-column: 1 / -1; } }

      .attention { display: grid; gap: 10px; }
      .card {
        background: var(--panel); border-radius: 14px; padding: 14px 16px;
        border-left: 6px solid var(--warn); min-height: var(--tap); width: 100%;
        text-align: left; color: var(--ink); font-size: 16px; border-top: 0; border-right: 0; border-bottom: 0;
      }
      .card.urgent { border-left-color: var(--danger); }
      .card.approval { border-left-color: var(--info); }
      .rank { font-size: 14px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 600; }

      .rows { display: grid; gap: 10px; }
      .row {
        background: var(--panel); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; border: 1px solid var(--line); min-width: 0;
      }
      .row .what { font-size: 16px; overflow-wrap: anywhere; }
      .row .meta { color: var(--muted); font-size: 14px; }
      .row .value { font-size: 24px; font-weight: 800; font-variant-numeric: var(--numbers); }
      .row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .alert { width: 100%; text-align: left; background: transparent; color: var(--ink);
        padding: 12px 0; border: 0; border-top: 1px solid var(--line); font-size: 16px; min-height: var(--tap); }
      .alert .drill { color: var(--accent); font-size: 14px; display: block; margin-top: 2px; }
      .empty { color: var(--muted); font-size: 15px; margin: 0; }
      .empty.unknown { color: var(--warn); font-weight: 600; }

      /* The trend: drawn by the one chart code (window.sreCharts, design system §4.4), each in a panel. */
      .trends { display: grid; gap: 12px; }
      .trend { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }

      button {
        min-height: var(--tap); border-radius: 12px; border: 0; font-size: 16px; font-weight: 600;
        background: var(--line); color: var(--ink);
      }
      button.primary { background: var(--good); color: var(--on-accent); }
      button.danger { background: var(--danger-surface); color: var(--on-danger); }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .wide { width: 100%; }

      /* Queued decisions waiting to be sent, and the ones that went out of date (§31.1). */
      .queued { background: var(--panel); border-radius: 14px; padding: 12px 16px; font-size: 15px; }
      .recheck { border-left: 5px solid var(--danger); }
      .recheck .why { color: var(--warn); font-size: 14px; }

      /* ── Panels ─────────────────────────────────────────────────────────── */
      .sheet {
        position: fixed; inset: 0; background: var(--scrim);
        display: grid; place-items: end center; z-index: 20;
      }
      .sheet[hidden] { display: none; }
      .sheet-inner {
        width: min(560px, 100%); background: var(--panel); padding: 20px; box-sizing: border-box;
        border-radius: 20px 20px 0 0; display: grid; gap: 12px; max-height: 88dvh; overflow-y: auto;
      }
      .sheet h3 { margin: 0; font-size: 19px; }
      .sheet .note { color: var(--muted); font-size: 14px; margin: 0; }
      /* The staleness warning inside the approve panel — the point of the extra tap. */
      .sheet .stale-warn { background: var(--warn-surface); color: var(--on-warn-surface); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
      .sheet .stale-warn[hidden] { display: none; }
      .choices { display: grid; gap: 10px; }
      .choices button { text-align: left; padding: 0 16px; font-size: 16px; }
      .drill-lines { display: grid; gap: 6px; max-height: 44dvh; overflow-y: auto; }
      .drill-line {
        display: grid; grid-template-columns: 1fr auto; gap: 10px; font-size: 15px;
        padding: 10px 12px; background: var(--panel-2); border-radius: 10px; font-variant-numeric: tabular-nums;
      }
      .drill-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; }

      /* The banner. No timer, and never colour alone. */
      .banner {
        position: fixed; inset: 0 0 auto 0; z-index: 30; padding: 18px 16px;
        background: var(--danger-surface); color: var(--on-danger); display: grid; gap: 10px;
      }
      .banner[hidden] { display: none; }
      .banner.good { background: var(--good); color: var(--on-accent); }
      .banner strong { font-size: 20px; }
      .banner p { margin: 0; font-size: 16px; }
      .banner button { background: var(--panel); color: var(--danger-text); }
      .banner.good button { background: var(--panel); color: var(--ok); }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <span class="title" id="title">Today · SRE Hyper Market</span>
        <button class="lang" id="lang" type="button" aria-label="Language">EN / த</button>
      </div>
      <div class="freshness">
        <span class="dot" id="fresh-dot" data-sre-status></span>
        <span id="fresh-text">—</span>
        <span class="asof" id="asof"></span>
      </div>
      <div class="branches" id="branches"></div>
    </header>

    <!--
      Shown only when the tested model has not been bundled in. An owner acting on a
      number that came from nowhere is worse than an owner with no number at all.
    -->
    <p class="sample" id="sample" hidden role="status">Sample figures — this is not your shop.</p>
    <p class="stale" id="stale" hidden role="status"></p>
    <!-- UI-3: this phone has no signal right now (navigator.onLine) — the figures are what it last received (P-01 · P-08). -->
    <p class="offline" id="offline" hidden role="status"></p>
    <!-- A decision the phone could not save. Said, never swallowed. -->
    <p class="queue-problem" id="queue-problem" hidden role="alert"></p>

    <main>
      <!-- UI-3: the order a glance needs — the day's figures, what needs a decision, then the trend. -->
      <p class="headline" id="headline">—</p>

      <!-- Decisions that went out of date while they waited (§31.1). Above everything. -->
      <section id="recheck-section" hidden>
        <h2 id="recheck-title">Look at these again</h2>
        <div class="rows" id="recheck"></div>
      </section>

      <section aria-labelledby="kpis-title">
        <h2 id="kpis-title">Today's numbers</h2>
        <div class="kpis" id="kpis"></div>
      </section>

      <section aria-labelledby="attention-title">
        <h2><span id="attention-title">Needs your attention</span> <span class="count" id="attention-count"></span></h2>
        <div class="attention" id="attention"></div>
      </section>

      <section aria-labelledby="approvals-title">
        <h2><span id="approvals-title">Waiting for you</span> <span class="count" id="approvals-count"></span></h2>
        <div class="rows" id="approvals"></div>
      </section>

      <section aria-labelledby="alerts-title">
        <h2><span id="alerts-title">Alerts</span> <span class="count" id="alerts-count"></span></h2>
        <div id="alerts"></div>
      </section>

      <section aria-labelledby="trends-title">
        <h2 id="trends-title">How the day is going</h2>
        <div class="trends">
          <div class="trend" id="chart-hour"></div>
          <div class="trend" id="chart-days"></div>
          <div class="trend" id="chart-tender"></div>
        </div>
      </section>

      <section id="queued-section" hidden>
        <h2 id="queued-title">Decided, not yet sent</h2>
        <div class="queued" id="queued"></div>
      </section>
    </main>

    <!--
      Deciding an approval. The staleness warning lives INSIDE this panel, so the age of
      the data is in front of the owner at the moment of the decision rather than in a
      badge they scrolled past.
    -->
    <div class="sheet" id="decide" hidden role="dialog" aria-modal="true" aria-labelledby="decide-title">
      <div class="sheet-inner">
        <h3 id="decide-title">—</h3>
        <p class="note" id="decide-what"></p>
        <div class="stale-warn" id="decide-stale" hidden></div>
        <div class="choices" id="decide-reasons"></div>
        <button id="decide-cancel" type="button">Cancel</button>
      </div>
    </div>

    <!-- Any figure drills to the sales behind it — every one of them, never a sample. -->
    <div class="sheet" id="drill" hidden role="dialog" aria-modal="true" aria-labelledby="drill-title">
      <div class="sheet-inner">
        <h3 id="drill-title">—</h3>
        <div class="drill-total"><span id="drill-total-label">Total</span><span id="drill-total">—</span></div>
        <p class="note" id="drill-note"></p>
        <div class="drill-lines" id="drill-lines"></div>
        <button id="drill-close" type="button">Close</button>
      </div>
    </div>

    <!-- The message that must not be missed. No timer. -->
    <div class="banner" id="banner" hidden role="alert">
      <strong id="banner-title">—</strong>
      <p id="banner-text"></p>
      <button id="banner-ok" type="button">I have read this</button>
    </div>

    <!--
      The bundled, tested session (built by `pnpm build:owner`) attaches
      `window.ownerSession`. It loads FIRST so the view binds to the real engines; if the
      bundle has not been built, app.js falls back to sample figures and SAYS SO.
    -->
    <!--
      The store box puts this screen's data here, above the bundle, because the bundle
      reads its global while it evaluates. A screen that fetched afterwards would render
      once with nothing — and "nothing" on these screens means NOT KNOWN, so every screen
      would flash "I have been told nothing" before correcting itself.

      Served straight from a file instead, the marker is simply left in place and the
      shell falls back to its sample data, which it announces.
    -->
    <!--SCREEN-DATA-->
    <script type="module" src="./owner-app.bundle.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
