<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Picker — My wave</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Picker/packer handheld (docs/design/screens/picker-packer.md). Runs on a cheap
      Android device held in one hand, often with a glove on, in a cold aisle.

      The layout is built round the three steps the spec insists on — scan the bin,
      scan the item, confirm — with the NEXT step always the biggest thing on screen.
      Targets are 64px here rather than 56px: a mis-tap in an aisle is a wrong item in
      somebody's crate, and the picker cannot see the screen well through the glare of
      a freezer cabinet.

      Framework-free and static, so it opens with the shop's wifi down.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap: 64px; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 17px/1.45 var(--font);
        /* Flex, not a fixed row template: the strips above `main` come and go, and a
           template counted in rows shifts the layout every time one is hidden. */
        height: 100dvh; display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 8px 14px; background: var(--panel);
      }
      /* The page's one heading: the wave. Styled as the header line it is, not as a headline. */
      h1.wave { margin: 0; font-size: 17px; font-weight: 600; }
      .wave small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
      /* The sync badge (design system §1 rule 4): the dot is decoration, the two lines of words are the badge —
         this device's unsent count, then the store computer's state and last contact. */
      .sync-words { display: grid; line-height: 1.25; text-align: right; }
      .sync-words small { color: var(--muted); font-size: 13px; }
      .dot.waiting { background: var(--warn); }

      .storage { background: var(--danger-surface); color: var(--on-danger); padding: 8px 14px; font-size: 15px; margin: 0; }
      .storage[hidden] { display: none; }
      .ordered-by { background: var(--panel-2); color: var(--muted); padding: 6px 14px; margin: 0; font-size: 14px; }
      .ordered-by[hidden] { display: none; }
      /* A line with no shelf address: it sits last, and it says why. */
      .bin.unmapped { background: var(--warn); color: var(--on-warn); }

      main { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px; }
      .empty { color: var(--muted); padding: 32px 4px; font-size: 17px; }

      /* One line per row. The bin is the biggest thing, because it is where they walk to. */
      .line {
        width: 100%; text-align: left; background: var(--panel); color: var(--ink);
        border: 0; border-left: 6px solid var(--line); border-radius: 14px;
        padding: 12px 14px; margin-bottom: 10px; min-height: var(--tap); display: grid; gap: 2px;
      }
      .line[aria-selected='true'] { outline: 3px solid var(--focus); }
      .line.picked { border-left-color: var(--good); }
      .line.short { border-left-color: var(--warn); }
      .line.substituted { border-left-color: var(--info); }
      .line.quality_failed { border-left-color: var(--danger); }
      .line .bin { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
      .line .what { font-size: 17px; }
      .line .qty { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
      .line .state { font-size: 14px; font-weight: 600; }

      /* Sent from this handheld (SP-3c-i): what each queued outcome was, then one of the five shared state words as a
         pill; a refusal carries its reason. The same shape the warehouse handheld shows, for the same reason. */
      .section { font-size: 14px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
      .section[hidden] { display: none; }
      .sent { background: var(--panel); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; display: grid; gap: 6px; border-left: 6px solid var(--line); }
      .sent .what { font-size: 16px; font-weight: 600; }
      .sent .why { font-size: 14px; color: var(--muted); }
      .sent.refused { border-left-color: var(--danger); }
      .sent.posted { border-left-color: var(--good); }
      .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--line); color: var(--ink); justify-self: start; }
      .pill.posted { background: var(--good); color: var(--on-accent); }
      .pill.refused { background: var(--danger-surface); color: var(--on-danger); }
      .pill.retrying { background: var(--warn); color: var(--on-warn); }

      footer { background: var(--panel); padding: 12px 14px 18px; display: grid; gap: 10px; }
      /* The next step, spelled out. A handheld user should never have to work out where they are. */
      .step { font-size: 19px; font-weight: 600; min-height: 26px; }
      .step small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button {
        min-height: var(--tap); border-radius: 14px; border: 0; font-size: 18px; font-weight: 600;
        background: var(--line); color: var(--ink);
      }
      button.primary { background: var(--good); color: var(--on-accent); font-size: 20px; }
      button:disabled { opacity: .45; }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .wide { grid-column: 1 / -1; }

      /* ── Panels ─────────────────────────────────────────────────────────── */
      .sheet {
        position: fixed; inset: 0; background: rgba(2, 6, 23, .86);
        display: grid; place-items: end center; z-index: 20;
      }
      .sheet[hidden] { display: none; }
      .sheet-inner {
        width: min(560px, 100%); background: var(--panel); padding: 18px;
        border-radius: 20px 20px 0 0; display: grid; gap: 12px; max-height: 92dvh; overflow-y: auto;
      }
      .sheet h2 { margin: 0; font-size: 20px; }
      .entry {
        font-size: 42px; font-weight: 700; text-align: right; padding: 8px 16px;
        background: var(--panel-2); border-radius: 12px; min-height: 64px;
      }
      .hint { color: var(--muted); font-size: 15px; min-height: 22px; }
      .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .keypad button, .choices button, .sheet-actions button { min-height: var(--tap); font-size: 20px; }
      .choices { display: grid; gap: 8px; }
      .choices button { text-align: left; padding: 0 16px; font-size: 17px; }
      .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .sheet-actions .primary, .keypad .primary { background: var(--good); color: var(--on-accent); }
      /* At the item step the two honest alternatives sit beside Cancel: a swap, or a problem (picker-packer.md). */
      .scan-actions { grid-template-columns: 1fr 1fr; }
      /* Waiting for a scan — there is deliberately no text box to type into. */
      .awaiting {
        background: var(--panel-2); border-radius: 12px; padding: 18px 16px; text-align: center;
        font-size: 20px; font-weight: 600; border: 2px dashed var(--line);
      }

      /* The banner. No timer, never colour alone. */
      .banner {
        position: fixed; inset: 0 0 auto 0; z-index: 30; padding: 18px 14px;
        background: var(--danger-surface); color: var(--on-danger); display: grid; gap: 10px;
      }
      .banner[hidden] { display: none; }
      .banner.good { background: var(--good); color: var(--on-accent); }
      .banner strong { font-size: 21px; }
      .banner p { margin: 0; font-size: 17px; }
      .banner button { background: var(--panel-2); color: var(--ink); }
      .banner.good button { background: var(--on-accent); color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <h1 class="wave" id="wave">—<small id="progress">—</small></h1>
      <span class="sync">
        <span class="dot" id="queue-dot" title="Sync"></span>
        <span class="sync-words"><span id="queue-text">—</span><small id="box-text">—</small></span>
        <button class="lang" id="lang" type="button" aria-label="Language">EN / த</button>
      </span>
    </header>

    <p class="sample" id="sample" hidden role="status">Sample wave — this is not real work.</p>
    <p class="storage" id="storage" hidden role="alert"></p>
    <!-- How this list is ordered, said rather than assumed (M04-FR-02). -->
    <p class="ordered-by" id="ordered-by" hidden role="status"></p>
    <p class="stale" id="stale" hidden role="status"></p>

    <main>
      <div id="lines"></div>
      <p class="empty" id="empty" hidden>—</p>
      <!-- Where each outcome and the pack have got to — read from the durable device queue and the store computer's word. -->
      <h2 class="section" id="sent-heading" hidden>—</h2>
      <div id="sent-work"></div>
    </main>

    <footer>
      <!-- Where the picker is in the three steps, in words. Never left to be inferred. -->
      <div class="step" id="step">—<small id="step-detail"></small></div>
      <div class="actions">
        <button id="substitute" type="button">Substitute</button>
        <button id="problem" type="button">Problem</button>
        <button id="pack" class="primary wide" type="button">Pack the crate</button>
      </div>
    </footer>

    <!--
      Waiting for a scan. There is deliberately NO text box: a shop scanner is a
      keyboard that types fast and presses Enter, and an input that can lose focus is
      how a barcode ends up in a quantity field.
    -->
    <div class="sheet" id="scan" hidden role="dialog" aria-modal="true" aria-labelledby="scan-title">
      <div class="sheet-inner">
        <h2 id="scan-title">—</h2>
        <div class="awaiting" id="scan-awaiting">—</div>
        <div class="hint" id="scan-hint"></div>
        <div class="sheet-actions scan-actions">
          <button id="scan-substitute" type="button" hidden>Substitute</button>
          <button id="scan-problem" type="button" hidden>Problem</button>
          <button id="scan-cancel" class="wide" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <!-- A number: the quantity picked, or a weight. On-screen keypad, never a prompt. -->
    <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-inner">
        <h2 id="sheet-title">—</h2>
        <div class="entry" id="entry" hidden>0</div>
        <div class="hint" id="entry-hint"></div>
        <div class="keypad" id="keypad" hidden></div>
        <div class="choices" id="choices" hidden></div>
        <div class="sheet-actions">
          <button id="sheet-cancel" type="button">Cancel</button>
          <button id="sheet-ok" class="primary" type="button">OK</button>
        </div>
      </div>
    </div>

    <!-- The message that must not be missed. No timer. -->
    <div class="banner" id="banner" hidden role="alert">
      <strong id="banner-title">—</strong>
      <p id="banner-text"></p>
      <button id="banner-ok" type="button">I have read this</button>
    </div>

    <!--
      The store box puts this screen's data here, above the bundle, because the bundle
      reads its global while it evaluates. A screen that fetched afterwards would render
      once with nothing — and "nothing" on these screens means NOT KNOWN, so every screen
      would flash "I have been told nothing" before correcting itself.

      Served straight from a file instead, the marker is simply left in place and the
      shell falls back to its sample data, which it announces.
    -->
    <!--SCREEN-DATA-->
    <script type="module" src="./picker-app.bundle.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
