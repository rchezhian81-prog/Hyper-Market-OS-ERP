<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Queue till — வரிசை பில்லிங்</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#17654f" />
    <!--
      Queue till (D04-FR-05 mobile POS and queue-busting). A member of staff walks the queue with a low-spec Android
      handheld, scans each customer's basket, and either takes a card or UPI payment (only where the shop switched it on)
      or hands the basket to a till by a four-digit code. It runs the till's own tested session against the store
      computer's signed pack, so the price, the offers and the legal gates are the till's.

      Targets are 56px or more: one hand, a basket in the other, a customer watching. No text box for scanning — a
      scanner is a keyboard that types fast and presses Enter, exactly as at the till. Framework-free and static.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <script src="./sre-update.js" defer></script>
    <style>
      :root { --tap: 56px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 var(--font); height: 100dvh; display: flex; flex-direction: column; }
      header {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-2) var(--space-3);
        padding: var(--space-3) var(--space-4); background: var(--panel); border-bottom: 1px solid var(--line);
      }
      h1.title { margin: 0; font-size: 18px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
      .title small { display: block; color: var(--ink-2); font-weight: 600; font-size: 15px; }
      button {
        font: inherit; min-height: var(--tap); padding: 0 var(--space-3); border-radius: var(--radius-lg); border: 1px solid var(--field-line);
        background: var(--panel); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      button[hidden] { display: none; }
      button .sre-icon { width: 20px; height: 20px; }
      .box {
        grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: var(--space-2) var(--space-3);
        background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); font-size: 15px;
      }
      .box.down { background: var(--error-surface); color: var(--danger-text); border-color: var(--error-surface); }
      .notice { margin: 0; padding: var(--space-2) var(--space-4); background: var(--info-surface); color: var(--on-info-surface); font-size: 15px; font-weight: 600; }
      .notice[hidden] { display: none; }
      main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-3) var(--space-4); }
      .empty { color: var(--muted); padding: var(--space-6) var(--space-4); text-align: center; background: var(--panel); border: 1px dashed var(--line-strong); border-radius: var(--radius-xl); }
      .empty[hidden] { display: none; }
      .line {
        width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-xl);
        padding: var(--space-3); margin-bottom: 10px; min-height: var(--tap); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-3);
      }
      .line .what { font-weight: 600; overflow-wrap: anywhere; }
      .line .qty { color: var(--muted); font-size: 15px; }
      .line .amount { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 20px; font-weight: 700; font-variant-numeric: var(--numbers); }
      .line.voided { opacity: .6; }
      .line.voided .what { text-decoration: line-through; }
      .total { display: flex; justify-content: space-between; align-items: baseline; padding: var(--space-3) var(--space-4); background: var(--panel); border-top: 1px solid var(--line); }
      .total strong { font-size: 30px; font-variant-numeric: var(--numbers); }
      footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: var(--space-3) var(--space-4) var(--space-4); background: var(--panel); }
      footer .wide { grid-column: 1 / -1; }
      footer .primary, .sheet .primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; min-height: 64px; font-size: 19px; }
      .sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; }
      .sheet[hidden] { display: none; }
      .sheet-inner { width: 100%; background: var(--panel); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: var(--space-4); display: grid; gap: var(--space-3); max-height: 92dvh; overflow-y: auto; }
      .sheet h2 { margin: 0; font-size: 20px; }
      .hint { color: var(--ink-2); font-size: 15px; }
      .hint:empty { display: none; }
      .entry { font-size: 32px; font-weight: 700; text-align: right; padding: var(--space-2) var(--space-3); background: var(--panel-2); border-radius: var(--radius-lg); font-variant-numeric: var(--numbers); }
      .entry-text { font: inherit; font-size: 22px; min-height: var(--tap); padding: 0 var(--space-3); border: 1px solid var(--field-line); border-radius: var(--radius-lg); }
      .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .keypad button { font-size: 24px; font-weight: 700; min-height: 60px; }
      .choices { display: grid; gap: var(--space-2); }
      .choices button { justify-content: flex-start; text-align: left; }
      .entry[hidden], .entry-text[hidden], .keypad[hidden], .choices[hidden] { display: none; }
      .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .code { font-size: 64px; font-weight: 800; letter-spacing: .2em; text-align: center; padding: var(--space-4); background: var(--mint); color: var(--on-ok-surface); border-radius: var(--radius-xl); font-variant-numeric: var(--numbers); }
      .bill { white-space: pre-wrap; font: 15px/1.4 var(--mono); background: var(--panel-2); padding: var(--space-3); border-radius: var(--radius-lg); }
      .bill:empty { display: none; }
      .banner {
        position: fixed; inset: 0 0 auto 0; z-index: 30; padding: var(--space-5) var(--space-4) var(--space-4);
        background: var(--danger-surface); color: var(--on-danger); display: grid; gap: 10px; box-shadow: var(--shadow-lg);
        /* A long bill on a small phone: the banner scrolls, and its button is always within reach. */
        max-height: 100dvh; overflow-y: auto; box-sizing: border-box;
      }
      .banner .bill { max-height: 45dvh; overflow-y: auto; margin: 0; }
      .banner[hidden] { display: none; }
      .banner.good { background: var(--good); color: var(--on-accent); }
      .banner-head { display: flex; align-items: flex-start; gap: 10px; }
      .banner strong { font-size: 21px; line-height: 1.3; overflow-wrap: anywhere; }
      .banner p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
      .banner p:empty { display: none; }
      .banner button { background: var(--panel); color: var(--ink); border-color: var(--panel); font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="title" id="title">Queue till<small id="who">—</small></h1>
      <button id="lang" type="button" aria-label="Language"><span data-sre-icon="globe"></span>EN / த</button>
      <span class="box" id="box" role="status"><span data-sre-icon="store" aria-hidden="true"></span><span id="box-text">—</span></span>
    </header>
    <p class="notice" id="notice" hidden role="status"></p>

    <main>
      <div id="lines"></div>
      <p class="empty" id="empty">—</p>
    </main>

    <div class="total"><span id="total-label">To pay</span><strong id="total">₹0.00</strong></div>
    <footer>
      <button id="key" type="button">Key a code</button>
      <button id="waiting" type="button">Waiting baskets</button>
      <button id="card" type="button" hidden>Card</button>
      <button id="upi" type="button" hidden>UPI</button>
      <button id="handover" class="primary wide" type="button">Hand to a till</button>
    </footer>

    <!-- A number or a choice. On-screen keypad, never a prompt. -->
    <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-inner">
        <h2 id="sheet-title">—</h2>
        <div class="hint" id="sheet-hint"></div>
        <div class="entry" id="entry" hidden>0</div>
        <input class="entry-text" id="entry-text" hidden autocomplete="off" autocapitalize="characters" />
        <div class="keypad" id="keypad" hidden></div>
        <div class="choices" id="choices" hidden></div>
        <div class="sheet-actions">
          <button id="sheet-cancel" type="button">Cancel</button>
          <button id="sheet-ok" class="primary" type="button">OK</button>
        </div>
      </div>
    </div>

    <!-- The hand-over code, as big as the screen allows, for the customer to carry to a till. -->
    <div class="sheet" id="handed" hidden role="dialog" aria-modal="true" aria-labelledby="handed-title">
      <div class="sheet-inner">
        <h2 id="handed-title">—</h2>
        <div class="code" id="handed-code">—</div>
        <div class="hint" id="handed-text"></div>
        <button id="handed-next" class="primary" type="button">Next customer</button>
      </div>
    </div>

    <!-- The message that must not be missed. No timer. -->
    <div class="banner" id="banner" hidden role="alert">
      <div class="banner-head"><span id="banner-mark" aria-hidden="true"></span><strong id="banner-title">—</strong></div>
      <p id="banner-text"></p>
      <pre class="bill" id="banner-bill"></pre>
      <button id="banner-ok" type="button">I have read this</button>
    </div>

    <!--SCREEN-DATA-->
    <script type="module" src="./queue-pos.bundle.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
