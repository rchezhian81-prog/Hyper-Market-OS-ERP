<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Hyper Market — Supplier portal</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Supplier portal (M24-FR-01, API-03, §35, P-03, P-04). The one surface a party OUTSIDE the business uses.
      Every rule lives in the tested session model (apps/supplier-app/src/supplier-portal-session.ts), attached as
      window.supplierPortalSession and built on the shared packages/ui + packages/a11y primitives. A supplier
      reads two things about its OWN account only, both scoped to its own partner id ON THE SERVER (never a
      parameter the browser can change): what it has SENT us and whether a buyer has acted (nothing a supplier
      submits is in force on its own — §28), and its STATEMENT (the money we owe it, disputed shown separately;
      "not accessible" is a permission answer, never a balance of zero — P-08). It reads and reports; it changes ONE
      thing only (OB-362): a "Delivery update" for one of the supplier's own open orders. Read live on load and Refresh (GETs). Offline it shows a sample stand-in
      and the stale strip. Bilingual EN/TA. No prompt/confirm/alert. A public surface, so WCAG 2.2 AA (NFR-07):
      real headings, real buttons, visible focus, every state in words + an icon, never colour alone.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <script src="./sre-update.js" defer></script>
    <style>
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      .skip { position:absolute; left:-9999px; top:0; background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:0 0 8px 0; z-index:50; }
      .skip:focus { left:0; }
      .lang { background:var(--line); color:var(--ink); min-height:44px; padding:0 14px; font-size:15px; border:0; border-radius:10px; }
      .sample,.stale { margin:0; padding:10px 16px; font-size:15px; font-weight:600; }
      .sample[hidden],.stale[hidden] { display:none; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:900px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .bar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between; }
      .asof { color:var(--muted); font-size:14px; }
      button { min-height:44px; padding:0 16px; border:0; border-radius:10px; font-size:15px; font-weight:700; background:var(--line); color:var(--ink); }
      button:focus-visible, .lang:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
      .statement { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:8px; border-left:6px solid var(--idle); }
      .statement.tone-ok { border-left-color:var(--ok); } .statement.tone-error { border-left-color:var(--error); }
      .statement .figs { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
      .statement .fig { display:grid; gap:2px; } .statement .f-label { font-size:13px; color:var(--muted); } .statement .f-value { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:var(--danger-text); }
      .muted { color:var(--muted); font-size:14px; margin:0; }
      .delivery { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:8px; }
      .du-form { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); align-items:end; }
      .du-form label { display:grid; gap:4px; font-size:14px; color:var(--muted); }
      .du-form select, .du-form input { min-height:44px; font-size:16px; border-radius:10px; border:1px solid var(--line); padding:0 10px; background:var(--bg); color:var(--ink); }
      #du-send { display:inline-flex; align-items:center; gap:8px; justify-content:center; }
      .status-line { margin:0; font-weight:600; font-size:15px; } .status-line.tone-error { color:var(--danger-text); }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>

    <header>
      <span class="who" id="who">Supplier portal <small id="whoami"></small></span>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main id="main">
      <div>
        <h2 id="title">Your account with SRE</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="bar">
        <span class="asof" id="asof" role="status" aria-live="polite"></span>
        <button class="refresh" id="refresh" type="button"></button>
      </div>

      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>

      <h3 id="sent-heading"></h3>
      <ul class="rows" id="awaiting" aria-label="What you have sent us, waiting on us"></ul>
      <ul class="rows" id="processed" aria-label="What you have sent us, processed"></ul>
      <p class="muted" id="sent-none" hidden></p>

      <section class="delivery" id="delivery" hidden aria-labelledby="delivery-h">
        <!-- OB-362: the ONE form on this screen — a delivery update for one of the supplier's own open orders. -->
        <h3 id="delivery-h"></h3>
        <p class="muted" id="delivery-lead"></p>
        <p class="muted" id="du-said" hidden></p>
        <div class="du-form" id="du-form" hidden>
          <label for="du-order"><span id="du-order-l"></span><select id="du-order"></select></label>
          <label for="du-status"><span id="du-status-l"></span><select id="du-status"></select></label>
          <label for="du-expected"><span id="du-expected-l"></span><input id="du-expected" type="date" /></label>
          <label for="du-note"><span id="du-note-l"></span><input id="du-note" maxlength="300" autocomplete="off" /></label>
          <button id="du-send" type="button"><span id="du-send-text"></span></button>
        </div>
        <p class="status-line" id="du-result" role="status" aria-live="polite"></p>
      </section>

      <h3 id="statement-heading"></h3>
      <div class="statement" id="statement" hidden></div>
      <p class="muted" id="statement-inaccessible" hidden></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./supplier-app.bundle.js" type="module"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
