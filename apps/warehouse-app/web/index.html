<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Warehouse — Receiving, put-away & picking</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Warehouse handheld (M09 / OA-9). Runs on a cheap Android device held in one hand,
      often with a glove on, in a cold store or up the racking.

      The layout is scanner-first: the pick list and the goods-in worklist are the biggest
      things on screen, and every action is a scan. A bin label scanned from the list starts
      the pick of the line that names it (scan bin → scan item → confirm: 3). Targets are
      64px — a mis-tap up a ladder is a wrong bin or a wrong SKU, and the worker cannot see
      the screen well through freezer glare.
      Every scan gives a felt result (colour, sound, buzz), because "rejected" must not
      be missed by someone in ear defenders.

      Framework-free and static, so it opens with the shop's wifi down.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <script src="./sre-update.js" defer></script>
    <style>
      :root { --tap: 64px; }
      /* OB-205: the page, polished inside the approved look — tokens only, the foundation's spacing, radius, elevation and
         type scales; the task-first layout, the 64px targets and every rule of the screen unchanged. */
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 17px/1.45 var(--font);
        height: 100dvh; display: flex; flex-direction: column;
      }
      /* The header: who and what on the left, the language on the right, the sync badge as one full-width line under them. */
      header {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
        gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-4);
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      /* The page's one heading: who is working and on what. Styled as the header line it is. */
      h1.who { margin: 0; font-size: 18px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
      .who small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
      #lang {
        min-height: 56px; padding: 0 var(--space-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        background: var(--panel); color: var(--ink); border: 1px solid var(--field-line); border-radius: var(--radius-lg);
        font-size: 16px; box-shadow: var(--shadow-xs);
      }
      #lang .sre-icon { width: 18px; height: 18px; }
      /* The sync badge (design system §1 rule 4): the dot wears its state's shape, the two lines of words are the badge —
         this device's unsent count, then the store computer's state and last contact. Calm by default; amber while work
         waits here; the readable red only when a person must act. Colour is never the only signal: the words say it. */
      .sync {
        grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: var(--space-2) var(--space-3);
        background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
        font-size: 15px; min-width: 0;
      }
      .sync:has(.dot.waiting) { background: var(--warn-surface); color: var(--on-warn-surface); border-color: var(--warn-surface); }
      .sync:has(.dot.error) { background: var(--error-surface); color: var(--danger-text); border-color: var(--error-surface); }
      .sync-words { display: grid; line-height: 1.3; min-width: 0; }
      #queue-text { font-weight: 700; }
      .sync-words small { color: inherit; font-size: 14px; }
      .dot.waiting { background: var(--warn); }

      .storage { background: var(--danger-surface); color: var(--on-danger); padding: var(--space-2) var(--space-4); font-size: 15px; font-weight: 600; margin: 0; }
      .storage[hidden] { display: none; }

      main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-1) var(--space-4) var(--space-4); }
      .empty {
        color: var(--muted); padding: var(--space-6) var(--space-4); font-size: 17px; text-align: center; margin: var(--space-3) 0;
        background: var(--panel); border: 1px dashed var(--line-strong); border-radius: var(--radius-xl);
      }
      /* A list's heading: its icon, its words, and — drawn from data-count, so the words stay exactly the words — how many. */
      h2.section {
        display: flex; align-items: center; gap: var(--space-2); font-size: 14px; font-weight: 700; color: var(--muted);
        text-transform: uppercase; letter-spacing: var(--tracking-caps); margin: var(--space-4) 2px var(--space-2);
      }
      h2.section[data-count]::after {
        content: attr(data-count); margin-left: auto; min-width: 28px; padding: 2px 10px; border-radius: var(--radius-pill);
        background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-size: 15px; letter-spacing: 0;
        text-align: center; font-variant-numeric: var(--numbers);
      }
      h2.section .sre-icon { width: 18px; height: 18px; }

      /* One goods-in item per row, as a card. The product is the biggest thing; the quantity stands on the right, big;
         recall/expiry shout in words. */
      .item {
        width: 100%; text-align: left; background: var(--panel); color: var(--ink); font: inherit;
        border: 1px solid var(--line); border-left: 6px solid var(--line-strong); border-radius: var(--radius-xl);
        padding: var(--space-3) var(--space-4) var(--space-3) var(--space-3); margin-bottom: 10px; min-height: var(--tap);
        display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px var(--space-3);
        box-shadow: var(--shadow-sm);
      }
      .item > * { grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
      .item[aria-selected='true'] { outline: 3px solid var(--focus); outline-offset: 0; background: var(--mint); }
      .item.recalled { border-left-color: var(--danger); }
      /* A pick line: the bin is the biggest thing, because the bin is where the worker must walk to. */
      .item.pick { border-left-color: var(--accent); }
      .item.issue { border-left-color: var(--accent); }
      .item.transfer { border-left-color: var(--accent); }
      .item.transfer[disabled] { border-left-color: var(--ok, var(--line-strong)); cursor: default; }
      .item .flag.done { background: var(--mint); color: var(--ink); }
      .item .where { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.2; }
      .item .what { font-size: 19px; font-weight: 700; line-height: 1.3; }
      .item .where + .what { font-size: 16px; font-weight: 600; color: var(--ink-2); }
      /* The quantity: the number big and on the right where the eye lands, its unit beside it. */
      .item .qty {
        grid-column: 2; grid-row: 1 / span 3; justify-self: end; text-align: right; display: grid; justify-items: end;
        color: var(--muted); font-size: 14px; font-variant-numeric: var(--numbers); line-height: 1.25; max-width: 9.5em;
      }
      .item .qty .n { color: var(--ink); font-size: 22px; font-weight: 700; }
      .item .flag {
        justify-self: start; margin-top: var(--space-1); padding: 2px 10px; border-radius: var(--radius-pill);
        background: var(--warn-surface); color: var(--on-warn-surface); font-size: 14px; font-weight: 700;
      }
      .item.recalled .flag { background: var(--error-surface); color: var(--danger-text); }
      /* OB-37: a delivery waiting for this store — a link the receiver taps to receive against it. */
      #deliveries .row {
        display: flex; align-items: center; min-height: 56px; padding: var(--space-2) var(--space-4); margin-bottom: var(--space-2);
        background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-left: 6px solid var(--line-strong);
        border-radius: var(--radius-xl); text-decoration: none; font-weight: 600; box-shadow: var(--shadow-xs); overflow-wrap: anywhere;
      }
      #deliveries .row[aria-current='true'] { border-left-color: var(--accent); background: var(--mint); }
      /* R3 D-11: the door check-in's way in — a card with its icon beside its words. */
      #dsd-open { display: flex; align-items: center; justify-content: flex-start; gap: var(--space-2); margin-top: var(--space-3); font-weight: 700; font-size: 17px; border-left-color: var(--info); }
      #dsd-open[hidden] { display: none; }
      /* A sent scan: what it was, then one of the five state words as a chip with its shape; a refusal carries its reason. */
      .sent {
        background: var(--panel); border: 1px solid var(--line-soft); border-left: 6px solid var(--line-strong); border-radius: var(--radius-xl);
        padding: 10px var(--space-4) 10px var(--space-3); margin-bottom: var(--space-2); display: grid; gap: 6px; box-shadow: var(--shadow-xs);
      }
      .sent .what { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
      .sent .why { font-size: 15px; color: var(--danger-text); font-weight: 600; }
      .sent.refused { border-left-color: var(--danger); }
      .sent.posted { border-left-color: var(--good); }
      .sent.saved_here, .sent.retrying { border-left-color: var(--degraded); }
      .pill {
        display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: var(--radius-pill);
        font-size: 14px; font-weight: 600; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); justify-self: start;
        line-height: 1.35; max-width: 100%;
      }
      .pill .sre-icon { width: 16px; height: 16px; }
      .pill.posted { background: var(--ok-surface); color: var(--on-ok-surface); border-color: var(--ok-surface); }
      .pill.refused { background: var(--danger-surface); color: var(--on-danger); border-color: var(--danger-surface); }
      .pill.retrying, .pill.saved_here { background: var(--warn-surface); color: var(--on-warn-surface); border-color: var(--warn-surface); }

      /* The footer: what comes next, then the actions — the quieter ones on top, the one action that matters at the bottom,
         under the thumb. */
      footer {
        background: var(--panel); border-top: 1px solid var(--line); box-shadow: var(--shadow-md);
        padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px;
      }
      .step {
        font-size: 17px; font-weight: 700; line-height: 1.3; min-height: 26px; padding-left: var(--space-3);
        border-left: 4px solid var(--accent);
      }
      .step small { display: block; color: var(--muted); font-weight: 400; font-size: 15px; }
      .step small:empty { display: none; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button {
        min-height: var(--tap); border-radius: var(--radius-xl); border: 1px solid var(--line); font-size: 18px; font-weight: 600;
        background: var(--panel-2); color: var(--ink); padding: 0 var(--space-3); line-height: 1.25;
        display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); text-align: center;
        transition: transform var(--dur-fast) var(--ease-out);
      }
      button:active:not(:disabled) { transform: translateY(1px); }
      button .sre-icon { width: 22px; height: 22px; }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 20px; font-weight: 700; box-shadow: var(--shadow-sm); }
      button.primary:active:not(:disabled) { background: var(--accent-press); border-color: var(--accent-press); }
      /* A step not yet open looks waiting, not washed out: the step line above says what opens it. */
      button:disabled { opacity: 1; background: var(--panel-2); color: var(--muted); border-style: dashed; border-color: var(--line-strong); box-shadow: none; cursor: not-allowed; }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .wide { grid-column: 1 / -1; }
      /* Two to a row on a 360px phone: the words at 17px so a label wraps to two lines, not four. */
      .actions > button { font-size: 17px; padding: 0 10px; gap: 6px; }
      .actions > button.wide { font-size: 19px; }
      .actions > button .sre-icon { width: 20px; height: 20px; }
      /* The quieter row — counting and adjusting — at the handhelds' 56px bar, so the footer leaves room for the list. */
      button.quiet { min-height: 56px; font-size: 16px; background: var(--panel); }
      /* At the door: once the note is scanned, closing is the one green action and scanning steps back. */
      #dsd-work-panel:has(#dsd-close:not(:disabled)) #dsd-scan { background: var(--panel); color: var(--ink); border-color: var(--line); font-size: 18px; box-shadow: none; }
      /* With both pick and issue work held, the two sit side by side rather than stacking the footer up the screen. */
      .actions:has(> #pick:not([hidden])):has(> #issue:not([hidden])) > #pick,
      .actions:has(> #pick:not([hidden])):has(> #issue:not([hidden])) > #issue { grid-column: auto; font-size: 17px; }
      /* OB-205 (footer): an action that waits for a scan says so on a smaller second line under its words — never one long
         label wrapped to three or four lines. The action keeps its icon and its whole meaning; the button stays ≥ 56px. */
      .actions > button:has(> .why) { flex-direction: column; gap: 2px; padding: var(--space-2) 10px; min-height: var(--tap); }
      .actions > button .why { display: block; font-size: var(--fs-sm); font-weight: 600; line-height: 1.25; color: inherit; }

      /* Waiting for a scan — there is deliberately no text box to type into. */
      .sheet { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: end center; z-index: 20; }
      .sheet[hidden] { display: none; }
      .sheet-inner {
        width: min(560px, 100%); background: var(--panel); padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
        border-radius: 16px 16px 0 0; display: grid; gap: var(--space-3); max-height: 92dvh; overflow-y: auto;
        box-shadow: var(--shadow-lg); animation: sre-rise var(--dur-slow) var(--ease-out) both;
      }
      /* A grab line: says "this is a panel over the list", nothing more. */
      .sheet-inner::before { content: ''; justify-self: center; width: 40px; height: 4px; border-radius: var(--radius-pill); background: var(--line-strong); }
      .sheet h2 { margin: 0; font-size: 20px; line-height: 1.3; display: flex; align-items: flex-start; gap: var(--space-2); overflow-wrap: anywhere; }
      .sheet h2 .sre-icon { width: 24px; height: 24px; margin-top: 1px; color: var(--accent); }
      .sheet h2 .sre-with-icon { align-items: flex-start; }
      .hint { color: var(--muted); font-size: 15px; min-height: 22px; margin: 0; }
      .awaiting {
        background: var(--mint); color: var(--on-ok-surface); border-radius: var(--radius-xl); padding: var(--space-5) var(--space-4); text-align: center;
        font-size: 20px; font-weight: 700; border: 2px dashed var(--accent); display: grid; justify-items: center; gap: var(--space-2);
      }
      .awaiting .sre-icon { width: 36px; height: 36px; }
      .awaiting .sre-with-icon { display: grid; justify-items: center; gap: var(--space-2); }
      .sheet-actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
      .sheet-actions.two { grid-template-columns: 1fr 1fr; }
      /* A quantity typed on a keypad (a count, an adjustment): the number is big, the keys are buttons — never a text box. */
      .entry {
        background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-xl); padding: var(--space-3) var(--space-4); text-align: center;
        font-size: 40px; font-weight: 700; font-variant-numeric: var(--numbers); line-height: 1.2; overflow-wrap: anywhere;
      }
      /* Wave 3 · SF-07 part 3: the arrival-temperature box — a full-width 56 px touch target, the phone's number keyboard. */
      #recv-temp-field { margin: var(--space-2) 0 10px; }
      #dsd-batch, #dsd-expiry, #dsd-mfg { min-height: 56px; width: 100%; font-size: 16px; background: var(--panel); justify-content: flex-start; text-align: left; padding: var(--space-2) var(--space-4); }
      #recv-mfg { min-height: 56px; width: 100%; font-size: 16px; background: var(--panel); justify-content: flex-start; text-align: left; padding: var(--space-2) var(--space-4); margin-top: var(--space-2); }
      #recv-temp { min-height: 56px; width: 100%; font-size: 16px; background: var(--panel); justify-content: flex-start; text-align: left; padding: var(--space-2) var(--space-4); }
      .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
      .keypad button, .choices button, .direction button { min-height: 56px; font-size: 19px; background: var(--panel); }
      .keypad button { font-size: 24px; font-weight: 700; font-variant-numeric: var(--numbers); }
      .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
      /* A hidden choice list stays hidden: the class above would otherwise outrank the [hidden] attribute and show the
         corrective actions before any check had failed. */
      .choices[hidden] { display: none; }
      .direction { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
      .direction button[aria-pressed='true'], .choices button[aria-pressed='true'] {
        outline: 3px solid var(--focus); outline-offset: 0; background: var(--mint); border-color: var(--accent); color: var(--on-ok-surface);
      }
      /* OB-172: one receiving-checklist line — its words, then Pass / Fail as two big buttons; the count of checks done above. */
      .check-item { display: grid; gap: 6px; padding: var(--space-3) 0; border-top: 1px solid var(--line-soft); }
      .check-item > span { font-weight: 600; }
      .check-item .direction button { min-height: 56px; }
      .progress { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); font-variant-numeric: var(--numbers); }
      .progress[hidden] { display: none; }
      /* The confirm step of a pick: the number about to be committed, unmissable, then one tap. */
      .big-qty {
        background: var(--mint); border: 1px solid var(--line); border-radius: var(--radius-xl); padding: var(--space-4); text-align: center;
        font-size: 22px; font-weight: 700; font-variant-numeric: var(--numbers); color: var(--on-ok-surface); line-height: 1.2;
      }
      .big-qty .n { display: block; font-size: 52px; color: var(--ink); letter-spacing: var(--tracking-tight); }
      /* R3 D-11: a line at the door — the product, then how many came off the van out of how many the order expects, big. */
      #dsd-start-panel:not([hidden]), #dsd-work-panel:not([hidden]) { display: grid; gap: var(--space-3); }
      #dsd-lines .item { margin-bottom: var(--space-2); }
      #dsd-back-batches:not([hidden]) { grid-template-columns: 1fr; } /* OB-611: one batch per row — its number, expiry and what is left */
      #dsd-back-batches button { display: flex; align-items: center; gap: var(--space-2); justify-content: flex-start; text-align: left; font-size: 17px; padding: var(--space-2) var(--space-3); }
      #dsd-lines .item .qty { grid-column: 1; grid-row: auto; justify-self: start; text-align: left; display: block; max-width: none; }
      #dsd-lines .item .count { grid-column: 2; grid-row: 1 / span 2; font-size: 14px; color: var(--muted); text-align: right; font-variant-numeric: var(--numbers); }
      #dsd-lines .item .count .n { display: block; font-size: 24px; font-weight: 700; color: var(--ink); }
      #dsd-lines .item .batches { grid-column: 1 / -1; display: block; font-size: 14px; color: var(--muted); } /* OB-604: the line split by batch */
      #dsd-differences .discrepancy {
        margin: 0 0 var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg); font-size: 16px; font-weight: 700;
        background: var(--warn-surface); color: var(--on-warn-surface); border-left: 4px solid var(--degraded);
      }
      #dsd-no-cash { padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg); background: var(--info-surface); color: var(--on-info-surface); font-weight: 600; }

      /* The scan-result banner. No timer, never colour alone — a rejected scan carries a word and its shape. */
      .banner {
        position: fixed; inset: 0 0 auto 0; z-index: 30; padding: var(--space-5) var(--space-4) var(--space-4);
        background: var(--danger-surface); color: var(--on-danger); display: grid; gap: 10px; box-shadow: var(--shadow-lg);
        animation: sre-rise var(--dur-slow) var(--ease-out) both;
      }
      .banner[hidden] { display: none; }
      .banner.good { background: var(--good); color: var(--on-accent); }
      .banner.warn { background: var(--warn); color: var(--on-warn); }
      .banner-head { display: flex; align-items: flex-start; gap: 10px; }
      #banner-mark { display: inline-flex; flex: none; }
      #banner-mark .sre-icon { width: 28px; height: 28px; stroke-width: 2; }
      .banner strong { font-size: 21px; line-height: 1.3; overflow-wrap: anywhere; }
      .banner p { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
      .banner p:empty { display: none; }
      .banner button { background: var(--panel); color: var(--ink); border-color: var(--panel); font-weight: 700; }
      .banner.good button { background: var(--on-accent); color: var(--ink); }
      .banner.warn button { background: var(--on-warn); color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="who">—<small id="assignment">—</small></h1>
      <button class="lang" id="lang" type="button" aria-label="Language"><span data-sre-icon="globe"></span>EN / த</button>
      <span class="sync">
        <span class="dot" id="queue-dot" data-sre-status title="Sync"></span>
        <span class="sync-words"><span id="queue-text">—</span><small id="box-text">—</small></span>
      </span>
    </header>

    <p class="sample" id="sample" hidden role="status">Sample assignment — this is not real work.</p>
    <p class="storage" id="storage" hidden role="alert"></p>
    <p class="storage" id="not-allowed" hidden role="alert"></p>
    <p class="stale" id="stale" hidden role="status"></p>

    <main>
      <h2 class="section" id="pick-heading" hidden>—</h2>
      <div id="pick-lines"></div>
      <!-- SP-8c: floor indents the back store owes — issue against the indent: tap the line → scan the bin you take from → scan the item → confirm. -->
      <h2 class="section" id="issue-heading" hidden>—</h2>
      <div id="issue-lines"></div>
      <!-- OB-288 lane 2 · WF-07 offline: transfers this store sends (one tap, then confirm) and counts in (a keypad count per line). -->
      <h2 class="section" id="xfer-send-heading" hidden>—</h2>
      <div id="xfer-send"></div>
      <h2 class="section" id="xfer-in-heading" hidden>—</h2>
      <div id="xfer-in"></div>
      <p class="stale" id="xfer-asof" hidden></p>
      <!-- OB-37: the deliveries this store is waiting for; the receiver chooses which one is at the door. -->
      <h2 class="section" id="deliveries-heading" hidden>—</h2>
      <div id="deliveries"></div>
      <!-- R3 D-11 (OB-141): a direct delivery at the back door — check it in against its order or route; no cash at the door. -->
      <button id="dsd-open" class="item" type="button">Direct delivery at the door (no cash)</button>
      <h2 class="section" id="goods-in-heading">—</h2>
      <div id="goods-in"></div>
      <p class="empty" id="empty" hidden>—</p>
      <!-- Where each accepted scan has got to (SP-3a · S1), from the durable device queue plus the store computer's word. -->
      <!-- Wave 3 · SF-07 part 3: the probed arrival temperature for chilled or frozen goods; it rides on every scan while filled in. -->
      <!-- Buttons, never a text box (the handheld's scanner discipline): the reading is entered on its own keypad sheet. -->
      <div id="recv-temp-field">
        <button id="recv-temp" type="button" class="wide">Arrival temperature (chilled or frozen goods): not taken</button>
        <!-- B4 · OB-504: the month of manufacture on a packed product's pack, keyed as YYYYMM; it rides on every scan. -->
        <button id="recv-mfg" type="button" class="wide">Month of manufacture (packed goods): not entered</button>
      </div>
      <h2 class="section" id="sent-heading" hidden>—</h2>
      <div id="sent-work"></div>
    </main>

    <footer>
      <div class="step" id="step">—<small id="step-detail"></small></div>
      <!-- OB-205: the quieter actions first, the primary ones last — at the bottom, under the thumb. Only the one the worker
           has opened (by tapping a line) is enabled, so only one is ever the dominant green. -->
      <div class="actions">
        <!-- SP-3b: a BLIND bin count (W2) and an adjustment REQUEST with a reason (W3). Neither moves stock on this handheld. -->
        <button id="count-bin" class="quiet" type="button" disabled>Count a bin</button>
        <button id="adjust-stock" class="quiet" type="button" disabled>Adjust stock</button>
        <!-- SP-6b: shown once this handheld has received something for the delivery. Sends it as ONE receipt for head office
             to assemble against the order — no quantity travels, the scans already did. -->
        <button id="done-receiving" class="wide" type="button" hidden>Delivery complete — send the receipt</button>
        <button id="receive" type="button">Receive a delivery</button>
        <button id="put-away" class="primary" type="button" disabled>Put away<small class="why">scan the bin</small></button>
        <!-- Shown only when the handheld holds pick work. Scanning a line's bin from the list starts the pick without it. -->
        <button id="pick" class="primary wide" type="button" disabled hidden>Pick<small class="why">scan the bin</small></button>
        <!-- SP-8c: shown only when the handheld holds floor indents to issue. -->
        <button id="issue" class="primary wide" type="button" disabled hidden>Issue to the floor<small class="why">scan the bin</small></button>
      </div>
    </footer>

    <!--
      Waiting for a scan. There is deliberately NO text box: a shop scanner is a keyboard
      that types fast and presses Enter, and an input that can lose focus is how a barcode
      ends up in a quantity field or the wrong bin.
    -->
    <div class="sheet" id="scan" hidden role="dialog" aria-modal="true" aria-labelledby="scan-title">
      <div class="sheet-inner">
        <h2 id="scan-title">—</h2>
        <div class="awaiting" id="scan-awaiting">—</div>
        <div class="hint" id="scan-hint"></div>
        <div class="sheet-actions">
          <button id="scan-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <!--
      The third step of a pick: the quantity about to leave the bin, shown before it is committed.
      One tap confirms; nothing is typed. The number is the model's (what remains on the line).
    -->
    <div class="sheet" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="sheet-inner">
        <h2 id="confirm-title">—</h2>
        <div class="big-qty" id="confirm-qty">—</div>
        <div class="hint" id="confirm-hint"></div>
        <div class="sheet-actions two">
          <button id="confirm-cancel" type="button">Cancel</button>
          <button id="confirm-ok" class="primary" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <!--
      A quantity, typed on a keypad (W2's blind count). Nothing on this panel says what the bin SHOULD hold: the
      expected figure lives at head office and is never sent to this handheld — the same discipline as the till drawer
      and the driver's cash count.
    -->
    <div class="sheet" id="qty" hidden role="dialog" aria-modal="true" aria-labelledby="qty-title">
      <div class="sheet-inner">
        <h2 id="qty-title">—</h2>
        <div class="hint" id="qty-hint"></div>
        <div class="entry" id="qty-entry" aria-live="polite">0</div>
        <div class="keypad" id="qty-keypad"></div>
        <div class="sheet-actions two">
          <button id="qty-cancel" type="button">Cancel</button>
          <button id="qty-ok" class="primary" type="button">OK</button>
        </div>
      </div>
    </div>

    <!--
      An adjustment REQUEST (W3): direction, quantity, then the reason — tapping the reason records the request. It is
      a request: a supervisor who is not this worker approves it at head office before anything posts (§28).
    -->
    <!-- Wave 3 · SF-07 part 3: the arrival temperature, °C, on a keypad with a minus and a decimal point. -->
    <div class="sheet" id="temp" hidden role="dialog" aria-modal="true" aria-labelledby="temp-title">
      <div class="sheet-inner">
        <h2 id="temp-title">—</h2>
        <div class="hint" id="temp-hint"></div>
        <div class="entry" id="temp-entry" aria-live="polite">—</div>
        <div class="keypad" id="temp-keypad"></div>
        <div class="sheet-actions">
          <button id="temp-none" type="button">No reading</button>
        </div>
        <div class="sheet-actions two">
          <button id="temp-cancel" type="button">Cancel</button>
          <button id="temp-ok" class="primary" type="button">OK</button>
        </div>
      </div>
    </div>

    <!--
      OB-172: the receiving checklist for a chilled, frozen or raw-meat delivery, done at the door before "Delivery complete".
      A Pass / Fail pair per check (buttons, never a text box); on any failure, tap what was done. It travels INSIDE the one
      receipt this handheld sends, in the name of the person signed in on it.
    -->
    <div class="sheet" id="checklist" hidden role="dialog" aria-modal="true" aria-labelledby="checklist-title">
      <div class="sheet-inner">
        <h2 id="checklist-title">—</h2>
        <div class="hint" id="checklist-hint"></div>
        <!-- OB-205: how many of the checks are answered, in words — "2 of 3 checked". -->
        <p class="progress" id="checklist-progress" hidden></p>
        <div id="checklist-items"></div>
        <div class="hint" id="checklist-action-hint" hidden></div>
        <div class="choices" id="checklist-actions" hidden></div>
        <div class="sheet-actions two">
          <button id="checklist-cancel" type="button">Cancel</button>
          <button id="checklist-ok" class="primary" type="button" disabled>Send the receipt</button>
        </div>
      </div>
    </div>

    <div class="sheet" id="adjust" hidden role="dialog" aria-modal="true" aria-labelledby="adjust-title">
      <div class="sheet-inner">
        <h2 id="adjust-title">—</h2>
        <div class="hint" id="adjust-hint"></div>
        <div class="direction">
          <button id="adjust-minus" type="button" aria-pressed="true">Missing / damaged (−)</button>
          <button id="adjust-plus" type="button" aria-pressed="false">Found (+)</button>
        </div>
        <div class="entry" id="adjust-entry" aria-live="polite">1</div>
        <div class="keypad" id="adjust-keypad"></div>
        <div class="hint" id="adjust-reason-hint"></div>
        <div class="choices" id="adjust-reasons"></div>
        <div class="sheet-actions">
          <button id="adjust-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <!--
      R3 D-11 (OB-141): the direct-delivery door check-in. Choose the order (or the vendor's route), key the driver's name,
      scan what comes off the van, hand back what is refused, then close with the signed delivery note. There is NO money
      field: the supplier is paid later against the bill.
    -->
    <div class="sheet" id="dsd" hidden role="dialog" aria-modal="true" aria-labelledby="dsd-title" style="z-index: 15">
      <div class="sheet-inner">
        <h2 id="dsd-title">Direct delivery at the door</h2>
        <p class="hint" id="dsd-no-cash">No cash at the door. The driver gets the signed delivery note; the supplier is paid later as a supplier bill.</p>
        <!-- OB-205: Back sits at the top, quiet, so the step's own action is the last thing on the panel, under the thumb. -->
        <div class="sheet-actions">
          <button id="dsd-cancel" class="quiet" type="button">Back</button>
        </div>
        <div id="dsd-start-panel">
          <div class="hint" id="dsd-choose-hint">Choose the delivery</div>
          <div class="choices" id="dsd-choices"></div>
          <!-- Buttons, never a text box: the driver's mobile number is keyed on this keypad. -->
          <div class="entry" id="dsd-driver-entry" aria-live="polite">0</div>
          <div class="keypad" id="dsd-driver-keypad"></div>
          <button id="dsd-driver" type="button" class="wide">Driver's mobile number: not keyed</button>
          <div class="sheet-actions">
            <button id="dsd-start" class="primary" type="button" disabled>Start the check-in</button>
          </div>
        </div>
        <div id="dsd-work-panel" hidden>
          <div class="hint" id="dsd-against"></div>
          <div id="dsd-lines"></div>
          <div id="dsd-differences"></div>
          <!-- B4 · OB-504 (round 11): the batch, its expiry and its month of manufacture, off the pack — they ride on every
               door scan until changed. A packed product needs the month of manufacture, here offline and at head office. -->
          <button id="dsd-batch" type="button" class="wide">Batch: not scanned</button>
          <button id="dsd-expiry" type="button" class="wide">Expiry: not entered</button>
          <button id="dsd-mfg" type="button" class="wide">Month of manufacture (packed goods): not entered</button>
          <div class="sheet-actions two">
            <button id="dsd-scan" class="primary" type="button">Scan an item</button>
            <button id="dsd-hand-back" type="button">Hand back to the driver</button>
          </div>
          <div class="hint" id="dsd-back-hint" hidden></div>
          <div class="choices" id="dsd-back-products" hidden></div>
          <!-- OB-611: which batch is handed back, asked only for a product that came off the van in more than one batch. -->
          <div class="choices" id="dsd-back-batches" hidden></div>
          <div class="choices" id="dsd-back-reasons" hidden></div>
          <!-- The delivery note's own barcode is scanned; the driver then signs it on this screen with one tap. -->
          <button id="dsd-note" type="button" class="wide">Delivery note: scan its barcode</button>
          <button id="dsd-close" class="primary wide" type="button" disabled>Driver signs the note — close the delivery</button>
        </div>
      </div>
    </div>

    <!-- The scan result that must not be missed. No timer; a colour, a word, a sound and a buzz. -->
    <div class="banner" id="banner" hidden role="alert">
      <div class="banner-head sre-with-icon"><span id="banner-mark" aria-hidden="true"></span><strong id="banner-title">—</strong></div>
      <p id="banner-text"></p>
      <button id="banner-ok" type="button">OK</button>
    </div>

    <!--
      The store box puts this screen's data here, above the bundle, because the bundle reads
      its global while it evaluates. A screen that fetched afterwards would render once with
      nothing — and "nothing" on these screens means NOT KNOWN, so the screen would flash
      "I have been told nothing" before correcting itself.

      Served straight from a file instead, the marker is left in place and the shell falls
      back to its sample data, which it announces.
    -->
    <!--SCREEN-DATA-->
    <script type="module" src="./warehouse-app.bundle.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
