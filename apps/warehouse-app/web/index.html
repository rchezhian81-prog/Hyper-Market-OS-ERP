<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Warehouse — Receiving, put-away & picking</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Warehouse handheld (M09 / OA-9). Runs on a cheap Android device held in one hand,
      often with a glove on, in a cold store or up the racking.

      The layout is scanner-first: the pick list and the goods-in worklist are the biggest
      things on screen, and every action is a scan. A bin label scanned from the list starts
      the pick of the line that names it (scan bin → scan item → confirm: 3). Targets are
      64px — a mis-tap up a ladder is a wrong bin or a wrong SKU, and the worker cannot see
      the screen well through freezer glare.
      Every scan gives a felt result (colour, sound, buzz), because "rejected" must not
      be missed by someone in ear defenders.

      Framework-free and static, so it opens with the shop's wifi down.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap: 64px; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 17px/1.45 var(--font);
        height: 100dvh; display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 8px 14px; background: var(--panel);
      }
      /* The page's one heading: who is working and on what. Styled as the header line it is. */
      h1.who { margin: 0; font-size: 17px; font-weight: 600; }
      .who small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
      /* The sync badge (design system §1 rule 4): the dot is decoration, the two lines of words are the badge —
         this device's unsent count, then the store computer's state and last contact. */
      .sync-words { display: grid; line-height: 1.25; text-align: right; }
      .sync-words small { color: var(--muted); font-size: 13px; }
      .dot.waiting { background: var(--warn); }

      .storage { background: var(--danger-surface); color: var(--on-danger); padding: 8px 14px; font-size: 15px; margin: 0; }
      .storage[hidden] { display: none; }

      main { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px; }
      .empty { color: var(--muted); padding: 32px 4px; font-size: 17px; }
      h2.section { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 2px 8px; }

      /* One goods-in item per row. The product is the biggest thing; recall/expiry shout. */
      .item {
        width: 100%; text-align: left; background: var(--panel); color: var(--ink);
        border: 0; border-left: 6px solid var(--line); border-radius: 14px;
        padding: 12px 14px; margin-bottom: 10px; min-height: var(--tap); display: grid; gap: 2px;
      }
      .item[aria-selected='true'] { outline: 3px solid var(--focus); }
      .item.recalled { border-left-color: var(--danger); }
      /* A pick line: the bin is the biggest thing, because the bin is where the worker must walk to. */
      .item.pick { border-left-color: var(--accent); }
      .item.issue { border-left-color: var(--accent); }
      .item .where { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .item .what { font-size: 20px; font-weight: 700; }
      .item .qty { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
      .item .flag { font-size: 14px; font-weight: 600; color: var(--warn); }
      /* A sent scan: what it was, then one of the five state words as a pill; a refusal carries its reason. */
      .sent { background: var(--panel); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; display: grid; gap: 6px; border-left: 6px solid var(--line); }
      .sent .what { font-size: 16px; font-weight: 600; }
      .sent .why { font-size: 14px; color: var(--muted); }
      .sent.refused { border-left-color: var(--danger); }
      .sent.posted { border-left-color: var(--good); }
      .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--line); color: var(--ink); justify-self: start; }
      .pill.posted { background: var(--good); color: var(--on-accent); }
      .pill.refused { background: var(--danger-surface); color: var(--on-danger); }
      .pill.retrying { background: var(--warn); color: var(--on-warn); }

      footer { background: var(--panel); padding: 12px 14px 18px; display: grid; gap: 10px; }
      .step { font-size: 19px; font-weight: 600; min-height: 26px; }
      .step small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button {
        min-height: var(--tap); border-radius: 14px; border: 0; font-size: 18px; font-weight: 600;
        background: var(--line); color: var(--ink);
      }
      button.primary { background: var(--good); color: var(--on-accent); font-size: 20px; }
      button:disabled { opacity: .45; }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .wide { grid-column: 1 / -1; }

      /* Waiting for a scan — there is deliberately no text box to type into. */
      .sheet { position: fixed; inset: 0; background: rgba(2, 6, 23, .86); display: grid; place-items: end center; z-index: 20; }
      .sheet[hidden] { display: none; }
      .sheet-inner {
        width: min(560px, 100%); background: var(--panel); padding: 18px;
        border-radius: 20px 20px 0 0; display: grid; gap: 12px; max-height: 92dvh; overflow-y: auto;
      }
      .sheet h2 { margin: 0; font-size: 20px; }
      .hint { color: var(--muted); font-size: 15px; min-height: 22px; }
      .awaiting {
        background: var(--panel-2); border-radius: 12px; padding: 18px 16px; text-align: center;
        font-size: 20px; font-weight: 600; border: 2px dashed var(--line);
      }
      .sheet-actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
      .sheet-actions.two { grid-template-columns: 1fr 1fr; }
      /* A quantity typed on a keypad (a count, an adjustment): the number is big, the keys are buttons — never a text box. */
      .entry {
        background: var(--panel-2); border-radius: 12px; padding: 14px 16px; text-align: center;
        font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums;
      }
      .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .keypad button, .choices button, .direction button { min-height: 56px; font-size: 19px; }
      .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .direction { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .direction button[aria-pressed='true'] { outline: 3px solid var(--focus); background: var(--panel-2); }
      /* The confirm step of a pick: the number about to be committed, unmissable, then one tap. */
      .big-qty {
        background: var(--panel-2); border-radius: 12px; padding: 18px 16px; text-align: center;
        font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums;
      }

      /* The scan-result banner. No timer, never colour alone — a rejected scan carries a word. */
      .banner {
        position: fixed; inset: 0 0 auto 0; z-index: 30; padding: 18px 14px;
        background: var(--danger-surface); color: var(--on-danger); display: grid; gap: 10px;
      }
      .banner[hidden] { display: none; }
      .banner.good { background: var(--good); color: var(--on-accent); }
      .banner.warn { background: var(--warn); color: var(--on-warn); }
      .banner strong { font-size: 21px; }
      .banner p { margin: 0; font-size: 17px; }
      .banner button { background: var(--panel-2); color: var(--ink); }
      .banner.good button { background: var(--on-accent); color: var(--ink); }
      .banner.warn button { background: var(--on-warn); color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="who">—<small id="assignment">—</small></h1>
      <span class="sync">
        <span class="dot" id="queue-dot" title="Sync"></span>
        <span class="sync-words"><span id="queue-text">—</span><small id="box-text">—</small></span>
        <button class="lang" id="lang" type="button" aria-label="Language">EN / த</button>
      </span>
    </header>

    <p class="sample" id="sample" hidden role="status">Sample assignment — this is not real work.</p>
    <p class="storage" id="storage" hidden role="alert"></p>
    <p class="stale" id="stale" hidden role="status"></p>

    <main>
      <h2 class="section" id="pick-heading" hidden>—</h2>
      <div id="pick-lines"></div>
      <!-- SP-8c: floor indents the back store owes — issue against the indent: tap the line → scan the bin you take from → scan the item → confirm. -->
      <h2 class="section" id="issue-heading" hidden>—</h2>
      <div id="issue-lines"></div>
      <h2 class="section" id="goods-in-heading">—</h2>
      <div id="goods-in"></div>
      <p class="empty" id="empty" hidden>—</p>
      <!-- Where each accepted scan has got to (SP-3a · S1), from the durable device queue plus the store computer's word. -->
      <h2 class="section" id="sent-heading" hidden>—</h2>
      <div id="sent-work"></div>
    </main>

    <footer>
      <div class="step" id="step">—<small id="step-detail"></small></div>
      <div class="actions">
        <button id="receive" type="button">Receive a delivery</button>
        <button id="put-away" class="primary" type="button" disabled>Put away — scan the bin</button>
        <!-- SP-6b: shown once this handheld has received something for the delivery. Sends it as ONE receipt for head office
             to assemble against the order — no quantity travels, the scans already did. -->
        <button id="done-receiving" class="wide" type="button" hidden>Delivery complete — send the receipt</button>
        <!-- Shown only when the handheld holds pick work. Scanning a line's bin from the list starts the pick without it. -->
        <button id="pick" class="primary wide" type="button" disabled hidden>Pick — scan the bin</button>
        <!-- SP-8c: shown only when the handheld holds floor indents to issue. -->
        <button id="issue" class="primary wide" type="button" disabled hidden>Issue to the floor — scan the bin</button>
        <!-- SP-3b: a BLIND bin count (W2) and an adjustment REQUEST with a reason (W3). Neither moves stock on this handheld. -->
        <button id="count-bin" type="button" disabled>Count a bin</button>
        <button id="adjust-stock" type="button" disabled>Adjust stock</button>
      </div>
    </footer>

    <!--
      Waiting for a scan. There is deliberately NO text box: a shop scanner is a keyboard
      that types fast and presses Enter, and an input that can lose focus is how a barcode
      ends up in a quantity field or the wrong bin.
    -->
    <div class="sheet" id="scan" hidden role="dialog" aria-modal="true" aria-labelledby="scan-title">
      <div class="sheet-inner">
        <h2 id="scan-title">—</h2>
        <div class="awaiting" id="scan-awaiting">—</div>
        <div class="hint" id="scan-hint"></div>
        <div class="sheet-actions">
          <button id="scan-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <!--
      The third step of a pick: the quantity about to leave the bin, shown before it is committed.
      One tap confirms; nothing is typed. The number is the model's (what remains on the line).
    -->
    <div class="sheet" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="sheet-inner">
        <h2 id="confirm-title">—</h2>
        <div class="big-qty" id="confirm-qty">—</div>
        <div class="hint" id="confirm-hint"></div>
        <div class="sheet-actions two">
          <button id="confirm-cancel" type="button">Cancel</button>
          <button id="confirm-ok" class="primary" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <!--
      A quantity, typed on a keypad (W2's blind count). Nothing on this panel says what the bin SHOULD hold: the
      expected figure lives at head office and is never sent to this handheld — the same discipline as the till drawer
      and the driver's cash count.
    -->
    <div class="sheet" id="qty" hidden role="dialog" aria-modal="true" aria-labelledby="qty-title">
      <div class="sheet-inner">
        <h2 id="qty-title">—</h2>
        <div class="hint" id="qty-hint"></div>
        <div class="entry" id="qty-entry" aria-live="polite">0</div>
        <div class="keypad" id="qty-keypad"></div>
        <div class="sheet-actions two">
          <button id="qty-cancel" type="button">Cancel</button>
          <button id="qty-ok" class="primary" type="button">OK</button>
        </div>
      </div>
    </div>

    <!--
      An adjustment REQUEST (W3): direction, quantity, then the reason — tapping the reason records the request. It is
      a request: a supervisor who is not this worker approves it at head office before anything posts (§28).
    -->
    <div class="sheet" id="adjust" hidden role="dialog" aria-modal="true" aria-labelledby="adjust-title">
      <div class="sheet-inner">
        <h2 id="adjust-title">—</h2>
        <div class="hint" id="adjust-hint"></div>
        <div class="direction">
          <button id="adjust-minus" type="button" aria-pressed="true">Missing / damaged (−)</button>
          <button id="adjust-plus" type="button" aria-pressed="false">Found (+)</button>
        </div>
        <div class="entry" id="adjust-entry" aria-live="polite">1</div>
        <div class="keypad" id="adjust-keypad"></div>
        <div class="hint" id="adjust-reason-hint"></div>
        <div class="choices" id="adjust-reasons"></div>
        <div class="sheet-actions">
          <button id="adjust-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <!-- The scan result that must not be missed. No timer; a colour, a word, a sound and a buzz. -->
    <div class="banner" id="banner" hidden role="alert">
      <strong id="banner-title">—</strong>
      <p id="banner-text"></p>
      <button id="banner-ok" type="button">OK</button>
    </div>

    <!--
      The store box puts this screen's data here, above the bundle, because the bundle reads
      its global while it evaluates. A screen that fetched afterwards would render once with
      nothing — and "nothing" on these screens means NOT KNOWN, so the screen would flash
      "I have been told nothing" before correcting itself.

      Served straight from a file instead, the marker is left in place and the shell falls
      back to its sample data, which it announces.
    -->
    <!--SCREEN-DATA-->
    <script type="module" src="./warehouse-app.bundle.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
