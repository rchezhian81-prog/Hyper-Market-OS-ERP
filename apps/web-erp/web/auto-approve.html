<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Auto-approve limits</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Auto-approve limits (CR-01 OI-12 · OB-712). A THIN CLIENT over head office's auto-approve routes: the rules in force,
      the requests waiting for a second person, the one switch (GET /v1/ai/auto-approve); asking (POST …/requests),
      confirming or refusing (POST …/requests/:id/decision) and stopping (POST …/stop). Its session is
      apps/web-erp/src/auto-approve-session.ts.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-faces.js" defer></script>
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; } h4 { margin: 0; font-size: 15px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
      input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
      button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .row-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      .row-form > label { flex: 1 1 180px; }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      ul.rows > li { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; border-left: 6px solid var(--idle); overflow-wrap: anywhere; }
      ul.rows > li[data-set="true"], ul.rows > li[data-outcome="auto_approved"] { border-left-color: var(--ok); }
      ul.rows > li[data-outcome="waits_for_a_person"], #pending-list > li { border-left-color: var(--degraded); }
      #switch[data-running="true"] #switch-state { color: var(--ok); }
      .meta { font-size: 14px; color: var(--muted); margin: 0; }
      .status { font-size: 14px; min-height: 20px; margin: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Auto-approve limits</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section id="page-intro" aria-labelledby="page-h">
        <h2 id="page-h">Auto-approve limits</h2>
        <p class="lead" id="lead"></p>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <section id="switch" hidden aria-labelledby="switch-h">
        <h3 id="switch-h"></h3>
        <p id="switch-state"></p>
        <p class="meta" id="switch-who"></p>
        <form class="row-form" id="stop-form" hidden>
          <label for="stop-reason"><span id="stop-reason-l"></span><input id="stop-reason" autocomplete="off" /></label>
          <button id="stop" type="submit" class="sre-btn sre-btn-danger"><span id="stop-text"></span></button>
        </form>
        <form class="row-form" id="start-form" hidden>
          <label for="start-reason"><span id="start-reason-l"></span><input id="start-reason" autocomplete="off" /></label>
          <button id="start" type="submit" class="sre-btn"><span id="start-text"></span></button>
        </form>
        <p class="status" id="switch-status" role="status" aria-live="polite"></p>
      </section>
      <section id="limits" hidden aria-labelledby="limits-h">
        <h3 id="limits-h"></h3>
        <ul class="rows" id="kind-list"></ul>
        <p class="status" id="limits-status" role="status" aria-live="polite"></p>
      </section>
      <section id="pending" hidden aria-labelledby="pending-h">
        <h3 id="pending-h"></h3>
        <ul class="rows" id="pending-list"></ul>
        <p class="status" id="pending-status" role="status" aria-live="polite"></p>
      </section>
      <section id="never" hidden aria-labelledby="never-h">
        <h3 id="never-h"></h3>
        <p id="never-lead"></p>
        <ul id="never-list"></ul>
      </section>
      <section id="decisions" hidden aria-labelledby="decisions-h">
        <h3 id="decisions-h"></h3>
        <ul class="rows" id="decision-list"></ul>
      </section>
      <section id="history" hidden aria-labelledby="history-h">
        <h3 id="history-h"></h3>
        <ul class="rows" id="history-list"></ul>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./auto-approve.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
