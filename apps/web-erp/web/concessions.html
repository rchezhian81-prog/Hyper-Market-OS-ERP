<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Concessions</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Concessions — counters inside the shop run by someone else (M27-FR-01..04 · OB-288 package 3 · OB-304: switched off
      until the owner turns it on). A THIN CLIENT over head office's concession contracts, deposits, period charge,
      settlement and expiry alerts. Its session is apps/web-erp/src/concession-session.ts. A contract trades only once a
      second person approves it; a deposit is their money; every write is a click in the person's own name.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1120px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
      input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      textarea { min-height: 96px; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
      button.quiet { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
      button:disabled { opacity: .6; cursor: default; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .row-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      .row-form > label { flex: 1 1 180px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      ul.rows li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
      .meta { font-size: var(--fs-sm); color: var(--muted); }
      .figs { display: flex; gap: 16px; flex-wrap: wrap; }
      .figs > div { display: grid; }
      [hidden] { display: none !important; }
          /* U1: a hidden button stays hidden although it wears the foundation's button class (the foundation's .sre-btn display rule follows its [hidden] rule). */
      .sre-btn[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Concessions</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section aria-labelledby="page-h">
        <h2 id="page-h">Concessions</h2>
        <p class="lead" id="lead"></p>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>

      <section id="counters" hidden aria-labelledby="counters-h">
        <h3 id="counters-h"></h3>
        <ul class="rows" id="c-rows"></ul>
        <ul class="rows" id="c-asked"></ul>
        <button id="raise" type="button" class="quiet sre-btn sre-btn-quiet" hidden><span id="raise-text"></span></button>
        <p class="status" id="c-status" role="status" aria-live="polite"></p>
      </section>

      <section id="contract" hidden aria-labelledby="contract-h">
        <h3 id="contract-h"></h3>
        <div class="row-form">
          <label for="f-id"><span id="f-id-l"></span><input id="f-id" autocomplete="off" /></label>
          <label for="f-who"><span id="f-who-l"></span><input id="f-who" autocomplete="off" /></label>
          <label for="f-name"><span id="f-name-l"></span><input id="f-name" autocomplete="off" /></label>
          <label for="f-branch"><span id="f-branch-l"></span><input id="f-branch" autocomplete="off" /></label>
          <label for="f-start"><span id="f-start-l"></span><input id="f-start" type="date" /></label>
          <label for="f-end"><span id="f-end-l"></span><input id="f-end" type="date" /></label>
          <label for="f-basis"><span id="f-basis-l"></span><select id="f-basis"><option value="fixed_rent" id="f-basis-rent"></option><option value="revenue_share" id="f-basis-share"></option><option value="higher_of_both" id="f-basis-higher"></option></select></label>
          <label for="f-rent"><span id="f-rent-l"></span><input id="f-rent" inputmode="decimal" autocomplete="off" /></label>
          <label for="f-share"><span id="f-share-l"></span><input id="f-share" inputmode="decimal" autocomplete="off" /></label>
          <label for="f-util"><span id="f-util-l"></span><input id="f-util" inputmode="decimal" autocomplete="off" /></label>
          <label for="f-deposit"><span id="f-deposit-l"></span><input id="f-deposit" inputmode="decimal" autocomplete="off" /></label>
          <label for="f-ins"><span id="f-ins-l"></span><input id="f-ins" type="date" /></label>
          <label for="f-lic"><span id="f-lic-l"></span><input id="f-lic" type="date" /></label>
        </div>
        <div class="actions">
          <button id="f-save" type="button" class="quiet sre-btn sre-btn-quiet"><span id="f-save-text"></span></button>
          <button id="f-ask" type="button" class="sre-btn sre-btn-primary"><span id="f-ask-text"></span></button>
        </div>
        <p class="status" id="f-status" role="status" aria-live="polite"></p>
      </section>

      <section id="deposit" hidden aria-labelledby="deposit-h">
        <h3 id="deposit-h"></h3>
        <div class="row-form">
          <label for="d-who"><span id="d-who-l"></span><input id="d-who" autocomplete="off" /></label>
          <label for="d-kind"><span id="d-kind-l"></span><select id="d-kind"><option value="received" id="d-kind-in"></option><option value="refunded" id="d-kind-out"></option><option value="forfeited" id="d-kind-forfeit"></option></select></label>
          <label for="d-amount"><span id="d-amount-l"></span><input id="d-amount" inputmode="decimal" autocomplete="off" /></label>
        </div>
        <button id="d-save" type="button" class="sre-btn"><span id="d-save-text"></span></button>
        <p class="status" id="d-status" role="status" aria-live="polite"></p>
      </section>

      <section id="money" hidden aria-labelledby="money-h">
        <h3 id="money-h"></h3>
        <div class="row-form">
          <label for="m-contract"><span id="m-contract-l"></span><select id="m-contract"></select></label>
          <label for="m-from"><span id="m-from-l"></span><input id="m-from" type="date" /></label>
          <label for="m-to"><span id="m-to-l"></span><input id="m-to" type="date" /></label>
          <label for="m-metered"><span id="m-metered-l"></span><input id="m-metered" inputmode="decimal" autocomplete="off" /></label>
          <label for="m-banked"><span id="m-banked-l"></span><input id="m-banked" inputmode="decimal" autocomplete="off" /></label>
        </div>
        <div class="actions">
          <button id="m-charge" type="button" class="quiet sre-btn sre-btn-quiet"><span id="m-charge-text"></span></button>
          <button id="m-settle" type="button" class="sre-btn"><span id="m-settle-text"></span></button>
        </div>
        <p class="status" id="m-status" role="status" aria-live="polite"></p>
        <div class="figs" id="m-figs"></div>
      </section>

      <!-- Round 4d (M27-FR-03): the invoice to the concessionaire for the period chosen above, made by one person and approved
           by another, and the settlement in the books (concession-invoices.js). -->
      <section id="invoices" hidden aria-labelledby="ci-h">
        <h3 id="ci-h"></h3>
        <p class="muted" id="ci-lead"></p>
        <p class="status" id="ci-gst"></p>
        <form id="ci-gst-form" class="row-form" hidden novalidate>
          <div id="ci-gst-fields" style="display: contents"></div>
          <button id="ci-save-gst" type="submit" class="quiet"><span id="ci-save-gst-text"></span></button>
        </form>
        <div class="actions">
          <button id="ci-preview" type="button" class="quiet"><span id="ci-preview-text"></span></button>
          <button id="ci-ask" type="button" hidden><span id="ci-ask-text"></span></button>
          <button id="ci-issue" type="button" class="quiet" hidden><span id="ci-issue-text"></span></button>
        </div>
        <p class="status" id="ci-status" role="status" aria-live="polite"></p>
        <div id="ci-figs"></div>
        <h4 id="ci-list-h"></h4>
        <div id="ci-list"></div>
      </section>

      <!-- W5 (M27-FR-02/03/04): the counter's sale lines with their commission, a docket line recorded at the desk, a
           supervisor's reversal or adjustment (a new line naming the old), marking a window's lines, the sales on a day a
           counter could not trade, and the store's own stock value without the concessions' (apps/web-erp/src/concession-tags-session.ts,
           window.concessionTags, drawn by concession-tags.js). Nothing is read on open. -->
      <section id="tags" hidden aria-labelledby="tg-h">
        <h3 id="tg-h"></h3>
        <p class="muted" id="tg-lead"></p>
        <div class="row-form">
          <label for="tg-contract"><span id="tg-contract-l"></span><input id="tg-contract" autocomplete="off" /></label>
          <label for="tg-from"><span id="tg-from-l"></span><input id="tg-from" type="date" /></label>
          <label for="tg-to"><span id="tg-to-l"></span><input id="tg-to" type="date" /></label>
        </div>
        <div class="actions">
          <button id="tg-show" type="button" class="quiet"><span id="tg-show-text"></span></button>
          <button id="tg-mark-charge" type="button" class="quiet" hidden><span id="tg-mark-charge-text"></span></button>
          <button id="tg-mark-settled" type="button" class="quiet" hidden><span id="tg-mark-settled-text"></span></button>
        </div>
        <p class="status" id="tg-status" role="status" aria-live="polite"></p>
        <div class="figs" id="tg-figs"></div>
        <ul class="rows" id="tg-rows"></ul>
        <details id="tg-record" hidden>
          <summary id="tg-record-h"></summary>
          <div class="row-form" id="tg-fields"></div>
          <button id="tg-record-go" type="button"><span id="tg-record-text"></span></button>
          <p class="status" id="tg-record-status" role="status" aria-live="polite"></p>
        </details>
        <h4 id="tg-breaches-h"></h4>
        <button id="tg-breaches" type="button" class="quiet"><span id="tg-breaches-text"></span></button>
        <ul class="rows" id="tg-breach-rows"></ul>
        <h4 id="tg-val-h"></h4>
        <p class="muted" id="tg-val-lead"></p>
        <div class="row-form">
          <label for="tg-branch"><span id="tg-branch-l"></span><input id="tg-branch" autocomplete="off" /></label>
        </div>
        <button id="tg-val" type="button" class="quiet"><span id="tg-val-text"></span></button>
        <p class="status" id="tg-val-status" role="status" aria-live="polite"></p>
        <div class="figs" id="tg-val-figs"></div>
        <ul class="rows" id="tg-val-rows"></ul>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./concessions.js" type="module"></script>
    <script src="./concession-invoices.js" type="module"></script>
    <script src="./concession-tags.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
