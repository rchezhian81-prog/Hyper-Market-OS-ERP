<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Stock counts</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Stock-count review — the blind-count variance triage view (M09-FR-04). Every rule lives in the tested
      session model (apps/web-erp/src/counts-session.ts), attached as window.countsSession and built on the
      shared packages/ui primitives + the tested packages/counts reconciliation. Read-only: the day's counts
      with the material variances (which needed a second person's approval) first, each with a status that is
      never a bare colour (an icon and a word ride with it), the direction (short/over/matched), the value at
      variance, and the counted vs system quantities. Nothing here reconciles a count — the expected quantity
      is computed by the system, never on this surface.
      OB-205: the same page, polished inside the approved look — a summary panel, the counts as one register with
      aligned, right-aligned quantities and money, status chips from the one icon set, and "Value not known" said.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      [hidden] { display:none !important; }

      /* ── OB-205 (19 Oct 2026): the office polish — the approved look, page-level only ─────────────────── */
      main { flex:1; padding: var(--space-5) var(--space-4) var(--space-10); display:grid; gap: var(--space-5); align-content:start; max-width: 1180px; width:100%; box-sizing:border-box; }
      .page-head h2 { margin:0 0 6px; font-size: var(--fs-2xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }
      .page-head p.lead { margin:0; max-width:72ch; color: var(--ink-2); font-size: var(--fs-base); }
      .toolbar { display:flex; justify-content:flex-end; margin-bottom: calc(var(--space-3) * -1); }
      .filter { min-height: var(--tap); padding:0 16px; border:1px solid var(--line); border-radius: var(--radius); background: var(--panel); color:var(--ink); font-size:15px; font-weight:600; box-shadow: var(--shadow-xs); display:inline-flex; align-items:center; gap:8px; }
      .filter:hover { background: var(--hover); border-color: var(--line-strong); }
      .filter[aria-pressed='true'] { background: var(--mint); border-color: var(--accent); color: var(--accent); }
      .filter .sre-icon { width:18px; height:18px; }

    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <h1 class="who" id="who">Stock counts <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div class="page-head">
        <h2 id="title">Stock counts</h2>
        <p class="lead" id="lead"></p>
      </div>

      <!-- U5 · G17: the day's figures as the chrome's summary cards -->
      <div id="stats" role="status" aria-live="polite"></div>

      <div class="toolbar"><button class="filter sre-btn sre-btn-quiet" id="filter" type="button" aria-pressed="false"></button></div>
      <!-- U5 · G17: the counts on the chrome's register — the state as the one chip, a value the box does not hold said as "Not known" -->
      <div id="register"></div>
      <div id="state" hidden></div>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./counts.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
