<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Stock counts</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Stock-count review — the blind-count variance triage view (M09-FR-04). Every rule lives in the tested
      session model (apps/web-erp/src/counts-session.ts), attached as window.countsSession and built on the
      shared packages/ui primitives + the tested packages/counts reconciliation. Read-only: the day's counts
      with the material variances (which needed a second person's approval) first, each with a status that is
      never a bare colour (an icon and a word ride with it), the direction (short/over/matched), the value at
      variance, and the counted vs system quantities. Nothing here reconciles a count — the expected quantity
      is computed by the system, never on this surface.
      OB-205: the same page, polished inside the approved look — a summary panel, the counts as one register with
      aligned, right-aligned quantities and money, status chips from the one icon set, and "Value not known" said.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      [hidden] { display:none !important; }

      /* ── OB-205 (19 Oct 2026): the office polish — the approved look, page-level only ─────────────────── */
      main { flex:1; padding: var(--space-5) var(--space-4) var(--space-10); display:grid; gap: var(--space-5); align-content:start; max-width: 1180px; width:100%; box-sizing:border-box; }
      .page-head h2 { margin:0 0 6px; font-size: var(--fs-2xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }
      .page-head p.lead { margin:0; max-width:72ch; color: var(--ink-2); font-size: var(--fs-base); }
      /* The summary panel: the figure large, its words under it; a day with material variances carries the red edge. */
      .stats { margin:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:1px; background: var(--line-soft); border:1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow:hidden; }
      .stats .stat { background: var(--panel); padding:14px 18px; }
      .stats .stat > span { display:grid; gap:2px; align-content:start; }
      .stats .n { order:-1; font-size: var(--fs-xl); font-weight:700; line-height: var(--leading-tight); font-variant-numeric: var(--numbers); color: var(--ink); }
      .stats .l { font-size:14px; color: var(--muted); font-weight:600; }
      .stats .stat[data-tone="error"] { box-shadow: inset 0 3px 0 var(--error); }
      .stats .clear { display:flex !important; align-items:center; gap:8px; color: var(--on-ok-surface); font-weight:600; font-size:15px; }
      .stats .clear .sre-icon { flex:none; width:20px; height:20px; color: var(--ok); }
      .toolbar { display:flex; justify-content:flex-end; margin-bottom: calc(var(--space-3) * -1); }
      .filter { min-height: var(--tap); padding:0 16px; border:1px solid var(--line); border-radius: var(--radius); background: var(--panel); color:var(--ink); font-size:15px; font-weight:600; box-shadow: var(--shadow-xs); display:inline-flex; align-items:center; gap:8px; }
      .filter:hover { background: var(--hover); border-color: var(--line-strong); }
      .filter[aria-pressed='true'] { background: var(--mint); border-color: var(--accent); color: var(--accent); }
      .filter .sre-icon { width:18px; height:18px; }

      /* The register: captions that stay on screen, hairline rows lit under the pointer, quantities and money right-aligned
         in tabular figures; the tone as a 3px edge AND a chip with its shape and word. Narrow, the captions go and rows stack. */
      .register { --cols: minmax(9rem, 1.4fr) minmax(9rem, 1fr) 7rem 7rem 7rem 9rem; background: var(--panel); border:1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); container-type:inline-size; }
      .reg-head { position:sticky; top:0; z-index:2; display:grid; grid-template-columns: var(--cols); column-gap: var(--space-4); padding:10px 16px 10px 19px; background: var(--panel-2); border-bottom:1px solid var(--line); border-radius: var(--radius-lg) var(--radius-lg) 0 0; color: var(--muted); font-size:14px; font-weight:600; letter-spacing:.02em; }
      .reg-head .r { text-align:right; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; }
      li.row { --tone: var(--idle); display:grid; grid-template-columns: var(--cols); column-gap: var(--space-4); row-gap: var(--space-2); align-items:baseline; padding:14px 16px 14px 19px; border-top:1px solid var(--line-soft); box-shadow: inset 3px 0 0 var(--tone); }
      li.row:first-child { border-top:0; }
      li.row:last-child { border-radius:0 0 var(--radius-lg) var(--radius-lg); }
      li.row:hover, li.row:focus-within { background: var(--hover); }
      li.row.tone-ok { --tone: var(--ok); } li.row.tone-degraded { --tone: var(--degraded); }
      li.row.tone-error { --tone: var(--error); } li.row.tone-idle { --tone: var(--idle); }
      .row .prod { font-weight:700; overflow-wrap:anywhere; }
      .row .status { justify-self:start; align-self:center; }
      .status .icon { display:inline-flex; width:16px; height:16px; align-items:center; justify-content:center; font-size:14px; }
      .status .icon .sre-icon { width:16px; height:16px; }
      .row .q { text-align:right; font-variant-numeric: var(--numbers); white-space:nowrap; }
      .row .q.var { font-weight:700; }
      .row .val { text-align:right; font-variant-numeric: var(--numbers); font-weight:700; white-space:nowrap; }
      .row .val.unknown { display:inline-flex; align-items:center; justify-content:flex-end; gap:6px; color: var(--degraded); font-weight:600; white-space:normal; }
      .row .val.unknown .sre-icon { flex:none; width:16px; height:16px; }
      .meta { grid-column: 2 / -1; color:var(--muted); font-size:14px; display:flex; gap:6px 14px; flex-wrap:wrap; align-items:center; }
      .meta b { font-size:14px; padding:2px 10px; border-radius: var(--radius-pill); background: var(--panel-2); color: var(--ink); font-weight:600; }
      .meta b.warn { background:var(--warn-surface); color:var(--on-warn-surface); }
      .meta b.muted { color:var(--ink-2); font-weight:500; }
      .sr-cap { position:absolute; width:1px; height:1px; overflow:hidden; clip-path: inset(50%); white-space:nowrap; }
      @container (max-width: 760px) {
        .reg-head { display:none; }
        li.row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .row .prod { grid-column: 1 / 3; } .row .val { grid-column: 3; grid-row: 1; }
        .row .status, .meta { grid-column: 1 / -1; }
        .row .q { text-align:left; }
        .row .q .sr-cap { position:static; width:auto; height:auto; clip-path:none; display:block; color: var(--muted); font-size:14px; font-weight:600; }
      }

      /* An empty, not-permitted or not-known list: a shape and words, never a blank box. */
      p.state { margin:0; display:flex; gap: var(--space-3); align-items:center; padding: var(--space-5); background: var(--panel); border:1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--ink-2); font-size:16px; }
      p.state .icon { display:inline-flex; flex:none; width:24px; height:24px; align-items:center; justify-content:center; font-size:20px; color: var(--idle); }
      p.state .icon .sre-icon { width:24px; height:24px; }
      p.state.tone-error { color: var(--danger-text); border-style:solid; border-color: var(--error-surface); background: var(--error-surface); }
      p.state.tone-error .icon { color: var(--danger-text); }
      p.state.tone-degraded { color: var(--on-warn-surface); border-style:solid; border-color: var(--warn-surface); background: var(--warn-surface); }
      p.state.tone-degraded .icon { color: var(--on-warn-surface); }
      p.state.tone-ok .icon { color: var(--ok); }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <h1 class="who" id="who">Stock counts <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div class="page-head">
        <h2 id="title">Stock counts</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="summary stats" role="status" aria-live="polite">
        <span class="stat" id="attention-stat"><span class="count attention" id="attention-count"></span></span>
        <span class="stat"><span class="total" id="total"></span></span>
      </div>

      <div class="toolbar"><button class="filter" id="filter" type="button" aria-pressed="false"></button></div>
      <div class="register" id="register">
        <!-- The captions are for the eye; each cell also carries its own word for a screen reader (and on a phone). -->
        <div class="reg-head" aria-hidden="true"><span id="col-prod"></span><span id="col-status"></span><span class="r" id="col-counted"></span><span class="r" id="col-system"></span><span class="r" id="col-variance"></span><span class="r" id="col-value"></span></div>
        <ul class="rows" id="rows" aria-label="Reconciled stock counts"></ul>
      </div>
      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./counts.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
