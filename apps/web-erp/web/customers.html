<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Customers</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Customers (R4 M16 · OB-74 · signed OB-227). A THIN CLIENT over head office's routes: every customer the shop knows
      from its banked bills with their segment (GET /v1/customer/overview — a customer without profiling consent is
      "not profiled", listed, never left out), the duplicate check over the records the desk compares (POST
      /v1/customer/duplicates — it suggests, it never merges), and the governed merge: proposed by one person, approved
      by ANOTHER, undone with a reason. Its session is the tested model in apps/web-erp/src/customers-session.ts.
      No prompt/confirm/alert; nothing on a timer; nothing written on open.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
      input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; padding: 0 16px; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      .panel { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); display: grid; gap: 2px; }
      .panel .k { color: var(--muted); font-size: 14px; } .panel .v { font-size: 22px; font-weight: 700; }
      .panel.attention { border-left: 6px solid var(--degraded); }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      li.row { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; border-left: 6px solid var(--idle); overflow-wrap: anywhere; }
      li.row.tone-degraded { border-left-color: var(--degraded); } li.row.tone-ok { border-left-color: var(--ok); }
      .row .facts { font-size: 14px; color: var(--muted); }
      .row form { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
      .status { font-size: 14px; min-height: 20px; margin: 0; } .status.good { color: var(--good); } .status.err { color: var(--danger-text); }
      .nobody { background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; margin: 0; }
      .muted { color: var(--muted); font-size: 14px; }
      table { width: 100%; border-collapse: collapse; }
      .table-wrap { overflow-x: auto; max-width: 100%; }
      td, th { text-align: left; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Customers</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section aria-labelledby="page-h">
        <h2 id="page-h">Customers</h2>
        <p class="lead" id="lead"></p>
        <button id="refresh" type="button">Show customers</button>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <!-- M16-FR-04: one customer's record — what they bought and their history with the service desk, complaints first. -->
      <section aria-labelledby="record-h">
        <h3 id="record-h">A customer's record</h3>
        <form id="record-form" class="row-form">
          <label for="record-ref"><span id="l-record-ref">Customer code</span><input id="record-ref" autocomplete="off" /></label>
          <button id="record-open" type="submit"><span id="record-open-text">Open the record</span></button>
        </form>
        <p class="status" id="record-status" role="status" aria-live="polite"></p>
        <div id="record" hidden>
          <p id="record-summary"></p>
          <p class="status" id="record-say"></p>
          <h4 id="complaints-h">Complaints</h4>
          <ul class="rows" id="record-complaints"></ul>
          <h4 id="othercases-h">Other questions and requests</h4>
          <ul class="rows" id="record-other"></ul>
        </div>
      </section>
      <section aria-labelledby="segments-h">
        <h3 id="segments-h">Customers and segments</h3>
        <div class="panels" id="counts"></div>
        <div class="table-wrap"><table aria-labelledby="segments-h"><tbody id="customer-rows"></tbody></table></div>
      </section>
      <section aria-labelledby="duplicates-h">
        <h3 id="duplicates-h">Records that may be the same person</h3>
        <form id="dup-form">
          <label for="candidates"><span id="l-candidates">Records to compare</span><textarea id="candidates" rows="4"></textarea></label>
          <button id="check" type="submit">Find possible duplicates</button>
        </form>
        <p class="status" id="dup-status" role="status" aria-live="polite"></p>
        <ul class="rows" id="matches"></ul>
      </section>
      <section aria-labelledby="pending-h">
        <h3 id="pending-h">Merges waiting for a second person</h3>
        <p class="status" id="merge-status" role="status" aria-live="polite"></p>
        <ul class="rows" id="pending"></ul>
        <h3 id="inforce-h">Merges in force</h3>
        <ul class="rows" id="inforce"></ul>
        <h3 id="reversed-h">Merges undone</h3>
        <ul class="rows" id="reversed"></ul>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./customers.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
