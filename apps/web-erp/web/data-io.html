<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Import &amp; export</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Data import & export console — the operator's screen (M30-FR-01/02/03, API-03, §28, P-06). Every rule
      lives in the tested session model (apps/web-erp/src/data-io-session.ts), attached as window.dataIoSession
      and built on the shared packages/ui primitives. EXPORT: pick a domain and take it out to an open CSV
      (audited; sensitive columns hidden unless allowed). IMPORT: pick a template, paste the file, CHECK it (a
      preview — errors by line), name the load, say why and ASK FOR APPROVAL (head office's maker-checker
      engine, ADR-0024 — the uploader's own request for this exact file). A DIFFERENT person approves it on their
      Approvals page, in their own session; then LOAD it, which names that approved request — never a typed name.
      Every write runs ONLY on an explicit click, never on load. The exportable domains, the log and the
      uploader's own requests are read live (GET /v1/export, /v1/exports, /v1/approvals/requests); offline the
      screen shows its sample stand-in.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      .sample[hidden],.stale[hidden],.nobody[hidden],[hidden] { display:none !important; }
      main { flex:1; padding:16px; display:grid; gap:20px; align-content:start; max-width:900px; width:100%; }
      section.panel { background:var(--panel); border-radius:14px; padding:16px; display:grid; gap:12px; }
      h2 { margin:0 0 4px; font-size:20px; } h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      p.lead { margin:0; color:var(--muted); font-size:15px; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--bg); border-radius:12px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-left:5px solid var(--line); }
      li.row .what { display:grid; gap:2px; } li.row .what small { color:var(--muted); font-size:13px; }
      .tag { background:var(--warn-surface); color:var(--on-warn-surface); border-radius:999px; padding:1px 8px; font-size:12px; margin-left:6px; }
      label { display:block; margin:8px 0 4px; font-size:14px; color:var(--muted); }
      select, input, textarea { width:100%; min-height:var(--tap); padding:8px 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
      textarea { min-height:120px; font-family:ui-monospace,Menlo,Consolas,monospace; }
      .row2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
      .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .chip { display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:14px; }
      .chip .icon { font-size:16px; }
      button.act { min-height:var(--tap); padding:0 16px; border:0; border-radius:10px; font-size:16px; font-weight:700; background:var(--info); color:var(--on-info); }
      button.act.primary { background:var(--good); color:var(--on-accent); }
      button.act.small { min-height: var(--tap); font-size:14px; background:var(--info); color:var(--on-info); }
      button.act:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .lang:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      .preview { background:var(--bg); border-radius:12px; padding:12px 14px; font-size:14px; display:grid; gap:6px; }
      .preview.ready { border-left:5px solid var(--ok); } .preview.notready { border-left:5px solid var(--error); }
      .preview .errline { color:var(--danger-text); font-size:13px; }
      p.result { margin:0; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.result .icon { font-size:18px; }
      p.result.tone-ok { border-left:6px solid var(--ok); } p.result.tone-degraded { border-left:6px solid var(--degraded); } p.result.tone-error { border-left:6px solid var(--error); }
      p.locked { margin:0; padding:14px; background:var(--bg); border-radius:12px; color:var(--muted); }
      .period { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px; margin-top:6px; }
      .period label { margin:0 0 2px; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <h1 class="who" id="who">Import &amp; export <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Import &amp; export</h2>
        <p class="lead" id="lead"></p>
      </div>

      <section class="panel" id="export-panel" aria-label="Take data out">
        <h2 id="export-heading"></h2>
        <p class="lead" id="export-lead"></p>
        <p class="locked" id="export-locked" hidden></p>
        <ul class="rows" id="export-domains" aria-label="Exportable data"></ul>
        <p class="result" id="export-result" hidden role="status" aria-live="polite"><span class="icon" id="export-result-icon" aria-hidden="true"></span><span id="export-result-text"></span></p>
        <h3 id="recent-heading"></h3>
        <ul class="rows" id="recent-exports" aria-label="Recent exports"></ul>
      </section>

      <section class="panel" id="import-panel" aria-label="Bring data in">
        <h2 id="import-heading"></h2>
        <p class="lead" id="import-lead"></p>
        <p class="locked" id="import-locked" hidden></p>
        <div id="import-form" hidden>
          <label for="import-template" id="template-label"></label>
          <select id="import-template"></select>
          <label for="import-file" id="file-label"></label>
          <textarea id="import-file" autocomplete="off" spellcheck="false"></textarea>
          <label for="import-total" id="total-label"></label>
          <input id="import-total" type="text" inputmode="numeric" autocomplete="off" />
          <button id="validate" class="act small" type="button"></button>
          <p class="result" id="validate-result" hidden role="status" aria-live="polite"><span class="icon" id="validate-result-icon" aria-hidden="true"></span><span id="validate-result-text"></span></p>
          <div class="preview" id="preview" hidden></div>
          <div class="row2">
            <div><label for="import-job" id="job-label"></label><input id="import-job" type="text" autocomplete="off" /></div>
            <div><label for="import-why" id="why-label"></label><input id="import-why" type="text" autocomplete="off" maxlength="300" /></div>
          </div>
          <div class="actions">
            <button id="ask" class="act small" type="button"></button>
            <button id="commit" class="act primary" type="button"></button>
          </div>
          <p class="result" id="ask-result" hidden role="status" aria-live="polite"><span class="icon" id="ask-result-icon" aria-hidden="true"></span><span id="ask-result-text"></span></p>
          <p class="result" id="commit-result" hidden role="status" aria-live="polite"><span class="icon" id="commit-result-icon" aria-hidden="true"></span><span id="commit-result-text"></span></p>
          <h3 id="requests-heading" hidden></h3>
          <ul class="rows" id="my-requests" aria-label="Your requests to load" hidden></ul>
        </div>
      </section>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./data-io.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
