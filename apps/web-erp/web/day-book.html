<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Day book</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Day book — the accountant's posting screen (M23-FR-01, API-09, P-03, P-08, §28). Every rule lives in the
      tested session model (apps/web-erp/src/day-book-session.ts), attached as window.dayBookSession and built on
      the shared packages/ui primitives over the tested buildDayBook / postDayBook engine. It shows one trading
      day as the cloud holds it — the journals posted for it (sales, returns, takings and refunds per tender; a day
      from a closed month posted late into the next open period is marked), the accounts they move, and the
      exceptions with their state (open = not in the accounts, an error; resolved = covered by a later posting).
      The one write is POSTING the day: a HUMAN act that runs ONLY on an explicit click, never on load, in the
      accountant's own name; on success the day is re-read (a GET) so what is shown is the cloud's. The cloud
      has no dry-run, so an unposted day reads as "not yet posted", never as figures that look booked. The day
      is read live (GET /v1/finance/day-book/:tradingDay); offline the screen shows its sample stand-in.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:960px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .picker { background:var(--panel); border-radius:12px; padding:14px; display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
      .picker label { font-size:14px; color:var(--muted); display:grid; gap:4px; }
      .picker input { min-height:var(--tap); padding:0 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
      button.quiet { min-height:var(--tap); padding:0 16px; border:0; border-radius:10px; font-size:15px; font-weight:700; background:var(--line); color:var(--ink); }
      button.act { min-height:var(--tap); padding:0 16px; border:0; border-radius:10px; font-size:16px; font-weight:700; background:var(--degraded); color:#451a03; }
      button:focus-visible, input:focus-visible, .lang:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
      .summary { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
      .summary .count { font-size:18px; font-weight:700; } .summary .count.attention { color:#fecaca; }
      .summary .fig { font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .value { font-weight:700; font-variant-numeric:tabular-nums; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
      .row .lines { font-size:13px; color:var(--muted); display:grid; gap:2px; font-variant-numeric:tabular-nums; }
      .row .lines span { display:flex; justify-content:space-between; gap:12px; }
      table.accounts { width:100%; border-collapse:collapse; background:var(--panel); border-radius:12px; overflow:hidden; font-variant-numeric:tabular-nums; }
      table.accounts th, table.accounts td { padding:8px 12px; text-align:right; border-bottom:1px solid var(--line); font-size:14px; }
      table.accounts th:first-child, table.accounts td:first-child { text-align:left; }
      table.accounts th { color:var(--muted); font-weight:600; }
      p.result { margin:0; padding:12px 14px; border-radius:12px; background:var(--panel); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.result .icon { font-size:18px; }
      p.result.tone-ok { border-left:6px solid var(--ok); } p.result.tone-degraded { border-left:6px solid var(--degraded); } p.result.tone-error { border-left:6px solid var(--error); } p.result.tone-idle { border-left:6px solid var(--idle); }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:#fecaca; }
      p.muted { margin:0; color:var(--muted); font-size:14px; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <span class="who" id="who">Day book <small id="whoami"></small></span>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Day book</h2>
        <p class="lead" id="lead"></p>
      </div>

      <section class="picker" aria-label="Choose a trading day">
        <label for="day"><span id="day-label"></span><input id="day" type="date" /></label>
        <button id="load" class="quiet" type="button"></button>
        <button id="post" class="act" type="button" hidden></button>
      </section>

      <div class="summary" role="status" aria-live="polite">
        <span class="count" id="posted-state"></span>
        <span class="fig" id="sales-total"></span>
        <span class="fig" id="returns-total"></span>
        <span class="fig" id="covered"></span>
        <span class="count attention" id="open-count"></span>
      </div>

      <p class="result" id="result" hidden role="status" aria-live="polite"><span class="icon" id="result-icon" aria-hidden="true"></span><span id="result-text"></span></p>

      <h3 id="journals-heading" hidden></h3>
      <ul class="rows" id="journals" aria-label="Journals posted for the day"></ul>

      <h3 id="accounts-heading" hidden></h3>
      <table class="accounts" id="accounts" aria-label="Accounts moved by the day" hidden>
        <thead><tr><th id="th-account"></th><th id="th-debit"></th><th id="th-credit"></th><th id="th-balance"></th></tr></thead>
        <tbody id="accounts-body"></tbody>
      </table>

      <h3 id="exceptions-heading" hidden></h3>
      <ul class="rows" id="exceptions" aria-label="Exceptions on the day"></ul>
      <p class="muted" id="no-exceptions" hidden></p>

      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./day-book.js" type="module"></script>
  </body>
</html>
