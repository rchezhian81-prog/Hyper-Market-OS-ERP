<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Document templates</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Document templates — the setup person's versioned wording screen (M01-FR-02, API-01, §28, P-08, OC-15).
      Every rule lives in the tested session model (apps/web-erp/src/document-templates-session.ts), attached as
      window.documentTemplatesSession and built on the shared packages/ui primitives over the tested @sre/org
      template engine. It shows the register as the cloud holds it (the version in force of every kind — a kind
      with nothing in force is a warning: documents print with defaults), one kind's versions with their state
      (draft = waiting for a second person; approved = ready to publish; in force; superseded = kept), and carries
      the three HUMAN writes: DRAFT the next version (content checked here with the same rules the cloud applies,
      so a wrong GSTIN never leaves the screen), APPROVE a draft (a SECOND person's act — withheld from the draft's
      own author, §28), PUBLISH an approved version (the previous one is superseded and kept). Each runs ONLY on an
      explicit click, in the caller's own name, with an idempotency key; on success the kind is re-read (a GET) so
      what is shown is the cloud's. Nothing is edited in place. The register is read live; offline the screen shows
      its sample stand-in and says so.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:960px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .picker { background:var(--panel); border-radius:12px; padding:14px; display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
      .picker label, .form label { font-size:14px; color:var(--muted); display:grid; gap:4px; }
      .picker select, .form select, .form input, .form textarea { min-height:var(--tap); padding:8px 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font-family:inherit; }
      .form textarea { min-height:96px; resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; }
      .form { background:var(--panel); border-radius:12px; padding:14px; display:grid; gap:10px; }
      .form .row { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); }
      .form .hint { font-size:13px; color:var(--muted); margin:0; }
      button.quiet { min-height:var(--tap); padding:0 16px; border:0; border-radius:10px; font-size:15px; font-weight:700; background:var(--line); color:var(--ink); }
      button.act { min-height:var(--tap); padding:0 16px; border:0; border-radius:10px; font-size:16px; font-weight:700; background:var(--degraded); color:var(--on-warn); }
      button.small { min-height: var(--tap); padding:0 14px; border:0; border-radius:10px; font-size:14px; font-weight:700; background:var(--line); color:var(--ink); }
      button.small.act { background:var(--degraded); color:var(--on-warn); }
      button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .lang:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .value { font-weight:700; font-variant-numeric:tabular-nums; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
      .row pre { margin:0; padding:8px 10px; background:var(--bg); border-radius:8px; font:13px/1.4 ui-monospace,Menlo,Consolas,monospace; color:var(--ink); white-space:pre-wrap; overflow-x:auto; }
      .row .acts { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .row .why { font-size:13px; color:var(--on-warn-surface); }
      p.result { margin:0; padding:12px 14px; border-radius:12px; background:var(--panel); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.result .icon { font-size:18px; }
      p.result.tone-ok { border-left:6px solid var(--ok); } p.result.tone-degraded { border-left:6px solid var(--degraded); } p.result.tone-error { border-left:6px solid var(--error); } p.result.tone-idle { border-left:6px solid var(--idle); }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:var(--danger-text); }
      p.muted { margin:0; color:var(--muted); font-size:14px; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <h1 class="who" id="who">Document templates <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Document templates</h2>
        <p class="lead" id="lead"></p>
      </div>

      <h3 id="register-heading"></h3>
      <ul class="rows" id="kinds" aria-label="Document kinds and the version in force"></ul>

      <section class="picker" aria-label="Choose a document kind">
        <label for="kind"><span id="kind-label"></span><select id="kind"></select></label>
        <button id="load" class="quiet" type="button"></button>
      </section>

      <p class="result" id="result" hidden role="status" aria-live="polite"><span class="icon" id="result-icon" aria-hidden="true"></span><span id="result-text"></span></p>

      <h3 id="versions-heading" hidden></h3>
      <ul class="rows" id="versions" aria-label="Versions of the chosen kind"></ul>
      <p class="muted" id="no-versions" hidden></p>

      <h3 id="draft-heading" hidden></h3>
      <form class="form" id="draft-form" hidden aria-label="Draft the next version">
        <label for="header"><span id="header-label"></span><textarea id="header" rows="4"></textarea></label>
        <label for="footer"><span id="footer-label"></span><textarea id="footer" rows="3"></textarea></label>
        <label for="terms"><span id="terms-label"></span><textarea id="terms" rows="3"></textarea></label>
        <div class="row">
          <label for="language"><span id="language-label"></span><select id="language"></select></label>
          <label for="paper"><span id="paper-label"></span><select id="paper"><option value="">—</option><option value="thermal-58">thermal-58</option><option value="thermal-80">thermal-80</option><option value="thermal-112">thermal-112</option></select></label>
          <label for="note"><span id="note-label"></span><input id="note" type="text" maxlength="200" /></label>
        </div>
        <p class="hint" id="limits"></p>
        <div><button id="draft" class="act" type="button"></button></div>
      </form>

      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./document-templates.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
