<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE EPR registers</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      EPR registers (R4 · B20 · B21 · B22 · OB-212). One page for the shop's extended-producer-responsibility records:
      the plastic put on the market by the shop's own brand for a financial year, per packaging category, to the gram,
      with the sortable file for the CPCB portal (GET /v1/compliance/epr/plastic/:fy) — nothing is filed automatically;
      the registration number, exemption and brand-owner answers, each "not confirmed" until the CA or consultant
      confirms it (GET /v1/compliance/epr/settings); and the take-back register (GET /v1/compliance/epr/take-back): what
      customers brought back for disposal, held in the take-back location and never saleable, the handovers to
      registered recyclers, and every exception. A take-back is recorded here (POST …/take-backs/:id) and take-back stock
      is handed over here (POST …/take-back-stock/:id/out) — head office refuses a recycler with no registration number.
      The page decides nothing itself: a refusal is shown as head office said it. No prompt/confirm/alert; no timer.
      W5 (OB-212): the records a person keeps (epr-records.js over apps/web-erp/src/epr-records-session.ts) — confirm an answer
      with who confirmed it (POST …/epr/settings/:key), own-brand packaging and its register (POST/GET …/epr/own-brand),
      recyclers (POST …/epr/recyclers/:id), the shop's own e-waste handover (POST …/epr/handovers/:id), bin counts (POST
      …/epr/take-back-stock/counts/:id) and a disposed asset that was not e-waste (POST …/epr/assets/:id/not-e-waste).
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-faces.js" defer></script>
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:960px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; }
      form.ask { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); align-items:end; }
      label { display:grid; gap:2px; font-size:14px; color:var(--muted); }
      input, select { min-height:var(--tap); font:inherit; padding:0 10px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--ink); min-width:0; }
      button.act { min-height:var(--tap); font:inherit; font-weight:600; border:0; border-radius:10px;   padding:0 16px; cursor:pointer; }
      button.act.quiet { background:var(--line); color:var(--ink); }
      button.act:disabled { background:var(--line); color:var(--muted); cursor:default; }
      button.act:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); overflow-wrap:anywhere; }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); } li.row.tone-error { border-left-color:var(--error); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .state { font-weight:600; font-size:14px; }
      .row .facts { font-size:14px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
      p.result { margin:0; padding:12px 16px; border-radius:12px; background:var(--panel); font-weight:600; }
      p.result.tone-error { background:var(--danger-surface); color:var(--danger-text); } p.result.tone-ok { background:var(--ok-surface); color:var(--on-ok-surface); }
      p.note { margin:0; color:var(--muted); font-size:14px; }
      [hidden] { display:none !important; }
          .sre-why { color: var(--muted); font-size: var(--fs-sm); margin-left: 8px; } .sre-why[hidden] { display: none; }
          /* U1: a hidden button stays hidden although it wears the foundation's button class (the foundation's .sre-btn display rule follows its [hidden] rule). */
      .sre-btn[hidden] { display: none; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <header>
      <h1 class="who" id="who">EPR registers <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <main>
      <div>
        <h2 id="title">EPR registers</h2>
        <p class="lead" id="lead"></p>
      </div>
      <p class="result" id="result" role="status" aria-live="polite" hidden></p>
      <div id="state" hidden></div>

      <h3 id="settings-heading"></h3>
      <ul class="rows" id="settings" aria-label="EPR settings"></ul>

      <h3 id="plastic-heading"></h3>
      <form class="ask" id="ask">
        <label for="fy"><span id="l-fy">Financial year</span><input id="fy" type="text" inputmode="numeric" placeholder="2026-27" pattern="\d{4}-\d{2}" required /></label>
        <button class="act sre-btn" id="show" type="submit">Show</button>
        <button class="act quiet sre-btn sre-btn-quiet" id="csv" type="button" disabled>Download file for the CPCB portal</button>
      </form>
      <p class="note" id="filing"></p>
      <div class="panels" id="panels"></div>
      <ul class="rows" id="plastic-exceptions" aria-label="Plastic register exceptions"></ul>

      <h3 id="takeback-heading"></h3>
      <p class="note" id="takeback-words"></p>
      <ul class="rows" id="stock" aria-label="Take-back stock"></ul>
      <ul class="rows" id="takeback-exceptions" aria-label="Take-back exceptions"></ul>

      <h3 id="record-heading"></h3>
      <form class="ask" id="record">
        <label for="tb-kind"><span id="l-kind">Kind</span><select id="tb-kind"><option value="battery"></option><option value="e_waste"></option></select></label>
        <label for="tb-description"><span id="l-description">What was brought back</span><input id="tb-description" type="text" autocomplete="off" /></label>
        <label for="tb-weight"><span id="l-weight">Weight (grams)</span><input id="tb-weight" type="number" min="1" step="1" inputmode="numeric" /></label>
        <label for="tb-type"><span id="l-type">Battery type</span><input id="tb-type" type="text" autocomplete="off" placeholder="lead-acid" /></label>
        <button class="act sre-btn sre-btn-primary" id="record-go" type="submit">Record take-back</button>
      </form>

      <h3 id="handover-heading"></h3>
      <form class="ask" id="handover">
        <label for="ho-kind"><span id="l-ho-kind">Kind</span><select id="ho-kind"><option value="battery"></option><option value="e_waste"></option></select></label>
        <label for="ho-recycler"><span id="l-recycler">Recycler</span><select id="ho-recycler"></select></label>
        <label for="ho-weight"><span id="l-ho-weight">Weight (grams)</span><input id="ho-weight" type="number" min="1" step="1" inputmode="numeric" /></label>
        <label for="ho-type"><span id="l-ho-type">Battery type</span><input id="ho-type" type="text" autocomplete="off" placeholder="lead-acid" /></label>
        <label for="ho-note"><span id="l-note">Handover note number</span><input id="ho-note" type="text" autocomplete="off" /></label>
        <button class="act sre-btn" id="handover-go" type="submit">Hand over</button>
      </form>

      <!-- W5 (OB-212): the records a person keeps — answers confirmed, own-brand packaging, recyclers, the shop's own e-waste,
           bin counts and assets that were not e-waste. Laid out by epr-records.js over window.eprRecords. -->
      <p class="result" id="rec-result" role="status" aria-live="polite" hidden></p>
      <p class="note" id="rec-state" hidden></p>
      <div id="records" hidden>
        <h3 data-w="confirmH"></h3>
        <p class="note" data-w="confirmLead"></p>
        <p class="note" id="confirm-none" data-w="cannotConfirm" hidden></p>
        <form class="ask" id="confirm" hidden>
          <label for="cf-key"><span data-w="setting"></span><select id="cf-key"></select></label>
          <label for="cf-value"><span data-w="value"></span><input id="cf-value" type="text" autocomplete="off" /></label>
          <label for="cf-by"><span data-w="confirmation"></span><input id="cf-by" type="text" autocomplete="off" /></label>
          <button class="act" id="cf-go" type="submit" data-w="confirmGo"></button>
        </form>

        <h3 data-w="ownBrandH"></h3>
        <p class="note" data-w="ownBrandLead"></p>
        <form class="ask record-form" id="declare">
          <label for="ob-product"><span data-w="product"></span><input id="ob-product" type="text" autocomplete="off" /></label>
          <label for="ob-own"><span data-w="isOwnBrand"></span><select id="ob-own"><option value="yes" data-w="yes"></option><option value="no" data-w="no"></option></select></label>
          <label for="ob-cat-1"><span data-w="category"></span><select id="ob-cat-1" class="ob-cat"></select></label>
          <label for="ob-g-1"><span data-w="gramsPerUnit"></span><input id="ob-g-1" type="text" inputmode="decimal" autocomplete="off" /></label>
          <label for="ob-d-1"><span data-w="part"></span><input id="ob-d-1" type="text" autocomplete="off" /></label>
          <label for="ob-cat-2"><span data-w="category"></span><select id="ob-cat-2" class="ob-cat"></select></label>
          <label for="ob-g-2"><span data-w="gramsPerUnit"></span><input id="ob-g-2" type="text" inputmode="decimal" autocomplete="off" /></label>
          <label for="ob-d-2"><span data-w="part"></span><input id="ob-d-2" type="text" autocomplete="off" /></label>
          <button class="act" id="ob-go" type="submit" data-w="declareGo"></button>
        </form>
        <p class="note" data-w="register"></p>
        <ul class="rows" id="own-brand" aria-label="Own-brand register"></ul>

        <h3 data-w="recyclerH"></h3>
        <p class="note" data-w="recyclerLead"></p>
        <form class="ask record-form" id="recycler">
          <label for="rc-which"><span data-w="recycler"></span><select id="rc-which"></select></label>
          <label for="rc-name"><span data-w="recyclerName"></span><input id="rc-name" type="text" autocomplete="off" /></label>
          <label for="rc-number"><span data-w="registrationNumber"></span><input id="rc-number" type="text" autocomplete="off" /></label>
          <button class="act" id="rc-go" type="submit" data-w="recyclerGo"></button>
        </form>

        <h3 data-w="shopH"></h3>
        <p class="note" data-w="shopLead"></p>
        <form class="ask record-form" id="shop">
          <label for="sh-kind"><span data-w="kind"></span><select id="sh-kind" class="tb-kinds"></select></label>
          <label for="sh-recycler"><span data-w="recycler"></span><select id="sh-recycler"></select></label>
          <label for="sh-what"><span data-w="what"></span><input id="sh-what" type="text" autocomplete="off" /></label>
          <label for="sh-weight"><span data-w="weight"></span><input id="sh-weight" type="number" min="1" step="1" inputmode="numeric" /></label>
          <label for="sh-type"><span data-w="batteryType"></span><input id="sh-type" type="text" autocomplete="off" placeholder="lead-acid" /></label>
          <label for="sh-asset"><span data-w="asset"></span><select id="sh-asset"></select></label>
          <label for="sh-note"><span data-w="note"></span><input id="sh-note" type="text" autocomplete="off" /></label>
          <button class="act" id="sh-go" type="submit" data-w="shopGo"></button>
        </form>

        <h3 data-w="countH"></h3>
        <p class="note" data-w="countLead"></p>
        <form class="ask record-form" id="count">
          <label for="ct-kind"><span data-w="kind"></span><select id="ct-kind" class="tb-kinds"></select></label>
          <label for="ct-type"><span data-w="batteryType"></span><input id="ct-type" type="text" autocomplete="off" placeholder="lead-acid" /></label>
          <label for="ct-grams"><span data-w="counted"></span><input id="ct-grams" type="number" min="0" step="1" inputmode="numeric" /></label>
          <button class="act" id="ct-go" type="submit" data-w="countGo"></button>
        </form>

        <h3 data-w="notEWasteH"></h3>
        <p class="note" data-w="notEWasteLead"></p>
        <p class="note" id="ne-none" data-w="noAssets" hidden></p>
        <form class="ask record-form" id="not-e-waste">
          <label for="ne-asset"><span data-w="asset"></span><select id="ne-asset"></select></label>
          <label for="ne-why"><span data-w="why"></span><input id="ne-why" type="text" autocomplete="off" /></label>
          <button class="act" id="ne-go" type="submit" data-w="notEWasteGo"></button>
        </form>
      </div>
    </main>
    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./epr.js" type="module"></script>
    <script src="./epr-records.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
