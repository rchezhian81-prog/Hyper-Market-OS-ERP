<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE EPR registers</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      EPR registers (R4 · B20 · B21 · B22 · OB-212). One page for the shop's extended-producer-responsibility records:
      the plastic put on the market by the shop's own brand for a financial year, per packaging category, to the gram,
      with the sortable file for the CPCB portal (GET /v1/compliance/epr/plastic/:fy) — nothing is filed automatically;
      the registration number, exemption and brand-owner answers, each "not confirmed" until the CA or consultant
      confirms it (GET /v1/compliance/epr/settings); and the take-back register (GET /v1/compliance/epr/take-back): what
      customers brought back for disposal, held in the take-back location and never saleable, the handovers to
      registered recyclers, and every exception. A take-back is recorded here (POST …/take-backs/:id) and take-back stock
      is handed over here (POST …/take-back-stock/:id/out) — head office refuses a recycler with no registration number.
      The page decides nothing itself: a refusal is shown as head office said it. No prompt/confirm/alert; no timer.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:960px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; }
      form.ask { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); align-items:end; }
      label { display:grid; gap:2px; font-size:14px; color:var(--muted); }
      input, select { min-height:var(--tap); font:inherit; padding:0 10px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--ink); min-width:0; }
      button.act { min-height:var(--tap); font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:var(--on-accent); padding:0 16px; cursor:pointer; }
      button.act.quiet { background:var(--line); color:var(--ink); }
      button.act:disabled { background:var(--line); color:var(--muted); cursor:default; }
      button.act:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      .panels { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
      .panel { border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--panel); display:grid; gap:2px; }
      .panel .k { color:var(--muted); font-size:14px; } .panel .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); overflow-wrap:anywhere; }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); } li.row.tone-error { border-left-color:var(--error); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .state { font-weight:600; font-size:14px; }
      .row .facts { font-size:14px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
      p.result { margin:0; padding:12px 16px; border-radius:12px; background:var(--panel); font-weight:600; }
      p.result.tone-error { background:var(--danger-surface); color:var(--danger-text); } p.result.tone-ok { background:var(--ok-surface); color:var(--on-ok-surface); }
      p.state-line { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; }
      p.note { margin:0; color:var(--muted); font-size:14px; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <header>
      <h1 class="who" id="who">EPR registers <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <main>
      <div>
        <h2 id="title">EPR registers</h2>
        <p class="lead" id="lead"></p>
      </div>
      <p class="result" id="result" role="status" aria-live="polite" hidden></p>
      <p class="state-line" id="state" hidden></p>

      <h3 id="settings-heading"></h3>
      <ul class="rows" id="settings" aria-label="EPR settings"></ul>

      <h3 id="plastic-heading"></h3>
      <form class="ask" id="ask">
        <label for="fy"><span id="l-fy">Financial year</span><input id="fy" type="text" inputmode="numeric" placeholder="2026-27" pattern="\d{4}-\d{2}" required /></label>
        <button class="act" id="show" type="submit">Show</button>
        <button class="act quiet" id="csv" type="button" disabled>Download file for the CPCB portal</button>
      </form>
      <p class="note" id="filing"></p>
      <div class="panels" id="panels"></div>
      <ul class="rows" id="plastic-exceptions" aria-label="Plastic register exceptions"></ul>

      <h3 id="takeback-heading"></h3>
      <p class="note" id="takeback-words"></p>
      <ul class="rows" id="stock" aria-label="Take-back stock"></ul>
      <ul class="rows" id="takeback-exceptions" aria-label="Take-back exceptions"></ul>

      <h3 id="record-heading"></h3>
      <form class="ask" id="record">
        <label for="tb-kind"><span id="l-kind">Kind</span><select id="tb-kind"><option value="battery"></option><option value="e_waste"></option></select></label>
        <label for="tb-description"><span id="l-description">What was brought back</span><input id="tb-description" type="text" autocomplete="off" /></label>
        <label for="tb-weight"><span id="l-weight">Weight (grams)</span><input id="tb-weight" type="number" min="1" step="1" inputmode="numeric" /></label>
        <label for="tb-type"><span id="l-type">Battery type</span><input id="tb-type" type="text" autocomplete="off" placeholder="lead-acid" /></label>
        <button class="act" id="record-go" type="submit">Record take-back</button>
      </form>

      <h3 id="handover-heading"></h3>
      <form class="ask" id="handover">
        <label for="ho-kind"><span id="l-ho-kind">Kind</span><select id="ho-kind"><option value="battery"></option><option value="e_waste"></option></select></label>
        <label for="ho-recycler"><span id="l-recycler">Recycler</span><select id="ho-recycler"></select></label>
        <label for="ho-weight"><span id="l-ho-weight">Weight (grams)</span><input id="ho-weight" type="number" min="1" step="1" inputmode="numeric" /></label>
        <label for="ho-type"><span id="l-ho-type">Battery type</span><input id="ho-type" type="text" autocomplete="off" placeholder="lead-acid" /></label>
        <label for="ho-note"><span id="l-note">Handover note number</span><input id="ho-note" type="text" autocomplete="off" /></label>
        <button class="act" id="handover-go" type="submit">Hand over</button>
      </form>
    </main>
    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./epr.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
