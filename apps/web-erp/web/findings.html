<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Bill findings and attendance flags</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Bill findings and attendance flags (OB-609 · P-03 · P-08 · M29-FR-03 · M25-FR-01 · M05-FR-02). A THIN CLIENT over two
      head-office routes no screen reached before: every open critical and material finding head office raised on a till bill
      (GET /v1/sales/exceptions), and the attendance marks of one shop day that do not pair up (GET
      /v1/hr/workforce/attendance-marks?date=), judged by head office when asked. A read only: nothing is written, nothing is
      decided here. Its session is apps/web-erp/src/findings-session.ts. No prompt/confirm/alert; nothing on a timer.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-faces.js" defer></script>
    <script src="./sre-icons.js" defer></script>
    <style>
      /* U5 (UI/UX gap audit, lane 3): the page stands on the shared office parts — the register, the summary cards, the
         state and the chip come from the chrome and the foundation; the page keeps only its own layout. */
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      section.group { background: var(--bg); padding: 12px; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; } h4 { margin: 0; font-size: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .row-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      .row-form > label { flex: 0 1 220px; }
      .counts { font-variant-numeric: tabular-nums; font-weight: 700; margin: 0; }
      .meta { font-size: 14px; color: var(--muted); margin: 0; }
      .status { font-size: 14px; min-height: 20px; margin: 0; }
      .groups { display: grid; gap: 12px; }
      [hidden] { display: none !important; }
      .sre-btn[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Bill findings and attendance flags</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section id="page-intro" aria-labelledby="page-h">
        <h2 id="page-h">Bill findings and attendance flags</h2>
        <p class="lead" id="lead"></p>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <section id="sales" hidden aria-labelledby="sales-h">
        <h3 id="sales-h"></h3>
        <p class="meta" id="sales-lead"></p>
        <button id="s-reload" type="button" class="quiet sre-btn sre-btn-quiet"><span id="s-reload-text"></span></button>
        <!-- UI-3: what this list covers and when head office answered; its counts as the shared cards (window.sreOffice). -->
        <p class="meta" id="s-covers"></p>
        <div id="s-cards"></div>
        <p class="counts" id="s-counts"></p>
        <p class="status" id="s-status" role="status" aria-live="polite"></p>
        <!-- U5: the findings counted by KIND (one card each), then grouped — each kind its own register with search and paging. -->
        <h4 id="s-kinds-h"></h4>
        <div id="s-kinds"></div>
        <p class="meta" id="s-note"></p>
        <div class="groups" id="s-groups"></div>
      </section>
      <section id="attendance" hidden aria-labelledby="att-h">
        <h3 id="att-h"></h3>
        <p class="meta" id="att-lead"></p>
        <form class="row-form" id="a-ask">
          <label for="a-day"><span id="a-day-l"></span><input id="a-day" type="date" /></label>
          <button id="a-show" type="submit" class="sre-btn sre-btn-primary"><span id="a-show-text"></span></button>
        </form>
        <!-- UI-3: what this list covers and when head office answered; its counts as the shared cards (window.sreOffice). -->
        <p class="meta" id="a-covers"></p>
        <div id="a-cards"></div>
        <p class="counts" id="a-counts"></p>
        <p class="status" id="a-status" role="status" aria-live="polite"></p>
        <div id="a-table"></div>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./findings.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
