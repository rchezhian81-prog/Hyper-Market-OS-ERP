<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Devices</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Device fleet manager — M33-FR-02/04 · A-10. Every rule lives in the tested session model
      (apps/web-erp/src/fleet-session.ts), attached as window.fleetSession and built on the shared
      packages/ui + packages/a11y primitives. Read-only in this increment: the shop's registered tills,
      scanners, scales and kiosks with their health — the ones that need a look (cannot trade, then
      must-update, then GONE-QUIET) first, each with a status that is never a bare colour (an icon and a
      word ride with it). Registering / blocking / retiring a device is the audited write path, wired next.
    -->
    <style>
      :root { --bg:#0f172a; --panel:#1e293b; --ink:#f8fafc; --muted:#94a3b8; --ok:#22c55e; --degraded:#f59e0b; --error:#ef4444; --idle:#64748b; --info:#38bdf8; --line:#334155; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100dvh; display:flex; flex-direction:column; }
      header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:var(--panel); flex-wrap:wrap; }
      .who { font-weight:600; } .who small { display:block; color:var(--muted); font-weight:400; font-size:14px; }
      .lang { background:var(--line); color:var(--ink); min-height:40px; padding:0 14px; font-size:15px; border:0; border-radius:10px; }
      .sample,.stale,.nobody,.manage { margin:0; padding:10px 16px; font-size:15px; font-weight:600; }
      .sample { background:var(--degraded); color:#451a03; } .stale { background:#1e3a5f; color:#dbeafe; border-bottom:2px solid var(--info); font-weight:400; }
      .nobody { background:#3f2d12; color:#fde68a; border-bottom:2px solid var(--degraded); }
      .manage { background:#0b1220; color:var(--muted); font-weight:500; border-bottom:1px solid var(--line); }
      .sample[hidden],.stale[hidden],.nobody[hidden],.manage[hidden] { display:none; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:900px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      .tiles { display:flex; gap:12px; flex-wrap:wrap; }
      .tile { background:var(--panel); border-radius:12px; padding:10px 14px; min-width:110px; border-left:6px solid var(--idle); }
      .tile b { display:block; font-size:22px; font-variant-numeric:tabular-nums; } .tile span { color:var(--muted); font-size:13px; }
      .tile.attention { border-left-color:var(--degraded); } .tile.bad { border-left-color:var(--error); } .tile.good { border-left-color:var(--ok); }
      .summary { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
      .summary .count { font-size:18px; font-weight:700; } .summary .count.attention { color:var(--degraded); }
      .filter { min-height:40px; padding:0 14px; border:0; border-radius:10px; background:var(--line); color:var(--ink); font-size:15px; }
      .filter[aria-pressed='true'] { background:var(--ink); color:#0f172a; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .name { font-weight:600; } .row .kind { color:var(--muted); font-size:14px; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .meta { color:var(--muted); font-size:14px; display:flex; gap:14px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:#fecaca; }
      .pending { background:#1e3a5f; color:#dbeafe; border-bottom:2px solid var(--info); }
      .pending[hidden] { display:none; }
      .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:2px; }
      .act { min-height:40px; padding:0 16px; border:0; border-radius:10px; background:var(--line); color:var(--ink); font-size:15px; font-weight:600; }
      .act:disabled { opacity:.5; }
      .act-block { background:#7f1d1d; color:#fee2e2; } .act-retire { background:#3f2d12; color:#fde68a; } .act-reinstate { background:#14532d; color:#dcfce7; }
      .act-note { color:var(--muted); font-size:13px; }
      .sheet { position:fixed; inset:0; background:rgba(2,6,23,.72); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
      .sheet[hidden] { display:none; }
      .sheet .card { background:var(--panel); border-radius:14px; padding:18px; width:100%; max-width:440px; display:grid; gap:12px; }
      .sheet h3 { margin:0; font-size:18px; } .sheet p { margin:0; color:var(--muted); font-size:14px; }
      .sheet input { min-height:44px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; }
      .sheet .msg { color:#fecaca; min-height:1.2em; }
      .sheet .row2 { display:flex; gap:10px; justify-content:flex-end; }
      .sheet button { min-height:44px; padding:0 18px; border:0; border-radius:10px; font-size:15px; font-weight:600; }
      .sheet .primary { background:var(--info); color:#04283a; } .sheet .ghost { background:var(--line); color:var(--ink); }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>
    <p class="manage" id="manage" hidden></p>
    <p class="manage pending" id="pending" role="status" aria-live="polite" hidden></p>

    <header>
      <span class="who" id="who">Devices <small id="whoami"></small></span>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Devices</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="tiles" id="tiles" role="group" aria-label="Fleet at a glance"></div>

      <div class="summary" role="status" aria-live="polite">
        <span class="count attention" id="attention-count"></span>
        <button class="filter" id="filter" type="button" aria-pressed="false"></button>
      </div>

      <ul class="rows" id="rows" aria-label="Registered devices"></ul>
      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>
    </main>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="card">
        <h3 id="sheet-title"></h3>
        <p id="sheet-prompt"></p>
        <input id="reason" type="text" autocomplete="off" aria-label="Reason" />
        <p class="msg" id="sheet-msg" role="alert"></p>
        <div class="row2">
          <button class="ghost" id="sheet-cancel" type="button"></button>
          <button class="primary" id="sheet-confirm" type="button"></button>
        </div>
      </div>
    </div>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./fleet.js" type="module"></script>
  </body>
</html>
