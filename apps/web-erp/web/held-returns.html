<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Returned goods to decide</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Returned goods to decide (WF-11, M13-FR-02, PF-14, M28-FR-01, P-08). Every returned unit that could not go back
      on the shelf (damaged, quarantined, scrap) is held where it came back, with its batch and the return it came
      from. A person decides each one here: back on sale (a quality release), write off (valued at head office's own
      cost; a big loss needs a photo or witness and a second person's approval), back to the supplier, or out for
      repair. The list is read live (GET /v1/returns/held-stock/worklist) and each decision is head office's to accept
      (POST /v1/returns/held-stock/:heldId/decisions/:decisionId) - the page shows what the server answered, never its
      own guess. Nothing is deleted; a decided unit stays on the list with who decided it. No prompt/confirm/alert.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:900px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .summary { font-size:18px; font-weight:700; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:8px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .state { font-weight:600; font-size:14px; display:inline-flex; gap:6px; align-items:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
      .row form { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); align-items:end; }
      .row label { display:grid; gap:2px; font-size:13px; color:var(--muted); }
      .row select, .row input { min-height:var(--tap); font:inherit; padding:0 10px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--ink); }
      .row button.act { min-height:var(--tap); font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:var(--on-accent); padding:0 16px; cursor:pointer; }
      .row button.act:focus-visible, .row select:focus-visible, .row input:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      p.result { margin:0; padding:12px 16px; border-radius:12px; background:var(--panel); font-weight:600; }
      p.result.tone-error { background:var(--danger-surface); color:var(--danger-text); } p.result.tone-ok { background:var(--ok-surface); color:var(--on-ok-surface); }
      p.state-line { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <header>
      <h1 class="who" id="who">Returned goods to decide <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <main>
      <div>
        <h2 id="title">Returned goods to decide</h2>
        <p class="lead" id="lead"></p>
      </div>
      <div class="summary" id="summary" role="status" aria-live="polite"></div>
      <p class="result" id="result" role="status" aria-live="polite" hidden></p>
      <p class="state-line" id="state" hidden></p>
      <h3 id="open-heading"></h3>
      <ul class="rows" id="rows" aria-label="Returned goods waiting for a decision"></ul>
      <h3 id="done-heading"></h3>
      <ul class="rows" id="done-rows" aria-label="Returned goods already decided"></ul>
    </main>
    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./held-returns.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
