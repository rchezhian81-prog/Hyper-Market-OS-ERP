<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Help and procedures</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Help and procedures (M25-FR-04 · D11-FR-06 · OB-320). The role help centre: the procedures for the signed-in
      person's roles in English and Tamil, acknowledged in their own name. Served by the store computer it works with the
      line down (the library as the box last heard it; an acknowledgement saved on this screen and carried by the box).
      Managers publish the shop's own sheets and write procedures; the owner sets the emergency contacts; drills are
      recorded. Its session is apps/web-erp/src/help-session.ts.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
      input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
      button.quiet { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
      button:disabled { opacity: .6; cursor: default; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .row-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      .row-form > label { flex: 1 1 200px; }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      ul.rows li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
      .meta { font-size: 13px; color: var(--muted); }
      .verdict { font-weight: 700; font-size: 17px; margin: 0; }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; font-size: 15px; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .role-block { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; margin-bottom: 8px; }
      .role-block label { display: flex; gap: 8px; align-items: center; font-weight: 400; min-height: var(--tap); }
      .role-block input[type=checkbox] { min-height: 24px; width: 24px; }
      .sop { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
      .sop[data-category=emergency] { border-color: var(--danger-text); }
      .sop .words { white-space: pre-wrap; margin: 0; }
      textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: 96px; box-sizing: border-box; width: 100%; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Help and procedures</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section aria-labelledby="page-h">
        <h2 id="page-h">Help and procedures</h2>
        <p class="lead" id="lead"></p>
        <p class="meta" id="as-at"></p>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <section id="mine" hidden aria-labelledby="mine-h">
        <h3 id="mine-h"></h3>
        <p class="meta" id="outstanding"></p>
        <div class="rows" id="sops"></div>
        <p class="status" id="ack-status" role="status" aria-live="polite"></p>
      </section>
      <section id="contacts" hidden aria-labelledby="contacts-h">
        <h3 id="contacts-h"></h3>
        <ul class="rows" id="contact-rows"></ul>
      </section>
      <section id="manage" hidden aria-labelledby="manage-h">
        <h3 id="manage-h"></h3>
        <h3 id="sheets-h"></h3>
        <ul class="rows" id="sheet-rows"></ul>
        <p class="status" id="sheet-status" role="status" aria-live="polite"></p>
        <h3 id="write-h"></h3>
        <div class="row-form">
          <label for="w-id"><span id="w-id-l"></span><input id="w-id" autocomplete="off" /></label>
          <label for="w-version"><span id="w-version-l"></span><input id="w-version" inputmode="numeric" value="1" /></label>
          <label for="w-cat"><span id="w-cat-l"></span><select id="w-cat"><option value="procedure" id="w-cat-p"></option><option value="emergency" id="w-cat-e"></option></select></label>
          <label for="w-title"><span id="w-title-l"></span><input id="w-title" autocomplete="off" /></label>
          <label for="w-title-ta"><span id="w-title-ta-l"></span><input id="w-title-ta" autocomplete="off" lang="ta" /></label>
          <label for="w-roles"><span id="w-roles-l"></span><input id="w-roles" autocomplete="off" /></label>
        </div>
        <label for="w-en"><span id="w-en-l"></span><textarea id="w-en"></textarea></label>
        <label for="w-ta"><span id="w-ta-l"></span><textarea id="w-ta" lang="ta"></textarea></label>
        <button id="w-save" type="button"><span id="w-save-text"></span></button>
        <p class="status" id="w-status" role="status" aria-live="polite"></p>
      </section>
      <section id="set-contacts" hidden aria-labelledby="sc-h">
        <h3 id="sc-h"></h3>
        <label for="sc-lines"><span id="sc-lines-l"></span><textarea id="sc-lines"></textarea></label>
        <button id="sc-save" type="button"><span id="sc-save-text"></span></button>
        <p class="status" id="sc-status" role="status" aria-live="polite"></p>
      </section>
      <section id="drills" hidden aria-labelledby="drill-h">
        <h3 id="drill-h"></h3>
        <ul class="rows" id="drill-rows"></ul>
        <div class="row-form">
          <label for="d-sop"><span id="d-sop-l"></span><input id="d-sop" autocomplete="off" /></label>
          <label for="d-branch"><span id="d-branch-l"></span><input id="d-branch" autocomplete="off" /></label>
          <label for="d-on"><span id="d-on-l"></span><input id="d-on" type="date" /></label>
          <label for="d-who"><span id="d-who-l"></span><input id="d-who" autocomplete="off" /></label>
        </div>
        <label for="d-found"><span id="d-found-l"></span><textarea id="d-found"></textarea></label>
        <button id="d-save" type="button"><span id="d-save-text"></span></button>
        <p class="status" id="d-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./help.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
