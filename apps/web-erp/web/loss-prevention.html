<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Investigations</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Loss-prevention investigations inbox — the store manager's screen (M15-FR-04, API-05, P-03, §28). Every
      rule lives in the tested session model (apps/web-erp/src/loss-prevention-inbox-session.ts), attached as
      window.lossPreventionInboxSession and built on the shared packages/ui primitives over the tested
      buildOpenCaseWorklist. It shows every OPEN investigation, biggest money at stake first, then — for a
      manager — a "close a case" form (pick a case, an outcome, and the note that IS the record). Closing is a
      HUMAN write that runs ONLY on an explicit click, never on load; on success the worklist is re-read (a GET)
      so the closed case drops off. A "proven" outcome needs a second signer, evidence and a verified chain,
      which the server enforces — the screen never fakes it. Names are shown only as opaque references (P-04).
      The open cases are read live (GET /v1/loss-prevention/cases); offline the screen shows its sample stand-in.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:900px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .summary { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
      .summary .count { font-size:18px; font-weight:700; } .summary .count.attention { color:var(--degraded); }
      .summary .exposure { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .value { font-weight:700; font-variant-numeric:tabular-nums; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
      .closer { background:var(--panel); border-radius:12px; padding:14px; display:grid; gap:10px; }
      .closer label { font-size:14px; color:var(--muted); }
      .closer select, .closer input { width:100%; min-height:var(--tap); padding:0 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
      .closer .note { min-height:var(--tap); }
      button.act { min-height:var(--tap); padding:0 16px; border:0; border-radius:10px; font-size:16px; font-weight:700; background:var(--degraded); color:var(--on-warn); }
      button.act:focus-visible, select:focus-visible, input:focus-visible, .lang:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      p.result { margin:0; padding:12px 14px; border-radius:12px; background:var(--panel); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.result .icon { font-size:18px; }
      p.result.tone-ok { border-left:6px solid var(--ok); } p.result.tone-degraded { border-left:6px solid var(--degraded); } p.result.tone-error { border-left:6px solid var(--error); }
      p.result[hidden] { display:none; }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:var(--danger-text); }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <h1 class="who" id="who">Investigations <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Investigations</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="summary" role="status" aria-live="polite">
        <span class="count attention" id="open-count"></span>
        <span class="exposure" id="exposure"></span>
      </div>

      <h3 id="open-heading" hidden></h3>
      <ul class="rows" id="rows" aria-label="Open investigations to work"></ul>

      <h3 id="raised-heading" hidden></h3>
      <ul class="rows" id="raised-rows" aria-label="Raised by the store's rules today"></ul>

      <section class="closer" id="closer" hidden aria-label="Close an investigation">
        <h3 id="close-heading"></h3>
        <div>
          <label for="close-case" id="close-case-label"></label>
          <select id="close-case"></select>
        </div>
        <div>
          <label for="close-outcome" id="close-outcome-label"></label>
          <select id="close-outcome"></select>
        </div>
        <div>
          <label for="close-note" id="close-note-label"></label>
          <input id="close-note" class="note" type="text" autocomplete="off" />
        </div>
        <button id="close" class="act" type="button"></button>
      </section>

      <!-- R4 Lane 4 · D-21 (OB-217) — begin: "Seen together" — till exceptions, waste and shrink, count differences for a
           product or a cashier and a period (GET /v1/loss-prevention/correlation); a proposed case a PERSON opens; a CCTV clip
           as a reference only (camera, time from–to, who collected it). Tested model: apps/web-erp/src/lp-correlation-session.ts. -->
      <section class="closer" id="together" hidden aria-labelledby="together-heading">
        <h3 id="together-heading"></h3>
        <p class="lead" id="together-lead"></p>
        <div><label for="together-kind" id="together-kind-label"></label><select id="together-kind"><option value="product"></option><option value="cashier"></option></select></div>
        <div><label for="together-id" id="together-id-label"></label><input id="together-id" type="text" autocomplete="off" /></div>
        <div><label for="together-from" id="together-from-label"></label><input id="together-from" type="date" /></div>
        <div><label for="together-to" id="together-to-label"></label><input id="together-to" type="date" /></div>
        <button id="together-show" class="act" type="button"></button>
        <p class="lead" id="together-status" role="status" aria-live="polite"></p>
        <div id="together-result" hidden>
          <h3 id="till-heading"></h3><ul class="rows" id="till-rows"></ul>
          <h3 id="shrink-heading"></h3><ul class="rows" id="shrink-rows"></ul>
          <h3 id="counts-heading"></h3><ul class="rows" id="count-rows"></ul>
          <p class="lead" id="joined"></p>
          <p class="lead" id="proposal"></p>
          <div id="open-form" hidden>
            <div><label for="open-case-id" id="open-case-id-label"></label><input id="open-case-id" type="text" autocomplete="off" /></div>
            <div><label for="open-assignee" id="open-assignee-label"></label><input id="open-assignee" type="text" autocomplete="off" /></div>
            <button id="open-case" class="act" type="button"></button>
          </div>
        </div>
        <div id="cctv-form" hidden>
          <h3 id="cctv-heading"></h3>
          <div><label for="cctv-case" id="cctv-case-label"></label><input id="cctv-case" type="text" autocomplete="off" /></div>
          <div><label for="cctv-camera" id="cctv-camera-label"></label><input id="cctv-camera" type="text" autocomplete="off" /></div>
          <div><label for="cctv-from" id="cctv-from-label"></label><input id="cctv-from" type="datetime-local" /></div>
          <div><label for="cctv-to" id="cctv-to-label"></label><input id="cctv-to" type="datetime-local" /></div>
          <div><label for="cctv-by" id="cctv-by-label"></label><input id="cctv-by" type="text" autocomplete="off" /></div>
          <button id="cctv-add" class="act" type="button"></button>
          <p class="lead" id="cctv-status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <!-- R4 Lane 4 · D-21 — end -->

      <p class="result" id="result" hidden role="status" aria-live="polite"><span class="icon" id="result-icon" aria-hidden="true"></span><span id="result-text"></span></p>
      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./loss-prevention.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
