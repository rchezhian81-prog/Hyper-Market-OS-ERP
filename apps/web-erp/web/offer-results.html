<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Offer results</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Offer results (Round 4a · M05-FR-03 "promotion lifecycle" · M05-FR-04 "measure effectiveness … compares vs baseline").
      A THIN CLIENT over head office's offer register (GET /v1/promotions), each offer's rule (…/definition), what it did
      against a baseline (…/results: units, margin and supplier funding, from head office's banked bills and average buying
      cost — "not known" by name where a cost is missing, never costed at zero) and the Stop (…/stop, from now it never
      applies). An offer is defined and started on the Products page's Offer tab; this page reads and stops. Nothing is
      written on open.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-faces.js" defer></script>
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; }
      h3 { margin: 0; font-size: 16px; }
      p.lead { margin: 0; color: var(--muted); font-size: 15px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; }
      input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; align-items: end; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; padding: 0 16px; }
      button.primary {   border: 0; }
      button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      tr[data-id] { cursor: pointer; }
      .status { font-size: 15px; min-height: 20px; margin: 0; }
      .status.good { color: var(--ok); } .status.err { color: var(--danger-text); }
      .muted { color: var(--muted); font-size: 14px; margin: 0; }
      .nobody { background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; margin: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title">Offer results</h1>
      <span class="sync">
        <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
      </span>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section aria-labelledby="page-h">
        <h2 id="page-h">Offer results</h2>
        <p class="lead" id="lead"></p>
        <div id="figures" role="status" aria-live="polite">
        </div>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="list-h">
        <h3 id="list-h">Offers</h3>
        <div id="rows-host" aria-labelledby="list-h"></div>
      </section>

      <section id="record" aria-labelledby="record-h" hidden>
        <h3 id="record-h"></h3>
        <p class="muted" id="rule"></p>
        <div class="row">
          <label for="b-from"><span id="l-b-from">Compare with the days from</span><input id="b-from" type="date" /></label>
          <label for="b-to"><span id="l-b-to">to</span><input id="b-to" type="date" /></label>
          <button id="measure" class="primary sre-btn sre-btn-primary" type="button">Measure the offer</button>
        </div>
        <p class="muted" id="baseline-say"></p>
        <div id="result-panels" aria-live="polite">
        </div>
        <p class="muted" id="result-say"></p>
        <div class="row" id="stop-row">
          <label for="s-why"><span id="l-s-why">Why stop it</span><input id="s-why" autocomplete="off" maxlength="300" /></label>
          <button id="stop" type="button" class="sre-btn sre-btn-danger">Stop this offer now</button>
        </div>
        <p class="status" id="record-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./offer-results.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
