<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Payroll legal figures</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Payroll legal figures (W5 · OB-684 · C15 · C16 · C19 · OB-208). A THIN CLIENT for the chartered accountant, gated on
      payroll.legal.read: ONLY the legal figures the CA fills (GET /v1/hr/payroll/legal-settings) — EPF and ESI rates, ceilings
      and headcounts, the normal hours, the overtime rate, the minimum-wage classes and the payslip particulars — and, with
      payroll.legal.configure, filling one (POST /v1/hr/payroll/legal-settings/:key). Nobody's pay, no payslip, no total for any
      person. Payroll rule: online-first — never in the offline shell, nothing kept in the browser. Its session is
      createPayrollLegalSession in apps/web-erp/src/payroll-statutory-session.ts.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-faces.js" defer></script>
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
      input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      .depts { display: grid; gap: 6px; }
      .depts .row { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; }
      .muted { font-size: 14px; color: var(--muted); margin: 0; min-height: 20px; }
      .lead { margin: 0; color: var(--ink-2); max-width: 72ch; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Payroll legal figures</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section id="page-intro" aria-labelledby="page-h">
        <h2 id="page-h">Payroll legal figures</h2>
        <p class="lead" id="lead"></p>
        <p class="muted" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <section id="legal-figures" hidden aria-label="The CA's legal figures"></section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./payroll-legal.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
