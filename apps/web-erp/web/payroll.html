<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Payroll</title>
    <meta name="theme-color" content="#0f172a" />
    <!--
      Payroll — the operator screen (owner directive 14 Aug 2026; docs/design/screens/payroll.md).

      Deliberately UNLIKE every other shell in this folder: it is ONLINE-FIRST and holds the most sensitive
      data in the shop, so it does NOT register the caching service worker (nothing sensitive is ever written
      to this device), it does NOT use localStorage / IndexedDB / cookies, and it masks bank / PAN / UAN /
      Aadhaar by default. Sample data is always stamped "DEMO DATA — NOT REAL PAYROLL". Every rule lives in
      the tested model (apps/web-erp/src/payroll-session.ts); this only renders what it hands over.
    -->
    <style>
      :root {
        --bg: #0f172a; --panel: #1e293b; --ink: #f8fafc; --muted: #94a3b8;
        --ok: #22c55e; --degraded: #f59e0b; --error: #ef4444; --idle: #64748b; --info: #38bdf8;
        --line: #334155; --tap: 48px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--panel); flex-wrap: wrap; }
      .who { font-weight: 600; } .who small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
      .lang { background: var(--line); color: var(--ink); min-height: 40px; padding: 0 14px; font-size: 15px; border: 0; border-radius: 10px; }

      .demo, .offline, .nobody { margin: 0; padding: 10px 16px; font-size: 15px; font-weight: 700; }
      /* DEMO must be unmistakable and always visible when on — striped so it can never be mistaken for real. */
      .demo { background: repeating-linear-gradient(45deg, #7c2d12, #7c2d12 12px, #9a3412 12px, #9a3412 24px); color: #fff; letter-spacing: .04em; text-align: center; }
      .offline { background: var(--error); color: #fff; }
      .nobody { background: #3f2d12; color: #fde68a; font-weight: 600; }
      .demo[hidden], .offline[hidden], .nobody[hidden] { display: none; }

      main { flex: 1; padding: 16px; display: grid; gap: 16px; align-content: start; max-width: 960px; width: 100%; }
      h2 { margin: 0 0 4px; font-size: 20px; } h3 { margin: 8px 0 6px; font-size: 16px; }
      p.lead { margin: 0; color: var(--muted); font-size: 15px; }

      .stage { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: var(--panel); border-radius: 12px; padding: 12px 14px; }
      .stage .badge { font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--line); display: inline-flex; gap: 8px; align-items: center; }
      .stage .who2 { color: var(--muted); font-size: 14px; }

      .summary { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; }
      .summary .attention { color: var(--degraded); font-weight: 700; }
      .summary .total { font-variant-numeric: tabular-nums; }

      ul.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      li.person { background: var(--panel); border-radius: 12px; padding: 12px 14px; border-left: 6px solid var(--idle); display: grid; gap: 6px; }
      li.person.tone-ok { border-left-color: var(--ok); } li.person.tone-error { border-left-color: var(--error); }
      .person .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
      .person .name { font-weight: 600; } .person .dept { color: var(--muted); font-size: 14px; }
      .person .money { display: flex; gap: 16px; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-size: 15px; }
      .person .money b { font-weight: 700; }
      .status { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
      .status .icon { font-size: 16px; }
      .pay { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
      .pay span b { color: var(--ink); font-weight: 600; }

      .depts { display: grid; gap: 4px; } .depts .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

      .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .actions button { min-height: var(--tap); padding: 0 18px; border: 0; border-radius: 12px; background: var(--info); color: #04283a; font-size: 16px; font-weight: 700; }
      .actions button[disabled] { background: var(--line); color: var(--muted); }
      .actions input { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: #0b1220; color: var(--ink); font-size: 15px; }

      #banner { position: sticky; bottom: 0; background: var(--panel); border-top: 2px solid var(--info); padding: 14px 16px; display: grid; gap: 8px; }
      #banner[hidden] { display: none; } #banner.good { border-top-color: var(--ok); }
      #banner button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--ink); color: #0f172a; font-weight: 700; justify-self: start; }
      .muted { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <p class="demo" id="demo" hidden></p>
    <p class="offline" id="offline" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <span class="who" id="who">Payroll <small id="whoami"></small></span>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Payroll</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="stage" role="status" aria-live="polite">
        <span class="badge" id="stage-badge"><span class="icon" id="stage-icon" aria-hidden="true"></span><span id="stage-label"></span></span>
        <span class="who2" id="stage-who"></span>
      </div>

      <div class="summary" role="status" aria-live="polite">
        <span class="total" id="totals"></span>
        <span class="attention" id="attention"></span>
      </div>

      <ul class="people" id="people" aria-label="Employees in this pay run"></ul>

      <div>
        <h3 id="depts-title"></h3>
        <div class="depts" id="depts"></div>
      </div>

      <!-- Locked-run outputs: the bank-file summary and the journal reconciliation. Shown only when locked. -->
      <section id="locked" hidden aria-label="Locked-run outputs">
        <h3 id="locked-title"></h3>
        <div class="depts">
          <div class="row"><span id="bank-records-label"></span><span id="bank-records"></span></div>
          <div class="row"><span id="bank-total-label"></span><span id="bank-total"></span></div>
          <div class="row"><span class="status" id="bank-reconciled"></span></div>
          <div class="row"><span id="journal-debit-label"></span><span id="journal-debit"></span></div>
          <div class="row"><span id="journal-credit-label"></span><span id="journal-credit"></span></div>
          <div class="row"><span class="status" id="journal-balanced"></span></div>
        </div>
      </section>

      <div class="actions" id="reauth"></div>
      <div class="actions" id="actions"></div>
      <p class="muted" id="masked-note"></p>
    </main>

    <div id="banner" hidden aria-live="assertive">
      <strong id="banner-title"></strong>
      <span id="banner-text"></span>
      <button id="banner-ok" type="button">OK</button>
    </div>

    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./payroll.js" type="module"></script>
  </body>
</html>
