<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Product checks</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Product checks (Wave 2 · OB-625, owner, 1 Nov 2026: "build them in wave 2, read-only, before the pilot" · roadmap M03
      reporting lines). A READ-ONLY THIN CLIENT over head office's GET /v1/catalogue/reports/product-checks: every product
      that can be sold with no tax mapping (no HSN code, or no GST rate for its code today), with allergen or ingredient
      details missing where its category needs them, or with no barcode. Every count is head office's, from its own product
      master, categories, barcode register and GST rate schedules; the page says how many products were checked, so a nought
      reads "checked, none found" and never "not looked". A gap is fixed on the product's own page. Nothing is written here.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; box-sizing: border-box; align-content: start; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; }
      p.lead { margin: 0; color: var(--muted); font-size: 15px; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0 16px; justify-self: start; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .status { font-size: 15px; min-height: 20px; margin: 0; }
      .status.good { color: var(--ok); } .status.err { color: var(--danger-text); }
      .nobody { background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; margin: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title">Product checks</h1>
      <span class="sync"><button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button></span>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section aria-labelledby="page-h">
        <h2 id="page-h">Product checks</h2>
        <p class="lead" id="lead"></p>
        <button id="refresh" type="button" class="sre-btn sre-btn-primary">Check the products again</button>
        <div id="cards"></div>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <section aria-labelledby="tax-h">
        <h3 id="tax-h">1. No tax mapping</h3>
        <p class="lead" id="tax-lead"></p>
        <div id="tax-register"></div>
      </section>
      <section aria-labelledby="allergens-h">
        <h3 id="allergens-h">2. Allergen or ingredient details missing</h3>
        <p class="lead" id="allergens-lead"></p>
        <div id="allergens-register"></div>
      </section>
      <section aria-labelledby="barcode-h">
        <h3 id="barcode-h">3. No barcode</h3>
        <p class="lead" id="barcode-lead"></p>
        <div id="barcode-register"></div>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./product-checks.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
