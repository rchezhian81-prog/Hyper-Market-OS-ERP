<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Duplicates and merges</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Duplicates and merges (Round 4a · M03-FR-04 "duplicate detection … merges are approved and reversible" · re-audit G-1).
      A THIN CLIENT over head office's duplicate check (POST /v1/catalogue/products/duplicates, a read that writes nothing) and
      its merge register (/v1/catalogue/merges/*). One person proposes that one record replaces another, with a reason; a
      DIFFERENT person approves or rejects it — head office refuses the proposer, by name, whatever they hold; an approved
      merge is a link, never a deletion, and can be reversed. Nothing is ever merged by itself; nothing is written on open.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-faces.js" defer></script>
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; }
      h3 { margin: 0; font-size: 16px; }
      p.lead { margin: 0; color: var(--muted); font-size: 15px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; }
      input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; align-items: end; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; padding: 0 16px; }
      button.primary {   border: 0; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
      .panel { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); display: grid; gap: 2px; min-width: 0; }
      .panel .k { color: var(--muted); font-size: 14px; }
      .panel .v { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
      .panel .v.unknown { color: var(--warn); font-size: 16px; }
      #tabs { display: flex; gap: 8px; flex-wrap: wrap; }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .rows li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); overflow-wrap: anywhere; font-size: 15px; display: grid; gap: 6px; }
      .rows li .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
      .status { font-size: 15px; min-height: 20px; margin: 0; }
      .status.good { color: var(--ok); } .status.err { color: var(--danger-text); }
      .muted { color: var(--muted); font-size: 14px; margin: 0; }
      .nobody { background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; margin: 0; }
      [hidden] { display: none !important; }
          /* U1: a hidden button stays hidden although it wears the foundation's button class (the foundation's .sre-btn display rule follows its [hidden] rule). */
      .sre-btn[hidden] { display: none; }
      .pick-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
      .pick-row input { flex: 1 1 140px; min-width: 0; }
      .pick-name { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title">Duplicates and merges</h1>
      <span class="sync">
        <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
      </span>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section aria-labelledby="page-h">
        <h2 id="page-h">Duplicates and merges</h2>
        <p class="lead" id="lead"></p>
        <div class="panels" role="status" aria-live="polite">
          <div class="panel"><span class="k" id="k-pairs">Possible duplicates</span><span class="v" id="v-pairs">—</span></div>
          <div class="panel"><span class="k" id="k-pending">Merges waiting for a decision</span><span class="v" id="v-pending">—</span></div>
          <div class="panel"><span class="k" id="k-merged">Merged and in force</span><span class="v" id="v-merged">—</span></div>
        </div>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>

      <nav id="tabs" aria-label="Sections">
        <button id="tab-dupes" type="button" aria-current="page">Possible duplicates</button>
        <button id="tab-merges" type="button">Merges</button>
      </nav>

      <section id="view-dupes" aria-labelledby="dupes-h">
        <h3 id="dupes-h">Possible duplicates</h3>
        <p class="lead" id="dupes-lead"></p>
        <ul class="rows" id="pairs" aria-label="Possible duplicates"></ul>
        <h3 id="propose-h">Propose a merge</h3>
        <div class="row">
          <label for="m-keep"><span id="l-m-keep">Keep this record</span><input id="m-keep" list="product-list" autocomplete="off" /></label>
          <label for="m-drop"><span id="l-m-drop">It replaces this one</span><input id="m-drop" list="product-list" autocomplete="off" /></label>
          <label for="m-why"><span id="l-m-why">Why</span><input id="m-why" autocomplete="off" maxlength="300" /></label>
          <button id="propose" class="primary sre-btn sre-btn-primary" type="button">Propose the merge</button>
        </div>
        <datalist id="product-list"></datalist>
        <p class="status" id="propose-status" role="status" aria-live="polite"></p>
      </section>

      <section id="view-merges" aria-labelledby="merges-h" hidden>
        <h3 id="merges-h">Merges</h3>
        <p class="lead" id="merges-lead"></p>
        <ul class="rows" id="merges" aria-label="Merges"></ul>
        <p class="status" id="merges-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./product-merges.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
