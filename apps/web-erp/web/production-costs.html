<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Production costs</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Production costs (W4 · M11-FR-02 · §28 "costing reviewed by Finance"). A THIN CLIENT over head office's
      GET /v1/production/costs: what each production run's output cost, line by line (average buying cost, else the
      registered production cost — OB-68 / OB-70), and every yield outside the recipe's range as an exception with its
      money, first (P-08). A run not valued says so by name, never zero. The page asks its own word, production.cost.read
      (the owner, the store manager, the accountant). It only reads. Its session is apps/web-erp/src/production-costs-session.ts.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; }
      .status { font-size: 14px; min-height: 20px; margin: 0; }
      .exc { color: var(--danger-text); font-size: 14px; margin: 0; }
      .warnc { color: var(--degraded); font-size: 14px; margin: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Production costs</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section id="page-intro" aria-labelledby="page-h">
        <h2 id="page-h">Production costs</h2>
        <p class="lead" id="lead"></p>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
        <div id="cards"></div>
      </section>
      <section id="list" aria-labelledby="register-h">
        <h3 id="register-h"></h3>
        <div id="costs-register"></div>
        <p class="status" id="as-at"></p>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./production-costs.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
