<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Release for Sale</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Production quality-release — the "which finished batches may go on sale" screen (M11-FR-03, API-04, P-03,
      P-04, P-05, P-08). Every rule lives in the tested session model (apps/web-erp/src/production-session.ts),
      attached as window.productionSession and built on the shared packages/ui primitives over the cloud's
      production board. It shows every finished batch still in QUARANTINE — worst first (a production exception
      shouts loudest) — each reading as attention (never a bare colour). Freshly made food is not for sale
      because it exists; it is for sale when someone has looked at it and released it. The one action from here
      is RELEASE FOR SALE, or HOLD on a failed check: a HUMAN write that runs ONLY on an explicit click, never on
      load, in the operator's own name. The server re-checks production.release and refuses an expired batch; no
      AI releases food for sale (hard rule #5). The board is read live (GET /v1/production/runs); offline the
      screen shows its clearly-marked sample stand-in and says so.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:900px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .summary { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
      .summary .count { font-size:18px; font-weight:700; } .summary .count.attention { color:var(--degraded); }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:8px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
      .row .facts .warnc { color:var(--degraded); font-weight:700; }
      .row .exc { font-size:13px; color:var(--danger-text); }
      .actions { display:flex; gap:10px; flex-wrap:wrap; }
      button.act { min-height:var(--tap); padding:0 16px; border:0; border-radius:10px; font-size:15px; font-weight:700; }
      button.release { background:var(--ok); color:var(--on-accent); } button.hold { background:var(--line); color:var(--ink); }
      button.act:focus-visible, .lang:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      p.result { margin:0; padding:12px 14px; border-radius:12px; background:var(--panel); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.result .icon { font-size:18px; }
      p.result.tone-ok { border-left:6px solid var(--ok); } p.result.tone-degraded { border-left:6px solid var(--degraded); } p.result.tone-error { border-left:6px solid var(--error); }
      p.result[hidden] { display:none; }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:var(--danger-text); }
      section.form { background:var(--panel); border-radius:12px; padding:14px; display:grid; gap:10px; }
      section.form h3 { margin:0; }
      section.form label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
      section.form input, section.form select { width:100%; box-sizing:border-box; min-height:var(--tap); padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; }
      section.form .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); }
      section.form button.act { background:var(--accent, var(--line)); color:var(--ink); }
      input:focus-visible, select:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      p.note { margin:0; color:var(--muted); font-size:14px; }
      pre.label { margin:0; padding:12px; background:var(--bg); border:1px dashed var(--line); border-radius:10px; font-size:14px; white-space:pre-wrap; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <h1 class="who" id="who">Release for sale <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Release for sale</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="summary" role="status" aria-live="polite">
        <span class="count attention" id="release-count"></span>
      </div>

      <h3 id="list-heading" hidden></h3>
      <ul class="rows" id="rows" aria-label="Finished batches to release"></ul>

      <section class="form" id="runner" hidden aria-label="Record a run">
        <h3 id="run-heading"></h3>
        <p class="note" id="run-hint"></p>
        <div class="grid">
          <div><label for="run-recipe" id="run-recipe-label"></label><input id="run-recipe" type="text" autocomplete="off" /></div>
          <div><label for="run-batches" id="run-batches-label"></label><input id="run-batches" type="text" inputmode="numeric" autocomplete="off" /></div>
          <div><label for="run-output" id="run-output-label"></label><input id="run-output" type="text" inputmode="numeric" autocomplete="off" /></div>
          <div><label for="run-batch" id="run-batch-label"></label><input id="run-batch" type="text" autocomplete="off" /></div>
          <div><label for="run-location" id="run-location-label"></label><input id="run-location" type="text" autocomplete="off" /></div>
        </div>
        <button id="run" class="act" type="button"></button>
      </section>
      <p class="note" id="no-run" hidden></p>

      <section class="form" id="labeller" hidden aria-label="Print the label">
        <h3 id="label-heading"></h3>
        <p class="note" id="label-none" hidden></p>
        <div id="label-fields">
          <div class="grid">
            <div><label for="label-run" id="label-run-label"></label><select id="label-run"></select></div>
            <div><label for="label-name" id="label-name-label"></label><input id="label-name" type="text" autocomplete="off" /></div>
            <div><label for="label-net" id="label-net-label"></label><input id="label-net" type="text" autocomplete="off" /></div>
            <div><label for="label-packer" id="label-packer-label"></label><input id="label-packer" type="text" autocomplete="off" /></div>
            <div><label for="label-price" id="label-price-label"></label><input id="label-price" type="text" inputmode="decimal" autocomplete="off" /></div>
            <div><label for="label-allergens" id="label-allergens-label"></label><input id="label-allergens" type="text" autocomplete="off" /></div>
          </div>
          <button id="label" class="act" type="button"></button>
        </div>
        <pre class="label" id="label-out" hidden aria-label="The label"></pre>
      </section>
      <p class="note" id="no-label" hidden></p>

      <p class="result" id="result" hidden role="status" aria-live="polite"><span class="icon" id="result-icon" aria-hidden="true"></span><span id="result-text"></span></p>
      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./production.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
