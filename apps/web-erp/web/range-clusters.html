<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Store groups and seasons</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Store groups and seasons (Wave 2 · D02-FR-02 "seasonal assortment and store clustering" · OB-318: the group IS the
      price-zone register · M04-FR-01 "range changes are effective-dated; drop decisions record a reason"). A THIN CLIENT
      over head office's routes: the groups and their stores (GET /v1/merchandising/clusters), a product listed or dropped
      for every store of a group (POST …/clusters/:zoneId/:productId/list|drop — a drop with stock on the shelf goes to
      clearance, never deleted; head office reads the stock, never this page), and season plans (GET/POST
      /v1/merchandising/season-plans — listed from the first day, ended into clearance after the last by the ops worker).
      Every word has a Tamil twin; nothing is written on open.
      W3 (D02-FR-04 · OB-319): the range-gap report (GET /v1/merchandising/range-gaps) — short-picks, turned-down
      substitutes and empty app searches by category and price band, and own-brand margin against branded. Read only; its
      session is apps/web-erp/src/range-gaps-session.ts and its view range-gaps.js.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-faces.js" defer></script>
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; box-sizing: border-box; align-content: start; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; }
      p.lead { margin: 0; color: var(--muted); font-size: 15px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; }
      input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--field-line, var(--line)); border-radius: 10px; background: var(--field, var(--bg)); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; align-items: end; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--field, var(--bg)); color: var(--ink); cursor: pointer; padding: 0 16px; }
      button.primary {   border: 0; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; min-width: 0; margin: 0; }
      legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .rows li { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); overflow-wrap: anywhere; font-size: 15px; }
      .muted { color: var(--muted); font-size: 14px; margin: 0; }
      .status { font-size: 15px; min-height: 20px; margin: 0; }
      .status.good { color: var(--ok); } .status.err { color: var(--danger-text); }
      .nobody { background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; margin: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title">Store groups and seasons</h1>
      <span class="sync"><button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button></span>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section aria-labelledby="page-h">
        <h2 id="page-h">Store groups and seasons</h2>
        <p class="lead" id="lead"></p>
        <div id="cards"></div>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <section aria-labelledby="groups-h">
        <h3 id="groups-h">Store groups</h3>
        <p class="lead" id="groups-lead"></p>
        <div id="groups-register"></div>
        <form id="range-form">
          <fieldset>
            <legend id="range-h">Change the range for a whole group</legend>
            <p class="muted" id="range-note"></p>
            <div class="row">
              <label for="r-zone"><span id="l-rzone">Store group</span><select id="r-zone"></select></label>
              <label for="r-product"><span id="l-rproduct">Product code</span><input id="r-product" autocomplete="off" /></label>
              <label for="r-action"><span id="l-raction">What to do</span><select id="r-action"><option value="list">Carry it</option><option value="drop">Take it out of the range</option></select></label>
              <label for="r-from"><span id="l-rfrom">From</span><input id="r-from" type="date" /></label>
              <label for="r-reason"><span id="l-rreason">Why it is taken out</span><select id="r-reason"></select></label>
              <label for="r-note"><span id="l-rnote">Note (optional)</span><input id="r-note" autocomplete="off" maxlength="200" /></label>
            </div>
            <button id="range-go" class="primary sre-btn sre-btn-primary" type="submit">Record this for every store in the group</button>
            <p class="status" id="range-status" role="status" aria-live="polite"></p>
            <ul class="rows" id="range-result" aria-label="What happened in each store"></ul>
          </fieldset>
        </form>
      </section>
      <section aria-labelledby="seasons-h">
        <h3 id="seasons-h">Season plans</h3>
        <p class="lead" id="seasons-lead"></p>
        <div id="seasons-register"></div>
        <form id="season-form">
          <fieldset>
            <legend id="season-h">Make a season plan</legend>
            <div class="row">
              <label for="s-id"><span id="l-sid">Season name (letters, numbers, dashes)</span><input id="s-id" autocomplete="off" maxlength="40" /></label>
              <label for="s-zone"><span id="l-szone">For a store group</span><select id="s-zone"></select></label>
              <label for="s-store"><span id="l-sstore">…or for one store</span><input id="s-store" autocomplete="off" /></label>
              <label for="s-products"><span id="l-sproducts">Products (codes, separated by commas)</span><input id="s-products" autocomplete="off" /></label>
              <label for="s-from"><span id="l-sfrom">First day of the season</span><input id="s-from" type="date" /></label>
              <label for="s-to"><span id="l-sto">Last day of the season</span><input id="s-to" type="date" /></label>
              <label for="s-reason"><span id="l-sreason">What the season is</span><input id="s-reason" autocomplete="off" maxlength="200" /></label>
            </div>
            <button id="season-go" class="primary sre-btn" type="submit">Make this season plan</button>
            <p class="status" id="season-status" role="status" aria-live="polite"></p>
          </fieldset>
        </form>
      </section>
      <section id="gaps" hidden aria-labelledby="gaps-h">
        <h3 id="gaps-h">Range gaps and own brand</h3>
        <p class="lead" id="gaps-lead"></p>
        <form id="gaps-form">
          <div class="row">
            <label for="g-from"><span id="l-gfrom">From</span><input id="g-from" type="date" /></label>
            <label for="g-to"><span id="l-gto">To</span><input id="g-to" type="date" /></label>
            <label for="g-bands"><span id="l-gbands">Price bands</span><input id="g-bands" autocomplete="off" inputmode="decimal" /></label>
          </div>
          <button id="gaps-go" class="primary sre-btn" type="submit">Show the report</button>
        </form>
        <p class="status" id="gaps-status" role="status" aria-live="polite"></p>
        <div id="gaps-report"></div>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./range-clusters.js" type="module"></script>
    <script src="./range-gaps.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
