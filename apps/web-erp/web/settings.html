<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Settings</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Settings and their history (Round 4c · M01-FR-03 · M33-FR-01). Its own page — no longer a second door to Store setup. A
      THIN CLIENT over head office's settings (GET /v1/platform/setup), each setting's every version (GET
      /v1/platform/config/:key/history) and one-step going back (POST /v1/platform/config/:key/rollback — a new version; a
      high-impact setting only with the owner's approval). Its session is apps/web-erp/src/settings-session.ts.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; } h4 { margin: 0; font-size: 15px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
      input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
      button.quiet { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
      button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      ul.rows > li { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; border-left: 6px solid var(--idle); overflow-wrap: anywhere; }
      ul.rows > li.answered { border-left-color: var(--ok); }
      ul.versions { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      ul.versions > li { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; }
      .head { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
      .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
      .meta { font-size: 14px; color: var(--muted); margin: 0; }
      .status { font-size: 14px; min-height: 20px; margin: 0; }
      /* W5: the working-time and register sections (forms, selects, the state of each row). */
      .row-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      .row-form > label { flex: 1 1 180px; }
      select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      ul.rows > li[data-state="pending"], ul.rows > li[data-state="breach"] { border-left-color: var(--degraded); }
      ul.rows > li[data-state="in_force"], ul.rows > li[data-state="stands"] { border-left-color: var(--ok); }
      table.reg { border-collapse: collapse; font-size: 14px; width: 100%; } table.reg th, table.reg td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
      .wide { overflow-x: auto; max-width: 100%; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Settings</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section id="page-intro" aria-labelledby="page-h">
        <h2 id="page-h">Settings</h2>
        <p class="lead" id="lead"></p>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <section id="list" hidden aria-labelledby="list-h">
        <h3 id="list-h"></h3>
        <p class="status" id="list-status" role="status" aria-live="polite"></p>
        <ul class="rows" id="rows"></ul>
      </section>
      <!-- W5 (C18 · OB-152 · OB-155 · OB-156): working-time limits, leave types and holidays — settings-working-time.js. -->
      <section id="working-time" hidden aria-labelledby="wt-h"></section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./settings.js" type="module"></script>
    <script src="./settings-working-time.js" type="module"></script>
    <!-- W5 (store operations): the sections head office answers on this page — apps/web-erp/src/w5-store-ops-sections.ts, drawn by w5-sections.js. -->
    <script src="./w5-sections.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
