<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Stored-value oversight</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Stored-value oversight — the manager / accountant's READ-ONLY control-by-exception view of the money the
      shop owes on gift cards and store credit (M17-FR-03/04, API-06, P-03, P-04, hard rule #10). Every rule
      lives in the tested session model (apps/web-erp/src/stored-value-session.ts), attached as
      window.storedValueSession and built on the shared packages/ui + packages/a11y primitives. Three feeds,
      worst-first: cards given away twice across channels (settled loss), the cards' liability vs what the books
      posted (a signed gap — enter the posted figure to reconcile), and cards draining unusually fast (a watch).
      It reads and reports; it CHANGES nothing — no write verb anywhere. The velocity watch is read live on load
      and Refresh (GET); a customer reference looks up that household's double-spends (GET); a posted figure
      reconciles the liability (GET). Offline the screen shows its sample stand-in and says so. No
      prompt/confirm/alert.
    -->
    <style>
      :root { --bg:#0f172a; --panel:#1e293b; --ink:#f8fafc; --muted:#94a3b8; --ok:#22c55e; --degraded:#f59e0b; --error:#ef4444; --idle:#64748b; --info:#38bdf8; --line:#334155; --tap:48px; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100dvh; display:flex; flex-direction:column; }
      header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:var(--panel); flex-wrap:wrap; }
      .who { font-weight:600; } .who small { display:block; color:var(--muted); font-weight:400; font-size:14px; }
      .lang { background:var(--line); color:var(--ink); min-height:40px; padding:0 14px; font-size:15px; border:0; border-radius:10px; }
      .sample,.stale { margin:0; padding:10px 16px; font-size:15px; font-weight:600; }
      .sample { background:var(--degraded); color:#451a03; } .stale { background:#1e3a5f; color:#dbeafe; border-bottom:2px solid var(--info); font-weight:400; }
      .sample[hidden],.stale[hidden] { display:none; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:900px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .bar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between; }
      .asof { color:var(--muted); font-size:14px; }
      form.ask { display:flex; gap:8px; flex-wrap:wrap; align-items:end; background:var(--panel); border-radius:12px; padding:12px 14px; }
      form.ask label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
      form.ask input { min-height:40px; padding:0 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:#0b1220; color:var(--ink); font-variant-numeric:tabular-nums; }
      button { min-height:40px; padding:0 14px; border:0; border-radius:10px; font-size:15px; font-weight:700; background:var(--line); color:var(--ink); }
      button:focus-visible, .lang:focus-visible, input:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; font-variant-numeric:tabular-nums; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
      .gap { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:8px; border-left:6px solid var(--idle); }
      .gap.tone-ok { border-left-color:var(--ok); } .gap.tone-error { border-left-color:var(--error); }
      .gap .figs { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
      .gap .fig { display:grid; gap:2px; } .gap .f-label { font-size:13px; color:var(--muted); } .gap .f-value { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:#fecaca; }
      .muted { color:var(--muted); font-size:14px; margin:0; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>

    <header>
      <span class="who" id="who">Stored-value oversight <small id="whoami"></small></span>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Stored-value oversight</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="bar">
        <span class="asof" id="asof" role="status" aria-live="polite"></span>
        <button class="refresh" id="refresh" type="button"></button>
      </div>

      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>

      <h3 id="loss-heading"></h3>
      <form class="ask" id="lookup-form">
        <label id="owner-label">
          <span id="owner-label-text"></span>
          <input id="owner-ref" name="ownerRef" autocomplete="off" />
        </label>
        <button id="lookup-btn" type="submit"></button>
      </form>
      <ul class="rows" id="losses" aria-label="Cards given away twice"></ul>
      <p class="muted" id="loss-none" hidden></p>

      <h3 id="gap-heading"></h3>
      <form class="ask" id="reconcile-form">
        <label id="posted-label">
          <span id="posted-label-text"></span>
          <input id="posted-figure" name="posted" inputmode="numeric" autocomplete="off" />
        </label>
        <button id="reconcile-btn" type="submit"></button>
      </form>
      <div class="gap" id="gap-panel" hidden></div>
      <p class="muted" id="gap-needs" hidden></p>

      <h3 id="watch-heading"></h3>
      <ul class="rows" id="watch" aria-label="Cards draining fast"></ul>
      <p class="muted" id="watch-none" hidden></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./stored-value.js" type="module"></script>
  </body>
</html>
