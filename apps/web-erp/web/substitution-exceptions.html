<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Delivery exceptions</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Delivery-substitution exception inbox — the queue member's screen (M19-FR-01, Item 2, API-07, P-03, §28).
      Every rule lives in the tested session model (apps/web-erp/src/substitution-exception-inbox-session.ts),
      attached as window.substitutionExceptionInboxSession and built on the shared packages/ui primitives over
      the tested ownedWorklist. It shows every UNRESOLVED exception a swap left behind — a refund due, an
      adjustment to collect, a charge above the cap, a short-picked line — biggest money first, with the queue
      that owns it, who holds it, its age and whether its SLA is breached. A queue member CLAIMS one (a button on
      the row), then works what they hold: RESOLVE with a reason code and the words that ARE the record, or
      RELEASE it back. Every act is a HUMAN write that runs ONLY on an explicit click, never on load; on success
      the worklist is re-read (a GET) so the truth on screen is the cloud's. The picker who proposed the swap
      never approves it — the server enforces that; the screen never fakes it. The exceptions are read live
      (GET /v1/orders/substitution-exceptions); offline the screen shows its sample stand-in.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:960px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .summary { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
      .summary .count { font-size:18px; font-weight:700; } .summary .count.attention { color:var(--degraded); } .summary .count.breached { color:#fecaca; }
      .summary .exposure { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
      ul.queues { list-style:none; margin:0; padding:0; display:flex; gap:10px; flex-wrap:wrap; }
      ul.queues li { background:var(--panel); border-radius:999px; padding:4px 12px; font-size:14px; color:var(--muted); }
      ul.queues li b { color:var(--ink); }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .value { font-weight:700; font-variant-numeric:tabular-nums; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
      .row .facts .mine { color:#bbf7d0; font-weight:600; }
      .row .acts { display:flex; gap:10px; flex-wrap:wrap; }
      button.claim { min-height:40px; padding:0 14px; border:0; border-radius:10px; font-size:15px; font-weight:700; background:var(--info); color:#082f49; }
      .worker { background:var(--panel); border-radius:12px; padding:14px; display:grid; gap:10px; }
      .worker label { font-size:14px; color:var(--muted); }
      .worker select, .worker input { width:100%; min-height:var(--tap); padding:0 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
      .worker .buttons { display:flex; gap:10px; flex-wrap:wrap; }
      button.act { min-height:var(--tap); padding:0 16px; border:0; border-radius:10px; font-size:16px; font-weight:700; background:var(--degraded); color:#451a03; }
      button.act.quiet { background:var(--line); color:var(--ink); }
      button:focus-visible, select:focus-visible, input:focus-visible, .lang:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
      p.result { margin:0; padding:12px 14px; border-radius:12px; background:var(--panel); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.result .icon { font-size:18px; }
      p.result.tone-ok { border-left:6px solid var(--ok); } p.result.tone-degraded { border-left:6px solid var(--degraded); } p.result.tone-error { border-left:6px solid var(--error); }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:#fecaca; }
      p.nothing { margin:0; color:var(--muted); font-size:14px; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <span class="who" id="who">Delivery exceptions <small id="whoami"></small></span>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Delivery exceptions</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="summary" role="status" aria-live="polite">
        <span class="count attention" id="open-count"></span>
        <span class="count breached" id="breached-count"></span>
        <span class="exposure" id="exposure"></span>
      </div>

      <h3 id="queues-heading" hidden></h3>
      <ul class="queues" id="queues" aria-label="Open exceptions by queue"></ul>

      <h3 id="open-heading" hidden></h3>
      <ul class="rows" id="rows" aria-label="Open delivery exceptions to work"></ul>

      <section class="worker" id="worker" hidden aria-label="Work an exception you hold">
        <h3 id="work-heading"></h3>
        <div>
          <label for="work-item" id="work-item-label"></label>
          <select id="work-item"></select>
        </div>
        <div>
          <label for="work-reason" id="work-reason-label"></label>
          <input id="work-reason" type="text" autocomplete="off" />
        </div>
        <div>
          <label for="work-detail" id="work-detail-label"></label>
          <input id="work-detail" type="text" autocomplete="off" />
        </div>
        <div class="buttons">
          <button id="resolve" class="act" type="button"></button>
          <button id="release" class="act quiet" type="button"></button>
        </div>
      </section>
      <p class="nothing" id="nothing-held" hidden></p>

      <p class="result" id="result" hidden role="status" aria-live="polite"><span class="icon" id="result-icon" aria-hidden="true"></span><span id="result-text"></span></p>
      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./substitution-exceptions.js" type="module"></script>
  </body>
</html>
