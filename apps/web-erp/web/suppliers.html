<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Suppliers</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Suppliers — the supplier workbench's face (M06-FR-01, M23-FR-01, M15-FR-03, §28, API-03, P-02, P-03, P-08).
      Every rule lives in the tested session model (apps/web-erp/src/suppliers-session.ts), attached as
      window.suppliersSession and built on the shared packages/ui primitives. It lists every supplier the records
      name — needing a person first, each with its reasons in words, its hold, its verified bank account and the
      ONE balance the matched bills say — read live from head office (GET /v1/purchase/suppliers); Refresh re-reads
      it. Two HUMAN writes, each on an explicit click and only where the reader holds the right: PROPOSE or update a
      supplier (purchase.supplier.manage) and APPROVE a proposed one with a written reason
      (purchase.supplier.approve) — the proposer is refused on this screen before anything is sent, and the server
      refuses them again. Offline the screen shows its sample stand-in and says so. No prompt/confirm/alert.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      .sample,.stale { margin:0; padding:10px 16px; font-size:15px; font-weight:600; }
      .sample[hidden],.stale[hidden] { display:none; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:900px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .bar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between; }
      .asof { color:var(--muted); font-size:14px; } .summary { font-size:15px; font-weight:600; }
      button.refresh, button.act { min-height: var(--tap); padding:0 14px; border:0; border-radius:10px; font-size:15px; font-weight:700; background:var(--line); color:var(--ink); }
      button.act { background:var(--accent, var(--line)); }
      button.refresh:focus-visible, button.act:focus-visible, .lang:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      li.row { background:var(--panel); border-radius:12px; padding:12px 14px; display:grid; gap:6px; border-left:6px solid var(--idle); }
      li.row.tone-ok { border-left-color:var(--ok); } li.row.tone-degraded { border-left-color:var(--degraded); }
      li.row.tone-error { border-left-color:var(--error); } li.row.tone-idle { border-left-color:var(--idle); }
      .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .row .headline { font-weight:600; } .row .code { color:var(--muted); font-weight:400; font-size:14px; margin-left:6px; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      .row .facts { font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
      .row .facts .money { font-variant-numeric:tabular-nums; }
      ul.reasons { list-style:none; margin:4px 0 0; padding:0; display:grid; gap:4px; }
      li.reason { font-size:13px; display:flex; gap:8px; align-items:baseline; }
      li.reason::before { content:'•'; color:var(--muted); }
      section.form { background:var(--panel); border-radius:12px; padding:14px; display:grid; gap:10px; }
      section.form h3 { margin:0; }
      section.form label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
      section.form input, section.form select { width:100%; box-sizing:border-box; min-height: var(--tap); padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; }
      section.form .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); }
      p.note { margin:0; color:var(--muted); font-size:14px; }
      p.result, p.state { margin:0; padding:12px 16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.result .icon, p.state .icon { font-size:18px; }
      p.result.tone-error, p.state.tone-error { color:var(--danger-text, var(--danger-text)); }
      p.result.tone-ok { color:var(--ink); }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>

    <header>
      <h1 class="who" id="who">Suppliers <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Suppliers</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="bar">
        <span class="asof" id="asof" role="status" aria-live="polite"></span>
        <button class="refresh" id="refresh" type="button"></button>
      </div>

      <p class="summary" id="summary" role="status" aria-live="polite" hidden></p>

      <h3 id="list-heading" hidden></h3>
      <ul class="rows" id="rows" aria-label="Suppliers — who needs a person"></ul>

      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>

      <section class="form" id="approver" hidden aria-label="Approve a proposed supplier">
        <h3 id="approve-heading"></h3>
        <p class="note" id="approve-none" hidden></p>
        <div class="grid" id="approve-fields">
          <div>
            <label for="approve-supplier" id="approve-supplier-label"></label>
            <select id="approve-supplier"></select>
          </div>
          <div>
            <label for="approve-reason" id="approve-reason-label"></label>
            <input id="approve-reason" type="text" autocomplete="off" />
          </div>
        </div>
        <button id="approve" class="act" type="button"></button>
      </section>
      <p class="note" id="no-approve" hidden></p>

      <section class="form" id="proposer" hidden aria-label="Add or update a supplier">
        <h3 id="propose-heading"></h3>
        <div class="grid">
          <div>
            <label for="propose-code" id="propose-code-label"></label>
            <input id="propose-code" type="text" autocomplete="off" />
          </div>
          <div>
            <label for="propose-name" id="propose-name-label"></label>
            <input id="propose-name" type="text" autocomplete="organization" />
          </div>
          <div>
            <label for="propose-gstin" id="propose-gstin-label"></label>
            <input id="propose-gstin" type="text" autocomplete="off" />
          </div>
          <div>
            <label for="propose-phone" id="propose-phone-label"></label>
            <input id="propose-phone" type="tel" autocomplete="tel" />
          </div>
          <div>
            <label for="propose-email" id="propose-email-label"></label>
            <input id="propose-email" type="email" autocomplete="email" />
          </div>
          <div>
            <label for="propose-terms" id="propose-terms-label"></label>
            <input id="propose-terms" type="text" inputmode="numeric" autocomplete="off" />
          </div>
        </div>
        <button id="propose" class="act" type="button"></button>
      </section>
      <p class="note" id="no-propose" hidden></p>

      <p class="result" id="result" hidden role="status" aria-live="polite"><span class="icon" id="result-icon" aria-hidden="true"></span><span id="result-text"></span></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./suppliers.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
