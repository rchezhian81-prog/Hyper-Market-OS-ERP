<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Suppliers</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Suppliers — the supplier workbench's face (M06-FR-01, M23-FR-01, M15-FR-03, §28, API-03, P-02, P-03, P-08).
      Every rule lives in the tested session model (apps/web-erp/src/suppliers-session.ts), attached as
      window.suppliersSession and built on the shared packages/ui primitives. It lists every supplier the records
      name — needing a person first, each with its reasons in words, its hold, its verified bank account and the
      ONE balance the matched bills say — read live from head office (GET /v1/purchase/suppliers); Refresh re-reads
      it. Two HUMAN writes, each on an explicit click and only where the reader holds the right: PROPOSE or update a
      supplier (purchase.supplier.manage) and APPROVE a proposed one with a written reason
      (purchase.supplier.approve) — the proposer is refused on this screen before anything is sent, and the server
      refuses them again. Offline the screen shows its sample stand-in and says so. No prompt/confirm/alert.
      OB-205: the same page, polished inside the approved look — a head with its one action, a summary panel, the
      suppliers as one register (captions, aligned columns, the balance right-aligned), status chips from the one set.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      .sample,.stale { margin:0; padding:10px 16px; font-size:15px; font-weight:600; }
      [hidden] { display:none !important; }
      button:focus-visible, .lang:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }

      /* ── OB-205 (19 Oct 2026): the office polish — the approved look, page-level only ─────────────────── */
      main { flex:1; padding: var(--space-5) var(--space-4) var(--space-10); display:grid; gap: var(--space-5); align-content:start; max-width: 1180px; width:100%; box-sizing:border-box; }
      /* The head: the module, the title, one line of purpose — and the page's one action beside them. */
      .page-head { display:grid; grid-template-columns:minmax(0, 1fr) auto; column-gap: var(--space-6); align-items:end; }
      .page-head > * { grid-column:1; }
      .page-head > .head-actions { grid-column:2; grid-row:1 / span 3; display:flex; align-items:center; gap: var(--space-3); flex-wrap:wrap; justify-content:flex-end; }
      .page-head h2 { margin:0 0 6px; font-size: var(--fs-2xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }
      .page-head p.lead { margin:0; max-width:72ch; color: var(--ink-2); font-size: var(--fs-base); }
      .asof { color:var(--muted); font-size:14px; }
      .head-actions .sre-btn { font-size:16px; }
      @media (max-width: 720px) {
        .page-head { grid-template-columns:minmax(0, 1fr); }
        .page-head > .head-actions { grid-column:1; grid-row:auto; justify-content:flex-start; margin-top: var(--space-3); }
      }
      /* The summary panel: each figure large, its words under it; the one that needs a person carries the amber edge. */
      .stats { margin:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap:1px; background: var(--line-soft); border:1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow:hidden; }
      .stats .stat { background: var(--panel); padding:14px 18px; display:grid; gap:2px; align-content:start; }
      .stats .stat .n { font-size: var(--fs-xl); font-weight:700; line-height: var(--leading-tight); font-variant-numeric: var(--numbers); color: var(--ink); }
      .stats .stat .l { font-size:14px; color: var(--muted); font-weight:600; }
      .stats .stat[data-tone="degraded"] { box-shadow: inset 0 3px 0 var(--degraded); }
      .stats .stat[data-tone="error"] { box-shadow: inset 0 3px 0 var(--error); }
      h3.section { margin: var(--space-2) 0 calc(var(--space-3) * -1); font-size: var(--fs-lg); color: var(--ink); font-weight:600; letter-spacing:0; }

      /* The register: one panel, a sticky caption row, hairline rows lit under the pointer and while a control in one
         has the focus; the tone as a 3px edge AND a chip with its shape and word. Narrow, the captions go and rows stack. */
      .register { --cols: minmax(10rem, 1.2fr) minmax(11rem, 1.2fr) minmax(0, 2fr) 9rem; background: var(--panel); border:1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); container-type:inline-size; }
      .reg-head { position:sticky; top:0; z-index:2; display:grid; grid-template-columns: var(--cols); column-gap: var(--space-4); padding:10px 16px 10px 19px; background: var(--panel-2); border-bottom:1px solid var(--line); border-radius: var(--radius-lg) var(--radius-lg) 0 0; color: var(--muted); font-size:14px; font-weight:600; letter-spacing:.02em; }
      .reg-head .r { text-align:right; }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; }
      li.row { --tone: var(--idle); display:grid; grid-template-columns: var(--cols); column-gap: var(--space-4); row-gap: var(--space-2); align-items:start; padding:14px 16px 14px 19px; border-top:1px solid var(--line-soft); box-shadow: inset 3px 0 0 var(--tone); }
      li.row:first-child { border-top:0; }
      li.row:last-child { border-radius:0 0 var(--radius-lg) var(--radius-lg); }
      li.row:hover, li.row:focus-within { background: var(--hover); }
      li.row.tone-ok { --tone: var(--ok); } li.row.tone-degraded { --tone: var(--degraded); }
      li.row.tone-error { --tone: var(--error); } li.row.tone-idle { --tone: var(--idle); }
      .row .c-id { display:grid; gap:2px; min-width:0; }
      .row .headline { font-weight:700; overflow-wrap:anywhere; }
      .row .code { color: var(--muted); font-size:14px; font-variant-numeric: var(--numbers); }
      .row .status { justify-self:start; }
      .status .icon { display:inline-flex; width:16px; height:16px; align-items:center; justify-content:center; font-size:14px; }
      .status .icon .sre-icon { width:16px; height:16px; }
      .row .facts { font-size:14px; color: var(--ink-2); display:flex; gap:4px 14px; flex-wrap:wrap; min-width:0; }
      .row .facts .money { font-variant-numeric: var(--numbers); }
      .row .c-val { display:grid; justify-items:end; text-align:right; white-space:nowrap; }
      .row .c-val .n { font-weight:700; font-variant-numeric: var(--numbers); }
      .row .c-val .l { color: var(--muted); font-size:14px; }
      ul.reasons { grid-column: 2 / -1; list-style:none; margin:0; padding: var(--space-2) 0 0; border-top:1px dashed var(--line); display:grid; gap:4px; }
      li.reason { font-size:14px; display:flex; gap:8px; align-items:baseline; color: var(--ink-2); }
      li.reason::before { content:'•'; color: var(--muted); }
      @container (max-width: 760px) {
        .reg-head { display:none; }
        li.row { grid-template-columns:minmax(0, 1fr) auto; }
        .row .c-id { grid-column:1; } .row .c-val { grid-column:2; grid-row:1; }
        .row .status, .row .facts, ul.reasons { grid-column:1 / -1; }
      }

      /* An empty, not-permitted or not-known list: a shape and words, never a blank box. */
      p.state { margin:0; display:flex; gap: var(--space-3); align-items:center; padding: var(--space-5); background: var(--panel); border:1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--ink-2); font-size:16px; }
      p.state .icon { display:inline-flex; flex:none; width:24px; height:24px; align-items:center; justify-content:center; font-size:20px; color: var(--idle); }
      p.state .icon .sre-icon { width:24px; height:24px; }
      p.state.tone-error { color: var(--danger-text); border-style:solid; border-color: var(--error-surface); background: var(--error-surface); }
      p.state.tone-error .icon { color: var(--danger-text); }
      p.state.tone-degraded { color: var(--on-warn-surface); border-style:solid; border-color: var(--warn-surface); background: var(--warn-surface); }
      p.state.tone-degraded .icon { color: var(--on-warn-surface); }
      p.state.tone-ok .icon { color: var(--ok); }

      /* The forms: a panel with its heading on a hairline; labels you can read, help under a field that needs it. */
      section.form { background: var(--panel); border:1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-4) var(--space-5) var(--space-5); display:grid; gap: var(--space-4); }
      section.form h3 { margin:0 calc(var(--space-5) * -1); padding:0 var(--space-5) var(--space-3); border-bottom:1px solid var(--line-soft); font-size: var(--fs-md); font-weight:600; color: var(--ink); }
      section.form label { display:block; font-size:15px; color: var(--ink-2); font-weight:600; margin-bottom:6px; }
      section.form input, section.form select { width:100%; box-sizing:border-box; min-height: var(--tap); padding:0 14px; border:1px solid var(--field-line); border-radius: var(--radius); background: var(--field); color:var(--ink); font:inherit; }
      section.form input:focus-visible, section.form select:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px var(--focus-halo); }
      section.form .grid { display:grid; gap: var(--space-4); grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
      /* Each field is label · input · help on the row's shared tracks, so inputs line up however long a label runs. */
      section.form .grid > div { display:grid; grid-row: span 3; grid-template-rows: subgrid; row-gap:6px; }
      section.form .grid > div > label { margin-bottom:0; align-self:end; }
      section.form .grid > div > .help { margin:0; }
      .help { margin:6px 0 0; color: var(--muted); font-size:14px; }
      button.act { justify-self:start; min-height: var(--tap); padding:0 20px; border:1px solid var(--accent); border-radius: var(--radius); font-size:16px; font-weight:700; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
      button.act:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      button.act:active { transform: translateY(1px); }
      p.note { margin:0; color: var(--ink-2); font-size:15px; }
      section.form p.note { color: var(--muted); }
      p.result { margin:0; padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius: var(--radius-lg); color:var(--ink-2); font-size:15px; display:flex; gap:10px; align-items:center; box-shadow: var(--shadow-sm); }
      p.result .icon { display:inline-flex; flex:none; width:20px; height:20px; align-items:center; justify-content:center; font-size:18px; }
      p.result .icon .sre-icon { width:20px; height:20px; }
      p.result.tone-error { color:var(--danger-text); background: var(--error-surface); border-color: var(--error-surface); }
      p.result.tone-ok { color: var(--on-ok-surface); background: var(--ok-surface); border-color: var(--ok-surface); }
      p.result.tone-degraded { color: var(--on-warn-surface); background: var(--warn-surface); border-color: var(--warn-surface); }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>

    <header>
      <h1 class="who" id="who">Suppliers <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div class="page-head">
        <h2 id="title">Suppliers</h2>
        <p class="lead" id="lead"></p>
        <div class="head-actions">
          <span class="asof" id="asof" role="status" aria-live="polite"></span>
          <button class="refresh sre-btn" id="refresh" type="button"></button>
        </div>
      </div>

      <div class="stats" id="summary" role="status" aria-live="polite" hidden></div>

      <h3 class="section" id="list-heading" hidden></h3>
      <div class="register" id="register">
        <!-- The captions are for the eye; every cell in a row still says what it is to a screen reader. -->
        <div class="reg-head" id="reg-head" aria-hidden="true"><span id="col-id"></span><span id="col-status"></span><span id="col-facts"></span><span class="r" id="col-value"></span></div>
        <ul class="rows" id="rows" aria-label="Suppliers — who needs a person"></ul>
      </div>

      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>

      <section class="form" id="approver" hidden aria-label="Approve a proposed supplier">
        <h3 id="approve-heading"></h3>
        <p class="note" id="approve-none" hidden></p>
        <div class="grid" id="approve-fields">
          <div>
            <label for="approve-supplier" id="approve-supplier-label"></label>
            <select id="approve-supplier"></select>
          </div>
          <div>
            <label for="approve-reason" id="approve-reason-label"></label>
            <input id="approve-reason" type="text" autocomplete="off" aria-describedby="approve-reason-help" />
            <p class="help" id="approve-reason-help"></p>
          </div>
        </div>
        <button id="approve" class="act" type="button"></button>
      </section>
      <p class="note" id="no-approve" hidden></p>

      <section class="form" id="proposer" hidden aria-label="Add or update a supplier">
        <h3 id="propose-heading"></h3>
        <div class="grid">
          <div>
            <label for="propose-code" id="propose-code-label"></label>
            <input id="propose-code" type="text" autocomplete="off" aria-describedby="propose-code-help" />
            <p class="help" id="propose-code-help"></p>
          </div>
          <div>
            <label for="propose-name" id="propose-name-label"></label>
            <input id="propose-name" type="text" autocomplete="organization" />
          </div>
          <div>
            <label for="propose-gstin" id="propose-gstin-label"></label>
            <input id="propose-gstin" type="text" autocomplete="off" />
          </div>
          <div>
            <label for="propose-phone" id="propose-phone-label"></label>
            <input id="propose-phone" type="tel" autocomplete="tel" />
          </div>
          <div>
            <label for="propose-email" id="propose-email-label"></label>
            <input id="propose-email" type="email" autocomplete="email" />
          </div>
          <div>
            <label for="propose-terms" id="propose-terms-label"></label>
            <input id="propose-terms" type="text" inputmode="numeric" autocomplete="off" />
          </div>
        </div>
        <button id="propose" class="act" type="button"></button>
      </section>
      <p class="note" id="no-propose" hidden></p>

      <p class="result" id="result" hidden role="status" aria-live="polite"><span class="icon" id="result-icon" aria-hidden="true"></span><span id="result-text"></span></p>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./suppliers.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
