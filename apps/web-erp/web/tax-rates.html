<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE GST and cess rates</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      GST and cess rates (Round 4a · M03-FR-03 "HSN/tax … tax change with Finance approval" · A6 · A7 · re-audit G-1). A THIN
      CLIENT over head office's effective-dated rate schedules per HSN class: the GST rate (/v1/catalogue/tax-classes/:hsn/
      rates/:from) and the compensation cess (…/cess/:from). The first rate of a class is set by the person who keeps the
      catalogue; a CHANGE — a new rate from a later date — waits for a Finance approver (the accountant or the owner, never
      the person asking), asked here and given on the approver's own Approvals page. A rate is never overwritten or
      back-filled: a change is a new period. Every refusal is head office's; nothing is written on open.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; }
      h3 { margin: 0; font-size: 16px; }
      p.lead { margin: 0; color: var(--muted); font-size: 15px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; }
      input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; align-items: end; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; padding: 0 16px; }
      button.primary { background: var(--accent); color: var(--on-accent); border: 0; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
      .panel { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); display: grid; gap: 2px; min-width: 0; }
      .panel .k { color: var(--muted); font-size: 14px; }
      .panel .v { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
      .panel .v.unknown { color: var(--warn); font-size: 16px; }
      fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; min-width: 0; margin: 0; }
      legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
      table { width: 100%; border-collapse: collapse; }
      .table-wrap { overflow-x: auto; max-width: 100%; }
      td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
      tr[data-id] { cursor: pointer; }
      td.unknown { color: var(--warn); }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .rows li { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); overflow-wrap: anywhere; font-size: 15px; }
      .status { font-size: 15px; min-height: 20px; margin: 0; }
      .status.good { color: var(--ok); } .status.err { color: var(--danger-text); }
      .muted { color: var(--muted); font-size: 14px; margin: 0; }
      .nobody { background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; margin: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title">GST and cess rates</h1>
      <span class="sync">
        <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
      </span>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section aria-labelledby="page-h">
        <h2 id="page-h">GST and cess rates</h2>
        <p class="lead" id="lead"></p>
        <div class="panels" role="status" aria-live="polite">
          <div class="panel"><span class="k" id="k-classes">Tax classes in use</span><span class="v" id="v-classes">—</span></div>
          <div class="panel"><span class="k" id="k-norate">With no GST rate today</span><span class="v" id="v-norate">—</span></div>
          <div class="panel"><span class="k" id="k-cess">With a cess today</span><span class="v" id="v-cess">—</span></div>
        </div>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="list-h">
        <h3 id="list-h">Tax classes</h3>
        <p class="lead" id="list-lead"></p>
        <div class="table-wrap"><table aria-labelledby="list-h">
          <thead><tr><th id="c-hsn">HSN</th><th id="c-products">Products</th><th id="c-gst">GST today</th><th id="c-cess">Cess today</th><th id="c-next">Next change</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <form class="row" id="pick">
          <label for="hsn"><span id="l-hsn">HSN code (4 to 8 digits)</span><input id="hsn" inputmode="numeric" autocomplete="off" /></label>
          <button id="open" type="submit">Open this class</button>
        </form>
      </section>

      <section id="record" aria-labelledby="record-h" hidden>
        <h3 id="record-h"></h3>
        <fieldset>
          <legend id="gst-h">GST rate</legend>
          <ul class="rows" id="gst-list" aria-label="GST rate periods"></ul>
          <div class="row">
            <label for="g-from"><span id="l-g-from">From (date)</span><input id="g-from" type="date" /></label>
            <label for="g-rate"><span id="l-g-rate">Rate (%)</span><input id="g-rate" inputmode="decimal" autocomplete="off" /></label>
            <button id="g-save" class="primary" type="button">Record the GST rate</button>
          </div>
        </fieldset>
        <fieldset>
          <legend id="cess-h">Compensation cess</legend>
          <ul class="rows" id="cess-list" aria-label="Cess periods"></ul>
          <div class="row">
            <label for="c-from"><span id="l-c-from">From (date)</span><input id="c-from" type="date" /></label>
            <label for="c-adv"><span id="l-c-adv">Ad valorem (%)</span><input id="c-adv" inputmode="decimal" autocomplete="off" /></label>
            <label for="c-spec"><span id="l-c-spec">Specific (₹ per block, 0 for none)</span><input id="c-spec" inputmode="decimal" autocomplete="off" /></label>
            <label for="c-per"><span id="l-c-per">Block (units, e.g. 1000 sticks)</span><input id="c-per" inputmode="numeric" autocomplete="off" /></label>
            <button id="c-save" type="button">Record the cess</button>
          </div>
        </fieldset>
        <div class="row">
          <label for="why"><span id="l-why">Why (for the Finance approver)</span><input id="why" autocomplete="off" maxlength="300" /></label>
          <button id="ask" type="button" hidden>Ask Finance to approve</button>
        </div>
        <p class="status" id="record-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./tax-rates.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
