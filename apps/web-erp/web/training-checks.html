<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Training checks</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Training checks (W3 · OB-675 · QG-02 · roadmap §2.3). A THIN CLIENT over head office's scored check per role: the
      reading per role (GET /v1/hr/workforce/role-checks), set a role's check (POST …/role-checks/:roleId), the owner's pass
      mark (POST …/:roleId/pass-mark) and record an attempt item by item (POST …/:roleId/attempts/:attemptId).
      Its session is apps/web-erp/src/training-checks-session.ts.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1080px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; box-sizing: border-box; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h2 { margin: 0; font-size: 17px; } h3 { margin: 0; font-size: 16px; } h4 { margin: 0; font-size: 15px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
      input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; box-sizing: border-box; }
      textarea { min-height: 96px; resize: vertical; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
      button.quiet { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .row-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      .row-form > label { flex: 1 1 180px; }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      ul.rows > li { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; border-left: 6px solid var(--degraded); overflow-wrap: anywhere; }
      ul.rows > li[data-final="passed"] { border-left-color: var(--ok, var(--accent)); }
      ul.plain { margin: 0; padding-left: 20px; }
      .ticks label { display: flex; gap: 8px; align-items: center; font-weight: 400; min-height: var(--tap); }
      .ticks input[type=checkbox] { min-height: 24px; width: 24px; }
      .meta { font-size: 14px; color: var(--muted); margin: 0; }
      .verdict { font-weight: 700; margin: 0; }
      .status { font-size: 14px; min-height: 20px; margin: 0; }
      details { border-top: 1px solid var(--line); padding-top: 8px; }
      summary { cursor: pointer; font-weight: 600; min-height: var(--tap); display: flex; align-items: center; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="title"><span id="title-text">Training checks</span> <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <section id="page-intro" aria-labelledby="page-h">
        <h2 id="page-h">Training checks</h2>
        <p class="lead" id="lead"></p>
        <p class="status" id="page-status" role="status" aria-live="polite"></p>
      </section>
      <section id="reading" hidden aria-labelledby="reading-h">
        <h3 id="reading-h"></h3>
        <button id="refresh" type="button" class="quiet sre-btn sre-btn-quiet"><span id="refresh-text"></span></button>
        <p class="meta" id="as-at"></p>
        <ul class="rows" id="roles"></ul>
      </section>
    </main>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./training-checks.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
