<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Transfers</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Transfers (WF-07 · M09-FR-03 · M08-FR-02/03 · §28). A THIN CLIENT over head office's transfer routes: the register
      (GET /v1/warehouse/transfers), SEND a proposed transfer (an empty body — the sender is the approver and cannot be the
      proposer; the stock and its cost are head office's), COUNT IT IN at the destination (what arrived; a shortfall is a
      valued exception), and SETTLE a shortfall (what turned up, where, and why the rest is gone — by a third person). No
      cost, approver or stock figure is typed here. Words and requests: apps/web-erp/src/transfers-session.ts.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <script src="./sre-icons.js" defer></script>
    <style>
      :root { --tap: 48px; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); min-height: 100dvh; display: flex; flex-direction: column; }
      main { width: min(1100px, 100%); margin: 0 auto; padding: 16px; display: grid; gap: 16px; align-content: start; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
      h3 { margin: 0; font-size: 17px; }
      p.lede { margin: 0; color: var(--muted); font-size: 14px; }
      label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
      input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: var(--tap); min-width: 0; }
      textarea { min-height: 72px; }
      fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0; display: flex; gap: 8px 16px; flex-wrap: wrap; }
      fieldset label { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; min-height: var(--tap); }
      fieldset input { min-height: auto; width: 20px; height: 20px; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
      button { font: inherit; font-weight: 600; min-height: var(--tap); border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; padding: 0 16px; }
      button.quiet { background: var(--line); color: var(--ink); }
      button[disabled] { opacity: .5; cursor: not-allowed; }
      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
      .panel b { font-size: 22px; font-variant-numeric: tabular-nums; } .panel span { color: var(--muted); font-size: 14px; }
      table { width: 100%; border-collapse: collapse; }
      td, th { text-align: left; padding: 8px 10px; vertical-align: top; overflow-wrap: anywhere; }
      .tone-ok { border-left: 6px solid var(--ok); } .tone-degraded { border-left: 6px solid var(--degraded); } .tone-idle { border-left: 6px solid var(--idle); } .tone-error { border-left: 6px solid var(--error); }
      ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      ul.rows li { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: var(--bg); }
      .inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
      .status { font-size: 14px; min-height: 20px; margin: 0; }
      .status.good { color: var(--good); } .status.err { color: var(--danger-text); }
      .nobody { background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; margin: 0; }
      .muted { color: var(--muted); font-size: 14px; }
      .drawer-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="who" id="who">Transfers</h1>
      <span class="sync">
        <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
      </span>
    </header>
    <!--SCREEN-DATA-->
    <p class="nobody" id="nobody" hidden></p>
    <main>
      <div>
        <h2 id="title">Transfers</h2>
        <p class="lead" id="lede"></p>
      </div>

      <div class="panels" role="status" aria-live="polite">
        <div class="panel"><b id="n-proposed">–</b><span id="p-proposed">Waiting</span></div>
        <div class="panel"><b id="n-in_transit">–</b><span id="p-in_transit">On the road</span></div>
        <div class="panel"><b id="n-received">–</b><span id="p-received">Received</span></div>
        <div class="panel"><b id="n-short">–</b><span id="p-short">Shortfall open</span></div>
      </div>

      <section aria-labelledby="reg-h">
        <h3 id="reg-h">Transfers</h3>
        <p class="lede" id="reg-lede"></p>
        <p class="status" id="list-status" role="status" aria-live="polite"></p>
        <table id="register" aria-labelledby="reg-h">
          <thead><tr><th id="c-transfer">Transfer</th><th id="c-route">Route</th><th id="c-lines">Lines</th><th id="c-state">State</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <div class="sheet" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
      <div class="sheet-inner">
        <div class="drawer-head"><h3 id="d-title"></h3><button class="quiet" id="d-close" type="button">✕</button></div>
        <p id="d-state"></p>
        <p class="muted" id="d-route"></p>
        <p class="muted" id="d-people"></p>
        <p class="status" id="d-status" role="status" aria-live="polite"></p>
        <h3 id="d-lines-h">Lines</h3>
        <ul class="rows" id="d-lines"></ul>
        <div id="d-dispatch-box" hidden>
          <p class="lede" id="d-dispatch-note"></p>
          <button id="d-dispatch" type="button">Send it</button>
        </div>
        <!-- OB-288 lane 2 · WF-07: withdraw a transfer before it leaves — a compensating event with a reason; refused after dispatch. -->
        <div id="d-cancel-box" hidden>
          <h3 id="d-cancel-h">Cancel it</h3>
          <p class="lede" id="d-cancel-note"></p>
          <label for="d-cancel-reason" id="l-d-cancel-reason">Why it is being cancelled</label>
          <input id="d-cancel-reason" type="text" autocomplete="off">
          <button id="d-cancel" type="button">Cancel this transfer</button>
        </div>
        <div id="d-receive-box" hidden>
          <h3 id="d-receive-h">Count it in</h3>
          <p class="lede" id="d-receive-note"></p>
          <ul class="rows" id="d-receive-lines"></ul>
          <button id="d-receive" type="button">Record what arrived</button>
        </div>
        <div id="d-short-box" hidden>
          <h3 id="d-short-h">Shortfall</h3>
          <ul class="rows" id="d-short"></ul>
        </div>
        <div id="d-resolve-box" hidden>
          <h3 id="d-resolve-h">Settle the shortfall</h3>
          <p class="lede" id="d-resolve-note"></p>
          <label for="d-reason-code"><span id="l-d-reason-code">Why</span><select id="d-reason-code"></select></label>
          <label for="d-note"><span id="l-d-note">Note</span><input id="d-note" autocomplete="off" /></label>
          <button id="d-resolve" type="button">Settle it</button>
        </div>
      </div>
    </div>
    <script src="./web-erp.bundle.js" type="module"></script>
    <script type="module" src="./transfers.js"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
