<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Products nobody can sell</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Products nobody can sell — what the till refuses or was never given, and why (SP-8c-ii, F08, P-08, M03-FR-03,
      M10-FR-04, G5c). The store box builds the till's catalogue from the pack and EXCLUDES every product the lane cannot
      judge (no tax rate, no status, a unit it cannot price) and ships a recalled one WITH its block; that list reached the
      till payload and no screen ever showed it. This page shows it from the SAME function the till is built with, grouped
      by reason, each with what to do, in both languages. Read-only: the fix is made on the Products screen and published
      again. Every rule lives in the tested session model (apps/web-erp/src/unsellable-session.ts), attached as
      window.unsellableSession. No prompt/confirm/alert; nothing runs on a timer.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      .sample,.stale { margin:0; padding:10px 16px; font-size:15px; font-weight:600; }
      .sample[hidden],.stale[hidden] { display:none; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:960px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      h3 { margin:8px 0 0; font-size:16px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .bar { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; justify-content:space-between; }
      .asof { color:var(--muted); font-size:14px; } .summary { font-size:15px; font-weight:600; }
      .lang:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
      section.group { background:var(--panel); border-radius:12px; padding:14px; display:grid; gap:10px; border-left:6px solid var(--degraded); }
      section.group.tone-error { border-left-color:var(--error); }
      section.group .head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
      .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:15px; }
      .status .icon { font-size:18px; width:1.4em; text-align:center; }
      p.todo { margin:0; font-size:14px; color:var(--muted); } p.todo strong { color:var(--ink); }
      ul.rows { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
      li.row { display:grid; gap:2px; padding:8px 10px; background:var(--bg); border-radius:10px; }
      li.row .name { font-weight:600; } li.row .name .id { color:var(--muted); font-weight:400; font-size:14px; margin-left:6px; }
      li.row .detail { font-size:13px; color:var(--muted); }
      p.state { margin:0; padding:12px 16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>

    <header>
      <h1 class="who" id="who">Products nobody can sell <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Products nobody can sell</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="bar">
        <span class="asof" id="asof" role="status" aria-live="polite"></span>
        <span class="summary" id="summary" role="status" aria-live="polite"></span>
      </div>

      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>

      <div id="groups" aria-label="Products nobody can sell, by reason"></div>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./unsellable.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
