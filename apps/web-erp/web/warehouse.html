<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Warehouse — Supervision</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Warehouse supervisor's surface (M09 / OA-9). The OVERSIGHT half of the dual-interface
      warehouse: where the handheld executes (receive, put away), this one watches — bin
      configuration and occupancy, stock visibility, and the exception queue. It reads the
      SAME warehouse data the handheld does and reuses the SAME rules, so the floor and the
      office can never show different numbers. Read-only in this first slice; the supervisory
      write actions (approvals, task assignment, transfer planning) follow.

      It keeps the box's one rule: a section the box was never sent is shown as NOT KNOWN,
      never as an empty (healthy) warehouse (P-08).
    -->
    <style>
      :root {
        --bg: #0f172a; --panel: #1e293b; --ink: #f8fafc; --muted: #94a3b8;
        --good: #22c55e; --warn: #f59e0b; --danger: #ef4444; --info: #38bdf8;
        --line: #334155;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100dvh; display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; padding: 12px 16px; background: var(--panel); flex-wrap: wrap;
      }
      .who { font-weight: 600; }
      .who small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
      .lang { background: transparent; color: var(--muted); min-height: 40px; font-size: 14px; border: 0; }
      .sample { background: var(--warn); color: #451a03; padding: 8px 16px; font-weight: 600; font-size: 15px; margin: 0; }
      .sample[hidden] { display: none; }
      /* Served from this device's cache because the store box could not be reached — it says WHEN (P-08). */
      .stale { background: #1e3a5f; color: #dbeafe; padding: 8px 14px; font-size: 15px; margin: 0; border-bottom: 2px solid var(--info); }
      .stale[hidden] { display: none; }

      main { flex: 1; padding: 16px; display: grid; gap: 20px; align-content: start; max-width: 960px; }
      h2 { margin: 0 0 4px; font-size: 20px; }
      p.lead { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
      /* "I have not been told" is not "all clear" — said plainly, never a blank table (P-08). */
      .notknown { background: #422006; color: #fde68a; padding: 10px 14px; border-radius: 10px; font-size: 15px; }

      table { width: 100%; border-collapse: collapse; font-size: 15px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 600; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      tr.over td { color: var(--warn); }

      .ex { display: grid; gap: 8px; }
      .ex .row {
        border-left: 6px solid var(--danger); background: var(--panel); border-radius: 10px;
        padding: 10px 12px; display: grid; gap: 2px;
      }
      .ex .row.over_capacity { border-left-color: var(--warn); }
      .ex .kind { font-weight: 700; }
      .ex .detail { color: var(--muted); font-size: 14px; }
      .ex-empty { color: var(--good); font-weight: 600; }

      /* Approvals queue */
      .appr { display: grid; gap: 10px; }
      .appr .row { background: var(--panel); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
      .appr .subject { font-weight: 600; }
      .appr .blocked { color: var(--warn); font-size: 14px; }
      .appr .buttons { display: flex; gap: 10px; }
      .appr button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; }
      .appr button.approve { background: var(--good); color: #052e16; }
      .appr button.reject { background: var(--danger); color: #fff; }

      /* Reason picker — on-screen choices, never a browser prompt. */
      .sheet { position: fixed; inset: 0; background: rgba(2, 6, 23, .86); display: grid; place-items: center; z-index: 20; padding: 16px; }
      .sheet[hidden] { display: none; }
      .sheet-inner { width: min(520px, 100%); background: var(--panel); padding: 18px; border-radius: 16px; display: grid; gap: 10px; }
      .sheet h3 { margin: 0; font-size: 18px; }
      .choices { display: grid; gap: 8px; }
      .choices button { min-height: 48px; text-align: left; padding: 0 16px; border: 0; border-radius: 10px; background: var(--line); color: var(--ink); font-size: 15px; }
      .sheet-cancel { min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 15px; }
      .toast { position: fixed; inset: auto 0 16px 0; margin: 0 auto; width: max-content; max-width: 90%; background: var(--panel); color: var(--ink); padding: 12px 18px; border-radius: 12px; z-index: 30; border-left: 6px solid var(--good); }
      .toast[hidden] { display: none; }
      .toast.bad { border-left-color: var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <span class="who" id="who">—<small id="store">—</small></span>
      <button class="lang" id="lang" type="button" aria-label="Language">EN / த</button>
    </header>

    <p class="sample" id="sample" hidden role="status">Sample data — this is not the shop's own warehouse.</p>
    <p class="stale" id="stale" hidden role="status"></p>

    <main>
      <section>
        <h2 id="bins-heading">—</h2>
        <p class="lead" id="bins-lead"></p>
        <div id="bins"></div>
      </section>

      <section>
        <h2 id="stock-heading">—</h2>
        <div id="stock"></div>
      </section>

      <section>
        <h2 id="ex-heading">—</h2>
        <div id="exceptions"></div>
      </section>

      <section>
        <h2 id="appr-heading">—</h2>
        <div id="approvals"></div>
      </section>
    </main>

    <!-- Reason picker for a decision. On-screen choices only — never prompt/confirm/alert. -->
    <div class="sheet" id="reason-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="reason-title">
      <div class="sheet-inner">
        <h3 id="reason-title">—</h3>
        <div class="choices" id="reason-choices"></div>
        <button class="sheet-cancel" id="reason-cancel" type="button">Cancel</button>
      </div>
    </div>

    <p class="toast" id="toast" hidden role="status"></p>

    <!--
      The store box puts this screen's data here, above the bundle, because the bundle
      reads its global while it evaluates.
    -->
    <!--SCREEN-DATA-->
    <script type="module" src="./web-erp.bundle.js"></script>
    <script type="module" src="./warehouse.js"></script>
  </body>
</html>
