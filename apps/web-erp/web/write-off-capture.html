<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SRE Record a loss</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#192f27" />
    <!--
      Write-off CAPTURE desk — the shop-floor "record a loss" screen (M28-FR-01, API-04, §28, P-02, P-03).
      Every rule lives in the tested session model (apps/web-erp/src/write-off-capture-session.ts), attached as
      window.writeOffCaptureSession and built on the shared packages/ui primitives. The operator picks the item,
      the quantity and value, a CHOSEN loss-type chip (never free text), and captures a photo/witness for a big
      loss. A big loss is never recorded on a typed name (ADR-0024): the raiser writes why and asks for approval,
      a SECOND person who handles stock approves it on their own Approvals page, and "Record the loss" sends it
      naming that approval. Asking and recording are HUMAN acts in the raiser's own name that run ONLY on an
      explicit click, never on load; the session says plainly why not (not asked, waiting, rejected, expired,
      used, changed) and sends nothing, and the server re-checks all of it and records the loss in the caller's
      own name via POST /v1/inventory/write-off/:id. Offline the screen shows its sample stand-in.
    -->
    <link rel="stylesheet" href="./sre-foundation.css" />
    <style>
      :root { --tap:48px; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); min-height:100dvh; display:flex; flex-direction:column; }
      main { flex:1; padding:16px; display:grid; gap:16px; align-content:start; max-width:760px; width:100%; }
      h2 { margin:0 0 4px; font-size:20px; } p.lead { margin:0 0 4px; color:var(--muted); font-size:15px; }
      .capturer { background:var(--panel); border-radius:12px; padding:14px; display:grid; gap:12px; }
      .capturer label { font-size:14px; color:var(--muted); display:block; margin-bottom:4px; }
      .capturer input { width:100%; min-height:var(--tap); padding:0 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
      .capturer textarea { width:100%; min-height:72px; padding:10px 12px; font:inherit; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); resize:vertical; }
      .row2 { display:grid; grid-template-columns:2fr 1fr; gap:12px; }
      fieldset { border:0; margin:0; padding:0; }
      .chips { display:flex; gap:8px; flex-wrap:wrap; }
      button.chip { min-height:var(--tap); padding:0 16px; border:2px solid var(--line); border-radius:999px; font-size:15px; font-weight:600; background:var(--bg); color:var(--ink); }
      button.chip.chosen { border-color:var(--info); background:var(--info-surface); color:var(--on-info-surface); }
      button.chip.chosen::before { content:'✓ '; }
      .material-hint { margin:0; padding:10px 12px; border-radius:10px; background:var(--bg); font-size:14px; display:inline-flex; gap:8px; align-items:center; }
      .material-hint .icon { font-size:16px; }
      .material-hint.tone-degraded { border-left:4px solid var(--degraded); } .material-hint.tone-idle { border-left:4px solid var(--idle); color:var(--muted); }
      .material-hint[hidden] { display:none; }
      .threshold { font-size:13px; color:var(--muted); }
      /* One primary action at a time (design system §1 rule 3): the next step is filled, the other is outlined. */
      button.act { min-height:var(--tap); padding:0 16px; border:2px solid var(--line); border-radius:10px; font-size:16px; font-weight:700; background:var(--bg); color:var(--ink); }
      button.act.primary { border-color:var(--degraded); background:var(--degraded); color:var(--on-warn); }
      /* A big loss's two-person step: write why, then ask — the second person approves on their own Approvals page. */
      .approval-step { display:grid; gap:12px; padding:12px; border-radius:10px; background:var(--bg); border-left:4px solid var(--degraded); }
      .approval-step[hidden] { display:none; }
      .approval-step p.lead { margin:0; font-size:14px; }
      button:disabled { opacity:0.6; }
      button.act:focus-visible, button.carry:focus-visible, button.chip:focus-visible, input:focus-visible, textarea:focus-visible, .lang:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
      /* The raiser's own requests still in play — carry one on to record it once it is approved. */
      .losses { background:var(--panel); border-radius:12px; padding:14px; display:grid; gap:10px; }
      .losses h3 { margin:0; font-size:17px; }
      .losses p.lead { margin:0; font-size:14px; }
      .loss-requests { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
      .loss-request { display:grid; gap:6px; padding:12px; border-radius:10px; background:var(--bg); border:1px solid var(--line); }
      .loss-request p { margin:0; }
      .loss-summary { font-weight:600; }
      .loss-status { display:inline-flex; gap:8px; align-items:center; font-size:14px; }
      .loss-status.tone-ok { color:var(--ink); } .loss-status.tone-error { color:var(--danger-text); }
      .loss-why { font-size:14px; color:var(--muted); }
      button.carry { min-height:var(--tap); padding:0 16px; border:2px solid var(--info); border-radius:10px; font-size:15px; font-weight:600; background:var(--bg); color:var(--ink); justify-self:start; }
      p.result { margin:0; padding:12px 14px; border-radius:12px; background:var(--panel); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.result .icon { font-size:18px; }
      p.result.tone-ok { border-left:6px solid var(--ok); } p.result.tone-degraded { border-left:6px solid var(--degraded); } p.result.tone-error { border-left:6px solid var(--error); } p.result.tone-idle { border-left:6px solid var(--idle); }
      p.result[hidden] { display:none; }
      p.state { margin:0; padding:16px; background:var(--panel); border-radius:12px; color:var(--muted); font-size:15px; display:inline-flex; gap:8px; align-items:center; }
      p.state .icon { font-size:18px; } p.state.tone-error { color:var(--danger-text); }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <p class="stale" id="stale" hidden></p>
    <p class="sample" id="sample" hidden></p>
    <p class="nobody" id="nobody" hidden></p>

    <header>
      <h1 class="who" id="who">Record a loss <small id="whoami"></small></h1>
      <button class="lang" id="lang" type="button" aria-label="Switch language">தமிழ்</button>
    </header>

    <main>
      <div>
        <h2 id="title">Record a loss</h2>
        <p class="lead" id="lead"></p>
      </div>

      <section class="capturer" id="capturer" hidden aria-label="Record a stock write-off">
        <div>
          <label for="wo-product" id="product-label"></label>
          <input id="wo-product" type="text" autocomplete="off" />
        </div>
        <div>
          <label for="wo-location" id="location-label"></label>
          <input id="wo-location" type="text" autocomplete="off" />
        </div>
        <div class="row2">
          <div>
            <label for="wo-qty" id="qty-label"></label>
            <input id="wo-qty" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" />
          </div>
          <div>
            <label for="wo-uom" id="uom-label"></label>
            <input id="wo-uom" type="text" value="ea" autocomplete="off" />
          </div>
        </div>
        <div>
          <label for="wo-value" id="value-label"></label>
          <input id="wo-value" type="number" min="0" step="0.01" inputmode="decimal" autocomplete="off" />
          <!-- SF-05: head office's own value of the loss (quantity × its cost of the stock) — filled in, not typed. -->
          <p class="material-hint" id="value-hint" hidden role="status" aria-live="polite"><span class="icon" id="value-hint-icon" aria-hidden="true"></span><span id="value-hint-text"></span></p>
          <p class="threshold" id="threshold-hint"></p>
        </div>
        <fieldset>
          <label id="loss-type-label"></label>
          <div class="chips" id="loss-types" role="group" aria-label="Kind of loss"></div>
        </fieldset>
        <p class="material-hint" id="material-hint" hidden role="status" aria-live="polite"><span class="icon" id="material-hint-icon" aria-hidden="true"></span><span id="material-hint-text"></span></p>
        <div>
          <label for="wo-evidence" id="evidence-label"></label>
          <input id="wo-evidence" type="text" autocomplete="off" />
        </div>
        <!-- A big loss: the raiser writes why and asks; a second person who handles stock approves it on their own
             Approvals page. No approver's name is ever typed on this page. -->
        <div class="approval-step" id="approval-step" hidden>
          <p class="lead" id="approval-lead"></p>
          <div>
            <label for="wo-why" id="why-label"></label>
            <textarea id="wo-why" maxlength="300"></textarea>
          </div>
          <button id="ask" class="act" type="button"></button>
        </div>
        <button id="record" class="act primary" type="button"></button>
      </section>

      <p class="result" id="result" hidden role="status" aria-live="polite"><span class="icon" id="result-icon" aria-hidden="true"></span><span id="result-text"></span></p>
      <p class="state" id="state" hidden><span class="icon" id="state-icon" aria-hidden="true"></span><span id="state-text"></span></p>

      <section class="losses" id="your-losses" hidden aria-labelledby="your-losses-title">
        <h3 id="your-losses-title"></h3>
        <p class="lead" id="your-losses-lead"></p>
        <ul class="loss-requests" id="loss-requests"></ul>
      </section>
    </main>

    <!--SCREEN-DATA-->
    <script src="./web-erp.bundle.js" type="module"></script>
    <script src="./write-off-capture.js" type="module"></script>
    <!-- The one chrome every ERP page carries: sync badge, cache strip, language toggle (sre-chrome.js). -->
    <script type="module" src="./sre-chrome.js"></script>
  </body>
</html>
