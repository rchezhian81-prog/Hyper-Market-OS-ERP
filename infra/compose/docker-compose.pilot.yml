# Pilot overlay for the SRE Retail OS stack (non-production).
#
# Layers resource/capacity limits and pilot-safe restart policy on top of
# docker-compose.yml, WITHOUT changing the application. Isolation from any other
# stack comes from a distinct compose PROJECT NAME (separate volumes + network),
# and pilot secrets/config come from a separate env file — never committed.
#
# Bring the pilot up (from infra/compose/):
#   cp .env.pilot.example .env.pilot            # then fill in generated secrets
#   docker compose -p sre-pilot \
#     -f docker-compose.yml -f docker-compose.pilot.yml \
#     --env-file .env.pilot up -d
#
# Project name `sre-pilot` namespaces the volumes as `sre-pilot_db-data` /
# `sre-pilot_edge-data` — separate storage, separate database, separate from a dev
# stack on the same host. HTTPS: terminate TLS in front of the `web`/`api` ports
# (a reverse proxy or an nginx TLS server block); the pilot must not be reached over
# plain HTTP. See docs/pilot/SAFE-PILOT-ENVIRONMENT.md.

services:
  db:
    # Capacity limits so a runaway query cannot take the whole host.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  api:
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    environment:
      # Pilot posture, made explicit even though the base already defaults these.
      NODE_ENV: production
      MIGRATION_TARGET_KIND: rehearsal

  edge:
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256

  # Hosted demo front: HTTPS on :443 is the ONLY port published to the network. The base publishes
  # the web port on every interface (a store LAN needs that for its tills); on an internet-facing
  # host that would be plain HTTP past the firewall — Docker-published ports bypass UFW — so the
  # pilot REPLACES the list (`!override`) and keeps plain HTTP on localhost for standup:check only.
  # The certificate comes from the host (TLS_CERT_DIR, default /etc/sre-pilot/tls), never from git.
  web:
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    ports: !override
      - '127.0.0.1:${WEB_PORT:-8080}:80'
      - '${TLS_PORT:-443}:443'
    depends_on:
      - migrate
      - api
      - demo-login
    volumes: !override
      - ../../apps/pos/web:/usr/share/nginx/html/pos:ro
      - ../../apps/owner-app/web:/usr/share/nginx/html/owner:ro
      - ../../apps/web-erp/web:/usr/share/nginx/html/erp:ro
      - ../../apps/picker-app/web:/usr/share/nginx/html/picker:ro
      - ../../apps/delivery-app/web:/usr/share/nginx/html/delivery:ro
      - ../../apps/customer-app/web:/usr/share/nginx/html/customer:ro
      - ../../apps/warehouse-app/web:/usr/share/nginx/html/warehouse:ro
      - ../../apps/supplier-app/web:/usr/share/nginx/html/supplier:ro
      - ./nginx.pilot.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-/etc/sre-pilot/tls}:/etc/nginx/tls:ro

  # DEMO-ONLY sign-in (owner decision 27 Sep 2026, defect H-01) — exists ONLY in this pilot overlay;
  # the base (store) compose file has no such service, so a store stack cannot run it. It refuses to
  # start unless DEMO_LOGIN_ENABLED=1 and the tenant is the synthetic demo tenant
  # (PILOT_DEMO_TENANT in db/seed/pilot/dataset.ts — set EDGE_TENANT_ID to it in .env.pilot). No port is
  # published: it is reached only through the HTTPS front at /login/. Bundle it on the box first:
  #   pnpm run build:demo-login     (writes infra/pilot/demo-login/dist/demo-login.mjs)
  # Logins are added by a person on the box:
  #   pnpm run demo-login:add -- --login <name> --user <pilot-user> --by "<your name>"
  demo-login:
    image: node:22-alpine
    restart: unless-stopped
    command: ['node', '/app/demo-login.mjs', 'serve']
    user: '1000:1000'
    environment:
      DEMO_LOGIN_ENABLED: '1'
      DEMO_TENANT_ID: ${EDGE_TENANT_ID}
      MIGRATION_TARGET_KIND: ${MIGRATION_TARGET_KIND:-rehearsal}
      IDP_SIGNING_KEY: ${IDP_SIGNING_KEY}
      IDP_ISSUER: ${IDP_ISSUER}
      IDP_AUDIENCE: ${IDP_AUDIENCE}
      DEMO_LOGIN_FILE: /etc/demo-login/logins.json
      PORT: '8090'
    volumes:
      - ../pilot/demo-login/dist:/app:ro
      # The DIRECTORY, not the file: logins are replaced atomically (write + rename), and a single-file
      # bind mount would keep showing the container the old file forever.
      - ${DEMO_LOGIN_DIR:-/etc/sre-pilot/demo-login}:/etc/demo-login:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
