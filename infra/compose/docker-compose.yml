# SRE Retail OS — pilot / store-edge stack (ADR-0002, §19 "containers, IaC, CI/CD").
#
# This brings the whole system up on ONE machine with one command: PostgreSQL, the
# schema migrations, and the app shells served over HTTP. It is deliberately
# VENDOR-NEUTRAL — it runs on a shop back-office PC, a laptop, or any cloud VM — so
# standing up a pilot does NOT pre-empt the owner's cloud-vendor decision (ADR-0002
# item 4 stays open). The same containers are what the managed cloud tier runs later.
#
# Usage (see docs/runbooks/pilot-deployment.md for the plain-English guide):
#   cp .env.example .env      # then edit .env and set a real database password
#   docker compose up -d
#
# No credential is stored in this file or in git — every secret comes from .env,
# which is git-ignored (hard rule #4).

name: sre-retail-os

services:
  # ---------------------------------------------------------------------------
  # The database. Managed PostgreSQL replaces this service in the cloud tier; the
  # schema and the application are identical either way (P-06 portability).
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The NON-superuser application role db-init creates on first boot (see the volume below).
      APP_DB_USER: ${APP_DB_USER:-sre_app}
      # The identity server's own login and schema (ADR-0019), created on first boot only when a password is given.
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-sre_keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      # Deterministic collation, so ordering is identical on every machine.
      LANG: C.UTF-8
    volumes:
      - db-data:/var/lib/postgresql/data
      # First-boot role setup: creates the NON-superuser application role the API connects as. PostgreSQL
      # superusers bypass row-level security (db/migrations/0012), so POSTGRES_USER is for administration
      # only and the API refuses to start on it. Runs once, when the volume is first initialised.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to localhost only — the database is never exposed to the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # One-shot: create the schema by running db/migrations in order. Idempotent —
  # re-running applies only what is new (scripts/migrate.mjs), so it is safe to
  # run on every deploy.
  #
  # It runs the SAME image the API is built from, because that image already
  # carries `scripts/migrate.mjs`, the `db/migrations` and — the part that matters —
  # `node_modules` with `pg`. A bare `node:22-alpine` with the repo mounted has no
  # `node_modules`, so `import('pg')` fails on a fresh deploy (and in CI, which does
  # not install dependencies): migrations that only run where somebody happened to
  # have installed the tree are not migrations you can deploy.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Comes from the git-ignored .env — the same way the cloud tier injects it,
      # so no connection string is ever written into a committed file.
      DATABASE_URL: ${DATABASE_URL}
    command: ['node', 'scripts/migrate.mjs']
    restart: 'no'


  # ---------------------------------------------------------------------------
  # The cloud API — all thirteen domain services (API-01…13) on one router, one
  # port. It REFUSES TO START if any secret is missing, still the placeholder from
  # .env.example, or too short: a service that boots with a default signing key is
  # a service running in production with a default signing key.
  #
  # Liveness and readiness are separate on purpose. A database it cannot reach
  # makes it NOT READY (take it out of rotation) and still LIVE (do not restart
  # it), because restarting will not reconnect the database and a crash loop hides
  # the outage that caused it.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Signs the catalogue packs the lanes trade on. Generate with:
      #   openssl rand -base64 48
      PACK_SIGNING_KEY: ${PACK_SIGNING_KEY}
      # Whose tokens to believe. The API verifies; it never issues and never
      # stores a credential (hard rule #4). Missing any of these three and it
      # does not start.
      IDP_SIGNING_KEY: ${IDP_SIGNING_KEY}
      IDP_ISSUER: ${IDP_ISSUER}
      IDP_AUDIENCE: ${IDP_AUDIENCE}
      # The self-hosted identity server (ADR-0019), when it runs: its realm's address and its published public keys.
      # Both or neither; empty = the pilot sign-in only. Public keys only — the API can check a sign-in, never make one.
      IDP_OIDC_ISSUER: ${IDP_OIDC_ISSUER:-}
      IDP_OIDC_JWKS_URL: ${IDP_OIDC_JWKS_URL:-}
      # One realm per shop (OB-15-d · OB-19): the shop the first realm signs for, and every further shop's realm=tenant.
      IDP_OIDC_TENANT_ID: ${IDP_OIDC_TENANT_ID:-}
      IDP_OIDC_SHOP_REALMS: ${IDP_OIDC_SHOP_REALMS:-}
      # Head office's provisioner at the identity server (OB-15-c): the secret that server generated for sre-provisioner,
      # copied by the administrator. Empty = people's sign-ins are given at the identity server by hand.
      IDP_PROVISIONER_SECRET: ${IDP_PROVISIONER_SECRET:-}
      PORT: '8081'
      NODE_ENV: production
      # Never 'production' unless the migration really is running against live data.
      MIGRATION_TARGET_KIND: ${MIGRATION_TARGET_KIND:-rehearsal}
    ports:
      - '127.0.0.1:${API_PORT:-8081}:8081'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8081/livez || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    # Drain rather than kill: an in-flight request cut off is a sale that reached
    # the process and not the database, while the till believes it was delivered.
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # The store edge — the box in the back office that lets the shop keep trading.
  #
  # It has NO depends_on and NO cloud settings that are required. That is the whole
  # point of P-01: bring this up on its own, with the API stopped and the network
  # unplugged, and the shop still sells. Give it CLOUD_API_URL and CLOUD_API_TOKEN
  # and it will also drain its queue to the cloud when there is a line; leave them
  # out and it says so plainly rather than pretending.
  #
  # No ports are published. The edge is not a service anybody calls — it owns a disk
  # and drains a queue — and the way to be sure nothing can reach it is to publish
  # nothing.
  # ---------------------------------------------------------------------------
  edge:
    build:
      context: ../..
      dockerfile: infra/docker/edge.Dockerfile
    restart: unless-stopped
    environment:
      EDGE_DATA_DIR: /var/lib/sre-edge
      EDGE_TENANT_ID: ${EDGE_TENANT_ID}
      # The same key the cloud signs packs with — the edge VERIFIES with it, which is
      # how a lane knows a price list came from us (hard rule #4: from .env only).
      PACK_SIGNING_KEY: ${PACK_SIGNING_KEY}
      EDGE_CAPACITY_BYTES: ${EDGE_CAPACITY_BYTES:-10737418240}
      # Optional, and read by the sync loop only. Absent means "sell, queue, sync later".
      CLOUD_API_URL: ${CLOUD_API_URL:-}
      CLOUD_API_TOKEN: ${CLOUD_API_TOKEN:-}
      # The screens, for the public proxy (ADR-0018). Served on the container's PRIVATE compose address — not
      # loopback, which is why the edge's boot log says so out loud — and never published to the host: only
      # the `proxy` service reaches them, and it forwards ONE screen (`/customer/*`). The staff screens stay off
      # the public origin until a sign-in gate exists in front of them.
      EDGE_SCREEN_PORT: '8091'
      EDGE_SCREEN_HOST: '0.0.0.0'
      EDGE_APPS_DIR: apps
    volumes:
      # The one thing this container must be able to write is the one thing it must
      # never lose, so it is a named volume rather than the container's own layer.
      - edge-data:/var/lib/sre-edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Long, because stopping mid-drain loses nothing (an unacknowledged item stays
    # queued) but stopping mid-WRITE is the one thing worth waiting for.
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # The app shells (POS, owner, ERP) served as static files. Each shell is
  # offline-capable via its service worker, so a lane keeps working if this
  # container or the network goes away (hard rule #1).
  # ---------------------------------------------------------------------------
  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - migrate
    volumes:
      - ../../apps/pos/web:/usr/share/nginx/html/pos:ro
      - ../../apps/owner-app/web:/usr/share/nginx/html/owner:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Loopback only: the public front is the `proxy` service below; this stays for the stand-up check.
      - '127.0.0.1:${WEB_PORT:-8080}:80'

  # ---------------------------------------------------------------------------
  # The ONE public origin (ADR-0018): TLS terminated here, and everything a customer's browser
  # needs on one address — the customer app (`/customer/*`, served by the edge's screen server),
  # the API (`/v1/*`, `/livez`, `/readyz`) and customer sign-in (`/auth/*`). Staff screens are
  # NOT on it: a 404 by name, until a sign-in gate exists in front of them.
  #
  # A domain in SRE_PUBLIC_HOST gets a free certificate automatically (SRE_TLS = the email for
  # certificate notices); the box's public IP, or blank (= localhost only), gets a certificate the
  # proxy makes itself for exactly those names (browsers warn once — a synthetic demo, never real
  # customers). HTTP redirects to
  # HTTPS. The client address the API rate-limits on is OVERWRITTEN here from the connection, so a
  # caller cannot spoof it with a header. See infra/compose/Caddyfile.
  # ---------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - edge
    environment:
      # The names the certificate is made for: a domain, the box's public IP, or (blank) only this machine.
      SRE_PUBLIC_HOST: '${SRE_PUBLIC_HOST:-localhost, 127.0.0.1}'
      SRE_TLS: ${SRE_TLS:-internal}
      # The certificate served to a client that sends no server name (a bare-IP connection). Always a name in
      # SRE_PUBLIC_HOST — `localhost` by default.
      SRE_DEFAULT_SNI: ${SRE_DEFAULT_SNI:-localhost}
      # Customer sign-in: `auth-not-deployed` answers /auth/* with a 503 that says so (until the sign-in
      # service is deployed); `auth-upstream` forwards to SRE_AUTH_UPSTREAM.
      SRE_AUTH_ROUTE: ${SRE_AUTH_ROUTE:-auth-not-deployed}
      SRE_AUTH_UPSTREAM: ${SRE_AUTH_UPSTREAM:-auth:8082}
      # Staff screens on the public origin: `staff-not-public` (default) answers them 404 by name — they live on the
      # store box. Only the hosted DEMO's pilot overlay sets `staff-demo-gate`: forwarded to the demo front (`web`),
      # which lets them through behind the demo sign-in (ADR-0016 on ADR-0018). Never the default anywhere.
      SRE_STAFF_ROUTE: ${SRE_STAFF_ROUTE:-staff-not-public}
    ports:
      - '${HTTPS_PORT:-443}:443'
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # The self-hosted identity server (Keycloak, ADR-0019 · OB-15). OPT-IN while the pilot sign-in retires: it runs only
  # with `--profile identity`, so a stack that has not been given its settings is unchanged. It holds the passwords, the
  # second factors and the lockouts; the product holds none of them and signs nothing. Reached only through the proxy, at
  # /auth/ (SRE_AUTH_ROUTE=auth-upstream, SRE_AUTH_UPSTREAM=idp:8080); its admin console is refused at the proxy and is
  # reached by the administrator over an SSH tunnel to the private network only. Its tables live in their own schema.
  # The store's realm is imported from the repository on start (infra/keycloak/realm-sre-store.json) — no user and no
  # secret is in that file; people are created by the product's provisioning.
  # ---------------------------------------------------------------------------
  idp:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ['identity']
    restart: unless-stopped
    command: ['start', '--import-realm']
    depends_on:
      db:
        condition: service_healthy
    # Its settings are optional IN THIS FILE because Compose reads every service's settings even when this one is not
    # started; a required marker here would stop the whole stack for shops that do not run it. The identity server
    # itself refuses to start without its database password, administrator password and addresses (runbook).
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-sre_keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${SRE_IDP_PUBLIC_URL:-}
      KC_HEALTH_ENABLED: 'true'
      # The FIRST administrator, used once to set the identity server up and then replaced (runbook). From .env only.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # What the realm file reads: the screens' origin (sign-in returns there), the shop this realm is, our API's name.
      SRE_WEB_ORIGIN: ${SRE_WEB_ORIGIN:-}
      SRE_TENANT_ID: ${EDGE_TENANT_ID}
      SRE_API_AUDIENCE: ${IDP_AUDIENCE:-sre-retail-os-api}
    volumes:
      - ../keycloak/realm-sre-store.json:/opt/keycloak/data/import/realm-sre-store.json:ro
      # The sign-in page in the owner's look (OB-18), English and Tamil — the realm's loginTheme. Read-only; no script inline.
      - ../keycloak/themes/sre:/opt/keycloak/themes/sre:ro
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # The product's sign-in service (OB-15-b · ADR-0019), beside the identity server and OPT-IN with it
  # (`--profile identity`). The front door asks it "who is this?" for every screen: it sends a person to the identity
  # server, takes the one-time code back, keeps the session on the server (the browser holds a random id only), and
  # answers with the person and a current token. It holds no password and signs nothing. Its program is built on the
  # box first (`pnpm run build:sign-in` → services/identity/dist/sign-in.mjs). It publishes no port.
  # ---------------------------------------------------------------------------
  sign-in:
    image: node:22-alpine
    profiles: ['identity']
    restart: unless-stopped
    command: ['node', '/app/sign-in.mjs']
    user: '1000:1000'
    depends_on:
      - idp
    environment:
      SIGN_IN_ISSUER: ${IDP_OIDC_ISSUER:-}
      SIGN_IN_INTERNAL_ISSUER: http://idp:8080/auth/realms/sre-store
      SIGN_IN_ORIGIN: ${SRE_WEB_ORIGIN:-}
      SIGN_IN_CLIENT_ID: sre-web
      IDP_AUDIENCE: ${IDP_AUDIENCE:-sre-retail-os-api}
      API_INTERNAL_URL: http://api:8081
      PORT: '8092'
    volumes:
      - ../../services/identity/dist:/app:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 32

volumes:
  db-data:
  edge-data:
  caddy-data:
  caddy-config:
