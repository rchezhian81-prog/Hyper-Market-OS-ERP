# Serves the app shells. Static only — no application logic lives here.
server {
  listen 80;
  server_name _;

  # Service workers must not be cached, or a lane can be stuck on an old shell.
  location ~* /sw\.js$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    root /usr/share/nginx/html;
  }

  location /pos/  { root /usr/share/nginx/html; try_files $uri $uri/ /pos/index.html; }
  location /owner/ { root /usr/share/nginx/html; try_files $uri $uri/ /owner/index.html; }

  location = / { return 302 /pos/; }
}
