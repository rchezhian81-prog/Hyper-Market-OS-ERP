# DEMO ONLY (ADR-0016) — the relay to the demo store box's two LOOPBACK sockets.
#
# This container shares the edge container's network namespace (`network_mode: service:edge`), so it can
# reach the edge's 127.0.0.1-only lane socket — and its screen server, which in compose listens on the
# container's private address for the public proxy's /customer route (ADR-0018) — without the edge binding
# anything wider. It publishes NO host port: only the demo front reaches it (edge:8096), and the front
# forwards here only after the demo sign-in's `auth_request` says yes. Never used by a store (the base
# compose has no relay).

server {
  listen 8096;
  server_name _;
  server_tokens off;

  # The edge's screen server (EDGE_SCREEN_PORT 8091, the base compose setting): /store/<screen>/ → /<screen>/.
  # Its redirects (/pos → /pos/) are mapped back under /store/ so the browser stays on the relay path.
  location /store/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8091/;
    proxy_redirect / /store/;
    proxy_http_version 1.1;
    # The screen server draws every page's menu with the box's own paths (/counts/, /buying/). Through this relay the
    # box is mounted under /store, so it is told — and prefixes the menu's links — rather than the browser being sent
    # to /counts/ on the public origin, which does not exist there (RL-2, 4 Oct 2026).
    proxy_set_header X-Forwarded-Prefix /store;
    # The edge tells the manager's screen to post the day close / reopen to its own loopback lane
    # (`window.laneWriteBase`). In a store that is right — the screen runs on the box. For a remote demo
    # browser it would be the tester's own laptop, so the relay rewrites it to the same-origin, signed-in
    # `/store-lane` (the front forwards that to the lane only for a role that may sell).
    proxy_set_header Accept-Encoding "";
    sub_filter 'window.laneWriteBase = "http://127.0.0.1:8095"' 'window.laneWriteBase = "/store-lane"';
    sub_filter_once off;
  }

  # The till's lane socket (EDGE_LANE_PORT 8095): sales, returns, bill lookup. The front sends
  # /store-lane/… here as /lane/….
  location /lane/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    client_max_body_size 64k;
  }

  location / { return 404; }
}
