# Hosted demo-pilot web front (non-production). Mounted over the base nginx.conf by
# docker-compose.pilot.yml. Serves every app shell and terminates HTTPS in front of the API, so the
# browser talks to ONE origin: shells at /<shell>/, the API at /v1/.
#
# - :443 is the only port published to the network (docker-compose.pilot.yml); the certificate lives
#   on the host (TLS_CERT_DIR), never in git (hard rule #4). Self-signed is acceptable for the
#   synthetic demo; a CA certificate drops in at the same paths.
# - :80 is published on 127.0.0.1 only, for `pnpm run standup:check` on the box. It never reaches
#   the network, so the demo is never served over plain HTTP.
# - The database and the API's own port stay localhost-bound; the API is reached only through /v1/.

map $uri $sre_no_cache { default ""; ~*/sw\.js$ "no-cache, no-store, must-revalidate"; }

# DEMO-ONLY sign-in bridge (defect H-01). The demo sign-in (/login/) sets an HttpOnly, Secure,
# SameSite=Strict cookie holding the signed token; the shells call /v1/ same-origin with cookies and
# never send a token themselves. So for /v1/ ONLY: an explicit Authorization header wins; otherwise the
# cookie becomes `Authorization: Bearer <token>`; no cookie -> no header -> the API answers 401 as ever.
# The API still verifies every token itself — this only moves it from a cookie to a header.
map $cookie_sre_demo_session $sre_cookie_bearer { default "Bearer $cookie_sre_demo_session"; "" ""; }
map $http_authorization $sre_api_authorization { default $http_authorization; "" $sre_cookie_bearer; }
# The page path handed to the identity bridge: plain shell paths only, so nothing a request carries can
# be written into the HTML attribute (anything else becomes "", and the bridge then says nothing).
map $uri $sre_bridge_page { ~^/[a-z]+/(?:[a-z0-9-]+\.html)?$ $uri; default ""; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header Cache-Control $sre_no_cache always;

  location = / { return 302 /erp/; }
  location ~ ^/(pos|owner|erp|picker|delivery|customer|warehouse|supplier)/ {
    try_files $uri $uri/ /$1/index.html;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:5m;

  server_tokens off;
  add_header Cache-Control $sre_no_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Service workers must not be cached, or a lane can be stuck on an old shell (see nginx.conf).
  location = / { return 302 /erp/; }
  location ~ ^/(pos|owner|erp|picker|delivery|customer|warehouse|supplier)/ {
    try_files $uri $uri/ /$1/index.html;
    # DEMO-ONLY identity bridge (H-11): where a store edge would inject `window.<screen>Data`, load a
    # classic script from the demo sign-in instead. It carries ONLY the signed-in person's userId +
    # permissions (from the live API) for the pages that read their own data from /v1; for every other
    # page it says nothing. Classic, so it runs before the module bundle reads the global.
    sub_filter '<!--SCREEN-DATA-->' '<script src="/login/screen-data.js?page=$sre_bridge_page"></script>';
    sub_filter_once on;
  }

  # The API, same origin. The Authorization header and Idempotency-Key pass through unchanged; the
  # caller's address is forwarded so the per-IP rate limit and auth lockout key on the real client.
  location /v1/ {
    proxy_pass http://api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $sre_api_authorization;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 20m;
    proxy_read_timeout 60s;
  }

  # The DEMO-ONLY sign-in. Resolved at request time (Docker's DNS), so the front still starts — and
  # /login/ simply fails — if the demo-login service is absent.
  location /login {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_demo_login http://demo-login:8090;
    proxy_pass $sre_demo_login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 8k;
    # Own header set (so the server-level `Referrer-Policy: no-referrer` is NOT inherited here): under
    # no-referrer a browser posts the sign-in form with `Origin: null`, which the demo sign-in refuses
    # as cross-site. The service sets `Referrer-Policy: same-origin` itself; keep the other two here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
  }
}
