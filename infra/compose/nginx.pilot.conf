# Hosted DEMO front (non-production) — the `web` service of the pilot overlay, BEHIND the public proxy.
#
# Since 3 Oct 2026 this file terminates no TLS and publishes nothing new: the `proxy` service (Caddy,
# infra/compose/Caddyfile, ADR-0018) is the one public origin. With SRE_STAFF_ROUTE=staff-demo-gate the proxy
# forwards the staff shells, the demo sign-in (/login), the demo store box's relay (/store, /store-lane) and the
# /v1 calls that carry the demo session cookie to this server on the private compose network (web:80). The same
# server answers 127.0.0.1:8080 on the box for `standup:check` only.
#
# What it does (ADR-0016; defects H-01, H-11): serves every app shell behind the demo sign-in; injects the DEMO
# identity bridge; turns the demo session cookie into a bearer token for /v1 only; gates the demo store box.
#
# The client address. The proxy OVERWRITES X-Forwarded-For from the connection (a caller's own header never
# stands in for its address), so this server takes the client address from that one header — realip — and
# `$remote_addr` below is the real client: it is what the API's per-IP rate limit and sign-in lockout, and the
# demo sign-in's own failure throttle, key on. Only the proxy and the box's own loopback can reach this server
# (nothing publishes it to the network), so every peer is trusted for that header; the public network never is.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;

map $uri $sre_no_cache { default ""; ~*/sw\.js$ "no-cache, no-store, must-revalidate"; }

# DEMO-ONLY sign-in bridge (defect H-01). The demo sign-in (/login/) sets an HttpOnly, Secure,
# SameSite=Strict cookie holding the signed token; the shells call /v1/ same-origin with cookies and
# never send a token themselves. So for /v1/ ONLY: an explicit Authorization header wins; otherwise the
# cookie becomes `Authorization: Bearer <token>`; no cookie -> no header -> the API answers 401 as ever.
# The API still verifies every token itself — this only moves it from a cookie to a header.
map $cookie_sre_demo_session $sre_cookie_bearer { default "Bearer $cookie_sre_demo_session"; "" ""; }
map $http_authorization $sre_api_authorization { default $http_authorization; "" $sre_cookie_bearer; }
# The page path handed to the identity bridge: plain shell paths only, so nothing a request carries can
# be written into the HTML attribute (anything else becomes "", and the bridge then says nothing).
map $uri $sre_bridge_page { ~^/[a-z]+/(?:[a-z0-9-]+\.html)?$ $uri; default ""; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Behind the proxy a redirect must stay a path (`/login/?next=…`): an absolute one would carry this server's plain
  # http scheme out to the browser. The proxy then puts the https origin in front of it.
  absolute_redirect off;

  # Service workers must not be cached, or a lane can be stuck on an old shell (see nginx.conf).
  add_header Cache-Control $sre_no_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = / { return 302 /store/manager/; }

  # ONE application (OB-16, 5 Oct 2026): the product is the store computer's workspace. The old web-front shells
  # — the till, the owner's figures, the handhelds and the back office served from this box with no store computer
  # behind them — are not a second product: each address goes to the store computer's own screen. The supplier
  # portal stays here (a supplier is not a store user; the store computer does not serve it).
  location ~ ^/(pos|owner|picker|warehouse)(/.*)?$ { return 302 /store/$1/; }
  location ~ ^/delivery(/.*)?$ { return 302 /store/driver/; }
  location ~ ^/erp(/.*)?$ { return 302 /store/manager/; }

  # The staff shells this front still serves itself — behind the demo sign-in (ADR-0018 §2: a staff screen joins a
  # public origin only behind a sign-in gate). No session → the sign-in, which comes back here afterwards.
  location ~ ^/(supplier)/ {
    auth_request /_auth/verify;
    error_page 401 = @sre_sign_in;
    try_files $uri $uri/ /$1/index.html;
    # DEMO-ONLY identity bridge (H-11): where a store edge would inject `window.<screen>Data`, load a
    # classic script from the demo sign-in instead. It carries ONLY the signed-in person's userId +
    # permissions (from the live API) for the pages that read their own data from /v1; for every other
    # page it says nothing. Classic, so it runs before the module bundle reads the global.
    sub_filter '<!--SCREEN-DATA-->' '<script src="/login/screen-data.js?page=$sre_bridge_page"></script>';
    sub_filter_once on;
  }

  # The customer app is public by design: on the public origin the proxy serves it from the edge (ADR-0018) and never
  # forwards /customer here; this copy answers the box's own loopback check only.
  location ~ ^/(customer)/ {
    try_files $uri $uri/ /$1/index.html;
  }

  # The API, same origin. The Authorization header and Idempotency-Key pass through unchanged; the
  # caller's address is forwarded so the per-IP rate limit and auth lockout key on the real client.
  location /v1/ {
    proxy_pass http://api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $sre_api_authorization;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 20m;
    proxy_read_timeout 60s;
  }

  # ── The demo sign-in's verdict (ADR-0016) ─────────────────────────────────────────────────────────────
  # Any valid demo session may SEE a screen; writing to the demo box's lane (a sale) also needs a role that may
  # sell. Resolved at request time (Docker's DNS), so this front starts without the sign-in and simply fails.
  location = /_auth/verify {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_gate http://demo-login:8090/login/verify;
    proxy_pass $sre_gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location = /_auth/verify-sell {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_gate_sell http://demo-login:8090/login/verify-sell;
    proxy_pass $sre_gate_sell;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location @sre_sign_in { return 302 /login/?next=$uri; }

  # ── DEMO store box (ADR-0016) ─────────────────────────────────────────────────────────────────────────
  # The demo store edge's screens and till lane, reached through the demo-only relay (edge:8096) and ONLY
  # after the demo sign-in says yes.
  location /store/ {
    auth_request /_auth/verify;
    # OB-16: the sign-in names the person on its "go on"; the box runs the screens as that person. Set here from the
    # gate's answer — whatever a visitor put in a header of that name is overwritten, never passed through.
    auth_request_set $sre_user $upstream_http_x_sre_user;
    error_page 401 = @sre_sign_in;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_relay edge:8096;
    proxy_pass http://$sre_relay;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Sre-User $sre_user;
  }

  # The lane's own status read — "is the store computer there, when did it last hear from head office" — is what
  # every screen's badge asks for. It changes nothing and names no figure, so any signed-in person may read it
  # (RL-2, 4 Oct 2026: gated for sellers only, a manager's badge said "store computer not answering").
  location = /store-lane/lane/sync-status {
    auth_request /_auth/verify;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_relay edge:8096;
    rewrite ^/store-lane/(.*)$ /$1 break;
    proxy_pass http://$sre_relay;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # How this box signs a person in at the till, and whether the till's session is live (ADR-0020). Read-only, names no
  # figure, so any signed-in person may ask — a person who may not sell is then told so at Sign in, not "not answering".
  location = /store-lane/lane/operator {
    auth_request /_auth/verify;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_relay edge:8096;
    rewrite ^/store-lane/(.*)$ /$1 break;
    proxy_pass http://$sre_relay;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # The till and the manager address the lane as `<base>/lane/<route>`; the base on this demo is `/store-lane`, so
  # the path that arrives is `/store-lane/lane/sales` and the relay must see `/lane/sales` — the prefix comes OFF,
  # nothing goes on. (RL-2: it was rewritten to `/lane/lane/sales`, which no route answers, so no sale, day close
  # or status read ever reached the demo store box through the front.)
  location /store-lane/ {
    auth_request /_auth/verify-sell;
    # ADR-0020 §6: the sign-in that let this request through also NAMES the person; the box opens the till session for
    # exactly that person (EDGE_LANE_TRUST_FORWARDED_USER, this overlay only). Set from the gate's answer — whatever a
    # visitor put in a header of that name is overwritten, never passed through.
    auth_request_set $sre_user $upstream_http_x_sre_user;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_relay edge:8096;
    rewrite ^/store-lane/(.*)$ /$1 break;
    proxy_pass http://$sre_relay;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Sre-User $sre_user;
    client_max_body_size 64k;
  }

  # The DEMO-ONLY sign-in. Resolved at request time (Docker's DNS), so this front still starts — and
  # /login/ simply fails — if the demo-login service is absent.
  location /login {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_demo_login http://demo-login:8090;
    proxy_pass $sre_demo_login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 8k;
    # Own header set (so the server-level `Referrer-Policy: no-referrer` is NOT inherited here): under
    # no-referrer a browser posts the sign-in form with `Origin: null`, which the demo sign-in refuses
    # as cross-site. The service sets `Referrer-Policy: same-origin` itself; keep the other two here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
  }
}
