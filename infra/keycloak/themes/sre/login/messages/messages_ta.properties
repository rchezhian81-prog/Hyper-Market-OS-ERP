sre.helpCopy=கடை நிர்வாகி வழங்கிய பணியாளர் எண் அல்லது பணி மின்னஞ்சலைப் பயன்படுத்தவும்.\n\nகடவுச்சொல் மறந்துவிட்டால், புதிய கணக்கு தேவைப்பட்டால் அல்லது அணுகல் சிக்கல் இருந்தால் கடை நிர்வாகியை அணுகவும். கடவுச்சொல்லைப் பகிர வேண்டாம்.\n\nஇந்தக் கணினிக்கும் உங்கள் கணக்கிற்கும் அனுமதி இருந்தால் மட்டுமே இணையமின்றி உள்நுழையலாம்.
sre.connectionTitle=இணைப்பு விவரங்கள்
sre.onlineCopy=இது இணையப் பணித்தளம்: தலைமை அலுவலகம் வழியாக இணையத்தில் உள்நுழைகிறீர்கள்.\n\nகடை கணினியின் நிலை — அது இயங்குகிறதா, பதிவுகள் ஒத்திசைந்தனவா — உள்நுழைந்த பிறகு பணித்தளத்தினுள் காட்டப்படும். இங்கு உள்நுழைவது கடை கணினி இயங்குகிறது என்றோ விற்பனை பதிவு செய்ய முடியும் என்றோ உறுதிப்படுத்தாது.
