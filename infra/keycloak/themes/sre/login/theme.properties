# The identity server's sign-in pages in the owner's approved design (OB-18 · ADR-0019).
#
# parent=base: Keycloak's plain templates, with no PatternFly and nothing fetched from anywhere. Our template.ftl wraps
# every page in the OB-18 frame; the kc*Class names below are our own classes, styled in resources/css/sre-login.css,
# so that the pages we do not rewrite (one-time-code setup, update password, errors, info) look right inside it.
# The stylesheet's first block is LOGIN_CSS from infra/pilot/demo-login/ui.ts, regenerated by
# `pnpm run build:keycloak-theme`.
parent=base
locales=en,ta

styles=css/sre-login.css

# The practice strip ("TRIAL COPY · PRACTICE DATA") shows only where the pilot turns it on, exactly like the rest of
# the product (PILOT_DEMO_BANNER=1, packages/ui/src/demo-banner.ts). Unset, as in production: no strip.
sreTrialStrip=${env.PILOT_DEMO_BANNER:0}

kcHtmlClass=
kcBodyClass=
kcLoginClass=
kcFormCardClass=sl-login-card

## Forms
kcFormClass=sre-form
kcFormGroupClass=sl-field
kcFormGroupErrorClass=sre-has-error
kcLabelClass=sre-label
kcLabelWrapperClass=sre-label-wrap
kcInputClass=sre-input
kcInputWrapperClass=sre-input-wrap
kcInputErrorMessageClass=sre-field-error
kcInputHelperTextBeforeClass=sre-helper
kcInputHelperTextAfterClass=sre-helper
kcInputGroup=sl-input-wrap sre-input-group
kcFormOptionsClass=sre-options
kcFormOptionsWrapperClass=sre-options-wrap
kcFormSettingClass=sre-settings
kcFormButtonsClass=sre-buttons
kcContentWrapperClass=sre-content
kcSignUpClass=sre-info
kcInfoAreaWrapperClass=sre-info-wrap

## Buttons
kcButtonClass=sre-button
kcButtonPrimaryClass=sl-submit
kcButtonDefaultClass=sl-secondary
kcButtonBlockClass=sre-block
kcButtonLargeClass=

## Show/hide password on the pages we inherit (Keycloak's own passwordVisibility.js swaps these icon classes)
kcFormPasswordVisibilityButtonClass=sl-reveal sre-reveal-icon
kcFormPasswordVisibilityIconShow=sre-eye
kcFormPasswordVisibilityIconHide=sre-eye-off

## One-time code: choosing between several registered phones
kcLoginOTPListClass=sre-otp-choice
kcLoginOTPListInputClass=sre-otp-radio
kcLoginOTPListItemHeaderClass=sre-otp-choice-head
kcLoginOTPListItemIconBodyClass=sre-otp-choice-icon
kcLoginOTPListItemIconClass=sre-phone
kcLoginOTPListItemTitleClass=sre-otp-choice-title

## Checkboxes and radios on inherited pages
kcCheckboxInputClass=sre-check
kcInputClassCheckbox=sre-check
kcInputClassCheckboxInput=sre-check-input
kcInputClassCheckboxLabel=sre-check-label
kcInputClassRadio=sre-radio
kcInputClassRadioInput=sre-radio-input
kcInputClassRadioLabel=sre-radio-label

## Alerts (our template draws its own message boxes; these are for any inherited page that asks)
kcAlertClass=sl-notice
kcAlertTitleClass=sre-alert-text
kcResetFlowIcon=
kcFeedbackErrorIcon=
kcFeedbackWarningIcon=
kcFeedbackSuccessIcon=
kcFeedbackInfoIcon=
