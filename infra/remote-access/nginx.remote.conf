# The relay's front — OB-840 · ADR-0035. It runs INSIDE the tunnel container's network, where the line the store computer
# dialled out ends on 127.0.0.1:18095 (and nowhere else). For every request it asks the product's sign-in service "who is
# this?" (`/login/verify`, the same question infra/compose/nginx.identity.conf asks). No session → the sign-in page. A
# session → the request goes down the line WITH the person's current token in Authorization (renewed by the sign-in
# service, never held by the browser) and with every cookie removed; the store computer's remote door checks that token
# itself, against the key it pinned, before anything is reached. Anything a visitor put in Authorization is overwritten.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  # The product's sign-in service: /login/ (to the identity server and back at /login/callback) and /login/logout.
  location /login {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_sign_in_service http://sign-in:8092;
    proxy_pass $sre_sign_in_service;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 8k;
  }

  # "Who is this?" — a session's person and current token, or 401.
  location = /_auth/verify {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sre_gate http://sign-in:8092/login/verify;
    proxy_pass $sre_gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location @sre_sign_in { return 302 /login/?next=$uri; }

  # Everything else goes down the line to the store computer's remote door — only after the sign-in says yes.
  location / {
    auth_request /_auth/verify;
    auth_request_set $sre_bearer $upstream_http_x_sre_bearer;
    error_page 401 = @sre_sign_in;
    proxy_pass http://127.0.0.1:18095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $sre_bearer;
    # The relay's session cookie stays here: the store computer needs only the token.
    proxy_set_header Cookie "";
    proxy_set_header X-Sre-User "";
    client_max_body_size 64k;
    proxy_read_timeout 60s;
    # The store computer is off, or its internet is: say so in words, never a blank page.
    error_page 502 503 504 = @store_not_reachable;
  }
  location @store_not_reachable {
    default_type text/html;
    return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SRE Hyper Market</title><body style="font:16px/1.5 system-ui,sans-serif;padding:24px 16px"><h1>The store computer cannot be reached right now.</h1><p><strong>Was anything saved?</strong> No. Nothing was changed.</p><p><strong>Why:</strong> the shop&#39;s internet or the store computer is off, or the remote link is turned off. Selling in the shop is not affected.</p><p><strong>What to do:</strong> try again in a few minutes. If it goes on, check the store computer in the shop.</p><p lang="ta">கடைக் கணினியை இப்போது அணுக முடியவில்லை. எதுவும் மாற்றப்படவில்லை. கடையில் விற்பனை பாதிக்கப்படவில்லை.</p></body></html>';
  }
}
